<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Ca Trực Đêm: Biệt Đội">
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#161a22"/>
      <stop offset="1" stop-color="#06070a"/>
    </linearGradient>
    <radialGradient id="rs-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3a6" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#d8a758" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8a6a2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rs-cold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fc6e8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#31506b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rs-pad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0b03c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6b5320" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rs-vg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="rs-clip"><rect width="320" height="180"/></clipPath>
  </defs>

  <!--
    Năm cái đèn trong một căn nhà tối: một cái vàng (người chơi cầm) và bốn cái xanh lạnh
    (bốn bot chạy theo chiến thuật). Ô vạch đứt ở dưới là bệ giao hàng.
    Không dùng ảnh ngoài — mọi thứ vẽ bằng hình cơ bản, đúng luật CSP của hub.
  -->
  <g clip-path="url(#rs-clip)">
    <rect width="320" height="180" fill="url(#rs-bg)"/>

    <!-- mặt bằng phòng: tường sáng hơn sàn, cho đọc được bố cục -->
    <g fill="#2b323d" opacity="0.85">
      <rect x="0" y="0" width="320" height="10"/>
      <rect x="0" y="0" width="10" height="180"/>
      <rect x="310" y="0" width="10" height="180"/>
      <rect x="0" y="170" width="320" height="10"/>
      <rect x="104" y="10" width="9" height="52"/>
      <rect x="104" y="96" width="9" height="74"/>
      <rect x="208" y="10" width="9" height="34"/>
      <rect x="208" y="78" width="9" height="92"/>
      <rect x="10" y="70" width="60" height="9"/>
      <rect x="240" y="118" width="70" height="9"/>
    </g>
    <g fill="#3d4655" opacity="0.55">
      <rect x="28" y="26" width="26" height="14"/>
      <rect x="140" y="34" width="18" height="18"/>
      <rect x="248" y="52" width="30" height="12"/>
      <rect x="60" y="126" width="22" height="16"/>
    </g>

    <!-- bệ giao hàng -->
    <circle cx="160" cy="132" r="46" fill="url(#rs-pad)"/>
    <rect x="134" y="112" width="52" height="40" fill="none" stroke="#e0b03c" stroke-width="2.5" stroke-dasharray="7 6"/>

    <!-- quầng đèn -->
    <circle cx="160" cy="120" r="58" fill="url(#rs-lamp)"/>
    <circle cx="60" cy="96" r="40" fill="url(#rs-cold)"/>
    <circle cx="252" cy="88" r="40" fill="url(#rs-cold)"/>

    <!-- người chơi cầm (vàng) -->
    <g>
      <ellipse cx="160" cy="126" rx="10" ry="5" fill="#000" opacity="0.5"/>
      <ellipse cx="160" cy="118" rx="8" ry="10" fill="#e0b03c"/>
      <circle cx="160" cy="114" r="4.4" fill="#fff6df"/>
      <path d="M160 118 L160 104" stroke="#fff0c8" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="160" cy="118" r="13" fill="none" stroke="#ffe3a6" stroke-width="1.4" opacity="0.6"/>
    </g>

    <!-- bốn bot, mỗi đứa một màu chiến thuật -->
    <g>
      <g>
        <ellipse cx="60" cy="104" rx="9" ry="4.5" fill="#000" opacity="0.45"/>
        <ellipse cx="60" cy="96" rx="7.5" ry="9" fill="#5aa06a"/>
        <circle cx="60" cy="92" r="4" fill="#e9f3ea"/>
      </g>
      <g>
        <ellipse cx="252" cy="96" rx="9" ry="4.5" fill="#000" opacity="0.45"/>
        <ellipse cx="252" cy="88" rx="7.5" ry="9" fill="#6f86c4"/>
        <circle cx="252" cy="84" r="4" fill="#e9edf6"/>
      </g>
      <g>
        <ellipse cx="118" cy="66" rx="9" ry="4.5" fill="#000" opacity="0.45"/>
        <ellipse cx="118" cy="58" rx="7.5" ry="9" fill="#a678d8"/>
        <circle cx="118" cy="54" r="4" fill="#f1e9f8"/>
      </g>
      <g>
        <ellipse cx="196" cy="150" rx="9" ry="4.5" fill="#000" opacity="0.45"/>
        <ellipse cx="196" cy="142" rx="7.5" ry="9" fill="#c47a45"/>
        <circle cx="196" cy="138" r="4" fill="#f8ece1"/>
      </g>
    </g>

    <!-- đồ đang nằm chờ khuân -->
    <g>
      <circle cx="86" cy="44" r="5" fill="#b07a3c"/>
      <circle cx="278" cy="140" r="6" fill="#b9c2c9"/>
      <circle cx="146" cy="80" r="4.5" fill="#5f8f96"/>
    </g>

    <!-- một con đang đứng trong bóng tối -->
    <g opacity="0.9">
      <ellipse cx="292" cy="34" rx="10" ry="4.5" fill="#000" opacity="0.5"/>
      <path d="M292 16 L302 32 L282 32 Z" fill="#b9b3a6"/>
      <circle cx="294" cy="27" r="2.2" fill="#ff5a4a"/>
    </g>

    <!-- tối góc -->
    <rect width="320" height="180" fill="url(#rs-vg)"/>
  </g>
</svg>
