<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Quần Đảo Sao Rơi">
  <defs>
    <linearGradient id="sr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c98b"/>
      <stop offset="0.42" stop-color="#8fc8d6"/>
      <stop offset="1" stop-color="#63a8bd"/>
    </linearGradient>
    <linearGradient id="sr-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa6bd"/>
      <stop offset="0.5" stop-color="#3d84a2"/>
      <stop offset="1" stop-color="#2b6484"/>
    </linearGradient>
    <linearGradient id="sr-grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc74e"/>
      <stop offset="1" stop-color="#5f9a37"/>
    </linearGradient>
    <linearGradient id="sr-grass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab944"/>
      <stop offset="1" stop-color="#4d872f"/>
    </linearGradient>
    <radialGradient id="sr-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="180" fill="url(#sr-sky)"/>

  <!-- mặt trời thấp và quầng sáng trên biển -->
  <circle cx="248" cy="40" r="34" fill="url(#sr-sun)"/>
  <circle cx="248" cy="40" r="12" fill="#ffdf95"/>

  <!-- mây mỏng -->
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="60" cy="30" rx="26" ry="6"/>
    <ellipse cx="76" cy="26" rx="16" ry="5"/>
    <ellipse cx="196" cy="20" rx="20" ry="5"/>
  </g>

  <!-- biển -->
  <path d="M0 74 L320 74 L320 180 L0 180 Z" fill="url(#sr-sea)"/>

  <!-- sóng gợn -->
  <g stroke="#a9dbe8" stroke-width="1.4" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M14 96 q7 -3 14 0"/>
    <path d="M250 100 q7 -3 14 0"/>
    <path d="M40 128 q8 -3.5 16 0"/>
    <path d="M212 138 q8 -3.5 16 0"/>
    <path d="M96 158 q9 -4 18 0"/>
    <path d="M248 166 q9 -4 18 0"/>
    <path d="M160 118 q7 -3 14 0"/>
  </g>

  <!-- ĐẢO XA, CHƯA MUA: nhạt đi, có ổ khoá -->
  <g opacity="0.42">
    <ellipse cx="268" cy="88" rx="34" ry="9" fill="#1d4f66"/>
    <path d="M236 86 q10 -12 32 -12 q22 0 32 12 q-10 8 -32 8 q-22 0 -32 -8 Z" fill="#cbd8c6"/>
    <path d="M236 86 q10 6 32 6 q22 0 32 -6 l-4 7 q-12 6 -28 6 q-16 0 -28 -6 Z" fill="#e6d8b0"/>
    <g fill="#5c6f5a">
      <path d="M254 76 l4 -9 l4 9 Z"/>
      <path d="M276 75 l4 -8 l4 8 Z"/>
    </g>
  </g>
  <g transform="translate(262,62)" opacity="0.8">
    <rect x="-7" y="-1" width="14" height="11" rx="2" fill="#2c2218"/>
    <path d="M-4 -1 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#2c2218" stroke-width="2"/>
    <circle cx="0" cy="4" r="1.6" fill="#e8a13c"/>
  </g>

  <!-- ĐẢO GIỮA: bãi cỏ cao, chỗ gặp quái -->
  <ellipse cx="228" cy="128" rx="52" ry="13" fill="#1d4f66" opacity="0.55"/>
  <path d="M180 126 q14 -20 48 -20 q34 0 48 20 q-14 12 -48 12 q-34 0 -48 -12 Z" fill="#e8d6a8"/>
  <path d="M182 122 q14 -18 46 -18 q32 0 46 18 q-14 9 -46 9 q-32 0 -46 -9 Z" fill="url(#sr-grass2)"/>
  <!-- cỏ cao -->
  <g stroke="#2f6b28" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M204 118 q-2 -6 1 -9"/><path d="M208 119 q2 -6 -1 -10"/>
    <path d="M212 117 q-2 -7 1 -10"/><path d="M217 119 q2 -6 -1 -9"/>
    <path d="M222 118 q-2 -7 1 -10"/><path d="M227 119 q2 -6 -1 -9"/>
    <path d="M232 117 q-2 -6 1 -9"/><path d="M237 119 q2 -7 -1 -10"/>
    <path d="M242 118 q-2 -6 1 -9"/><path d="M247 119 q2 -6 -1 -9"/>
  </g>
  <!-- hai con mắt trong bụi cỏ -->
  <g fill="#ffffff">
    <circle cx="224" cy="115" r="2.2"/><circle cx="231" cy="115" r="2.2"/>
  </g>
  <g fill="#22303a">
    <circle cx="224.6" cy="115.3" r="1.1"/><circle cx="231.6" cy="115.3" r="1.1"/>
  </g>

  <!-- CẦU nối hai đảo đã mua -->
  <g>
    <path d="M120 132 L180 124" stroke="#8a5f34" stroke-width="7" stroke-linecap="round"/>
    <path d="M120 132 L180 124" stroke="#b98247" stroke-width="4.5" stroke-linecap="round"/>
    <g stroke="#7a5229" stroke-width="1" opacity="0.7">
      <path d="M132 132.5 v-2.6"/><path d="M144 130.9 v-2.6"/>
      <path d="M156 129.3 v-2.6"/><path d="M168 127.7 v-2.6"/>
    </g>
  </g>

  <!-- ĐẢO NHÀ: nông trại, luống cây, nhà nhỏ -->
  <ellipse cx="82" cy="146" rx="70" ry="17" fill="#1d4f66" opacity="0.55"/>
  <path d="M18 144 q18 -26 64 -26 q46 0 64 26 q-18 15 -64 15 q-46 0 -64 -15 Z" fill="#e8d6a8"/>
  <path d="M21 139 q18 -24 61 -24 q43 0 61 24 q-18 11 -61 11 q-43 0 -61 -11 Z" fill="url(#sr-grass)"/>

  <!-- luống đất đã cuốc -->
  <g fill="#8a5f34" opacity="0.9">
    <ellipse cx="66" cy="136" rx="21" ry="5"/>
    <ellipse cx="66" cy="143" rx="18" ry="4.2"/>
  </g>
  <!-- cây con trên luống -->
  <g stroke="#3f7d2c" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M52 136 v-4"/><path d="M60 135.5 v-4.5"/><path d="M68 135.5 v-4.5"/>
    <path d="M76 136 v-4"/><path d="M58 143 v-3.5"/><path d="M68 143 v-3.5"/><path d="M78 143 v-3.5"/>
  </g>
  <g fill="#5fa84a">
    <circle cx="52" cy="131" r="2"/><circle cx="60" cy="130.4" r="2"/>
    <circle cx="68" cy="130.4" r="2"/><circle cx="76" cy="131" r="2"/>
  </g>

  <!-- nhà -->
  <g>
    <rect x="98" y="118" width="24" height="16" rx="1.5" fill="#e4d3b4"/>
    <path d="M95 119 L110 108 L125 119 Z" fill="#c0453b"/>
    <rect x="106" y="125" width="7" height="9" fill="#8a5f34"/>
    <rect x="115" y="122" width="5" height="5" fill="#8fd0e0"/>
    <rect x="103" y="103" width="4" height="7" fill="#a8a29a"/>
  </g>

  <!-- cây -->
  <g>
    <rect x="35" y="122" width="3.5" height="9" fill="#7a5229"/>
    <circle cx="36.7" cy="119" r="8" fill="#4f9137"/>
    <circle cx="32" cy="121" r="5.5" fill="#5da341"/>
    <circle cx="41" cy="121" r="5.5" fill="#5da341"/>
  </g>

  <!-- người chơi cầm bình tưới -->
  <g>
    <ellipse cx="88" cy="133" rx="4.5" ry="1.6" fill="#000" opacity="0.18"/>
    <rect x="85.4" y="124" width="5" height="8" rx="2" fill="#3f6fa8"/>
    <circle cx="87.9" cy="120.5" r="4" fill="#f0c9a0"/>
    <path d="M84 118 q4 -4 8 0 q-4 -1.5 -8 0 Z" fill="#6b4423"/>
    <rect x="91" y="126" width="4.5" height="4" rx="1" fill="#a8b4bd"/>
    <path d="M95.5 127 l3 -2 l-1 3 Z" fill="#a8b4bd"/>
  </g>

  <!-- sao rơi -->
  <g stroke="#fff6d8" stroke-width="1.6" stroke-linecap="round" opacity="0.9" fill="none">
    <path d="M150 26 l12 -9"/>
    <path d="M172 40 l8 -6"/>
  </g>
  <circle cx="149" cy="27" r="2" fill="#fff6d8"/>
  <circle cx="171" cy="41" r="1.4" fill="#fff6d8"/>

  <!-- viền tối nhẹ cho khung -->
  <rect width="320" height="180" fill="none" stroke="#0b1016" stroke-width="2" opacity="0.25"/>
</svg>
