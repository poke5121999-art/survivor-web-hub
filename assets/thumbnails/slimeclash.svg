<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="SlimeClash">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#12141c"/>
    </linearGradient>
    <linearGradient id="sc-foe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8483d"/>
      <stop offset="1" stop-color="#ff8a7a"/>
    </linearGradient>
    <linearGradient id="sc-me" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ecf6b"/>
      <stop offset="1" stop-color="#7ef2a8"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#sc-bg)"/>

  <!-- thanh máu địch -->
  <rect x="96" y="12" width="128" height="7" rx="3.5" fill="#2f364a"/>
  <rect x="96" y="12" width="86" height="7" rx="3.5" fill="url(#sc-foe)"/>

  <!-- lưới địch 6x3 (phần nhìn thấy), hàng giáp mặt ở dưới -->
  <g>
    <rect x="96"  y="26" width="18" height="18" rx="4" fill="#4a90e8"/>
    <rect x="118" y="26" width="18" height="18" rx="4" fill="#e8574a"/>
    <rect x="140" y="26" width="18" height="18" rx="4" fill="#47c26a"/>
    <rect x="162" y="26" width="18" height="18" rx="4" fill="#4a90e8"/>
    <rect x="184" y="26" width="18" height="18" rx="4" fill="#e8574a"/>
    <rect x="206" y="26" width="18" height="18" rx="4" fill="#47c26a"/>

    <rect x="96"  y="48" width="18" height="18" rx="4" fill="#e8574a"/>
    <rect x="118" y="48" width="18" height="18" rx="4" fill="#e8574a"/>
    <rect x="140" y="48" width="18" height="18" rx="4" fill="#4a90e8"/>
    <rect x="162" y="48" width="18" height="18" rx="4" fill="#47c26a"/>
    <!-- tường ngang của địch -->
    <rect x="184" y="48" width="40" height="18" rx="2" fill="#8a4a44" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <!-- đường giữa: đòn bay theo cột -->
  <line x1="96" y1="78" x2="224" y2="78" stroke="#2f364a" stroke-width="1"/>
  <g stroke="#7ef2a8" stroke-width="2.5" stroke-linecap="round">
    <line x1="127" y1="86" x2="127" y2="70"/>
    <line x1="127" y1="70" x2="123" y2="75"/>
    <line x1="127" y1="70" x2="131" y2="75"/>
  </g>

  <!-- lưới người chơi: một đội hình dọc 3 ô cùng màu đang nạp -->
  <g>
    <rect x="96"  y="90" width="18" height="18" rx="4" fill="#4a90e8"/>
    <rect x="118" y="90" width="18" height="18" rx="4" fill="#47c26a" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
    <rect x="140" y="90" width="18" height="18" rx="4" fill="#e8574a"/>
    <rect x="162" y="90" width="18" height="18" rx="4" fill="#4a90e8"/>
    <rect x="184" y="90" width="18" height="18" rx="4" fill="#47c26a"/>
    <rect x="206" y="90" width="18" height="18" rx="4" fill="#e8574a"/>

    <rect x="96"  y="112" width="18" height="18" rx="4" fill="#e8574a"/>
    <rect x="118" y="112" width="18" height="18" rx="4" fill="#47c26a" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
    <rect x="140" y="112" width="18" height="18" rx="4" fill="#4a90e8"/>
    <rect x="162" y="112" width="18" height="18" rx="4" fill="#e8574a"/>
    <rect x="184" y="112" width="18" height="18" rx="4" fill="#4a90e8"/>
    <rect x="206" y="112" width="18" height="18" rx="4" fill="#47c26a"/>

    <rect x="96"  y="134" width="18" height="18" rx="4" fill="#47c26a"/>
    <rect x="118" y="134" width="18" height="18" rx="4" fill="#47c26a" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
    <rect x="140" y="134" width="18" height="18" rx="4" fill="#e8574a"/>
    <rect x="162" y="134" width="18" height="18" rx="4" fill="#4a90e8"/>
    <rect x="184" y="134" width="18" height="18" rx="4" fill="#e8574a"/>
    <rect x="206" y="134" width="18" height="18" rx="4" fill="#4a90e8"/>
  </g>

  <!-- thanh máu người chơi -->
  <rect x="96" y="160" width="128" height="7" rx="3.5" fill="#2f364a"/>
  <rect x="96" y="160" width="112" height="7" rx="3.5" fill="url(#sc-me)"/>

  <!-- nhãn -->
  <text x="16" y="34" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e8ecf6">Slime</text>
  <text x="16" y="52" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#7ef2a8">Clash</text>
  <text x="16" y="76" font-family="system-ui,sans-serif" font-size="9" fill="#8c96ae">ghép ô ·</text>
  <text x="16" y="88" font-family="system-ui,sans-serif" font-size="9" fill="#8c96ae">theo lượt</text>
  <text x="16" y="108" font-family="system-ui,sans-serif" font-size="9" fill="#8c96ae">lưới 6×6</text>
  <text x="16" y="120" font-family="system-ui,sans-serif" font-size="9" fill="#8c96ae">3 bước/lượt</text>
</svg>
