<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Survivor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2233"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d8bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4d8bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <circle cx="160" cy="92" r="70" fill="url(#glow)"/>
  <!-- player -->
  <circle cx="160" cy="92" r="12" fill="#e7e9ee"/>
  <!-- radiating projectiles -->
  <g fill="#6ea8fe">
    <circle cx="160" cy="40" r="4"/>
    <circle cx="160" cy="24" r="3"/>
    <circle cx="212" cy="92" r="4"/>
    <circle cx="232" cy="92" r="3"/>
    <circle cx="160" cy="144" r="4"/>
    <circle cx="160" cy="160" r="3"/>
    <circle cx="108" cy="92" r="4"/>
    <circle cx="88" cy="92" r="3"/>
    <circle cx="196" cy="56" r="3"/>
    <circle cx="124" cy="128" r="3"/>
    <circle cx="196" cy="128" r="3"/>
    <circle cx="124" cy="56" r="3"/>
  </g>
  <!-- enemies closing in -->
  <g fill="#ff6b6b" opacity="0.9">
    <rect x="40" y="30" width="9" height="9" rx="2"/>
    <rect x="272" y="42" width="9" height="9" rx="2"/>
    <rect x="52" y="140" width="9" height="9" rx="2"/>
    <rect x="266" y="132" width="9" height="9" rx="2"/>
    <rect x="20" y="86" width="9" height="9" rx="2"/>
  </g>
  <text x="16" y="166" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#e7e9ee">SURVIVOR</text>
</svg>
