<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202c"/><stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="chu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7fd6ff"/>
    </linearGradient>
    <linearGradient id="cv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b9d"/><stop offset=".35" stop-color="#ffd76e"/>
      <stop offset=".7" stop-color="#5fe0b0"/><stop offset="1" stop-color="#6fc4f0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#nen)"/>

  <!-- bản đồ ba đường, nhìn từ trên xuống -->
  <g opacity=".5" fill="none" stroke="#3a6045" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 148 L42 52 L150 40"/>
    <path d="M42 148 L150 148 L262 132"/>
    <path d="M42 148 L150 92 L262 40"/>
  </g>
  <g opacity=".28" stroke="#4a9df8" stroke-width="12" stroke-linecap="round">
    <path d="M30 160 L275 32"/>
  </g>
  <g fill="#1d5f8f" stroke="#7fd6ff" stroke-width="1.5">
    <rect x="38" y="112" width="9" height="9"/><rect x="38" y="74" width="9" height="9"/>
    <rect x="86" y="144" width="9" height="9"/><rect x="104" y="112" width="9" height="9"/>
  </g>
  <g fill="#8f2d33" stroke="#ff9ec4" stroke-width="1.5">
    <rect x="196" y="46" width="9" height="9"/><rect x="230" y="42" width="9" height="9"/>
    <rect x="212" y="122" width="9" height="9"/><rect x="186" y="88" width="9" height="9"/>
  </g>
  <!-- năm người mỗi bên -->
  <g>
    <circle cx="96" cy="120" r="5" fill="#e8a35a" stroke="#3ddc97" stroke-width="2"/>
    <circle cx="112" cy="104" r="5" fill="#6fc4f0" stroke="#3ddc97" stroke-width="2"/>
    <circle cx="128" cy="118" r="5" fill="#b08af0" stroke="#3ddc97" stroke-width="2"/>
    <circle cx="180" cy="70" r="5" fill="#ff8fb0" stroke="#e5484d" stroke-width="2"/>
    <circle cx="196" cy="84" r="5" fill="#5fe0b0" stroke="#e5484d" stroke-width="2"/>
  </g>

  <!-- năm giáo án -->
  <g transform="translate(20,12)">
    <rect x="0" y="0" width="26" height="14" rx="4" fill="#111926" stroke="url(#cv)" stroke-width="1.5"/>
    <rect x="30" y="0" width="26" height="14" rx="4" fill="#111926" stroke="#26303f"/>
    <rect x="60" y="0" width="26" height="14" rx="4" fill="#111926" stroke="#26303f"/>
    <rect x="90" y="0" width="26" height="14" rx="4" fill="#111926" stroke="#26303f"/>
    <rect x="120" y="0" width="26" height="14" rx="4" fill="#111926" stroke="#26303f"/>
  </g>

  <text x="160" y="98" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif"
        font-size="34" font-weight="800" letter-spacing="6" fill="url(#chu)">GHẾ NÓNG</text>
  <text x="160" y="118" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif"
        font-size="10" letter-spacing="2" fill="#8b98a9">nuôi quân · cấm chọn · mô phỏng trận</text>
</svg>
