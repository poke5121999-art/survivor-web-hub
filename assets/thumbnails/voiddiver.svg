<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Void Diver">
  <defs>
    <linearGradient id="vd-bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0a0c14"/>
      <stop offset="1" stop-color="#030408"/>
    </linearGradient>
    <radialGradient id="vd-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.58"/>
      <stop offset="0.5" stop-color="#e0a049" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a56f2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vd-mad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c600ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#c600ff" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="vd-shaft" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e8b46a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8b46a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#vd-bg)"/>

  <!-- remembered geometry, dim: the part of the shaft you have already been through -->
  <g fill="#141a26" opacity="0.85">
    <rect x="18" y="16" width="46" height="14"/>
    <rect x="18" y="34" width="22" height="30"/>
    <rect x="248" y="22" width="54" height="18"/>
    <rect x="264" y="44" width="38" height="26"/>
    <rect x="24" y="126" width="40" height="16"/>
    <rect x="258" y="128" width="46" height="20"/>
    <rect x="96" y="10" width="18" height="12"/>
    <rect x="212" y="150" width="34" height="14"/>
  </g>

  <!-- the lit wedge: a vertical shaft opening into a room, walls cutting the light -->
  <path d="M160 96 L104 30 L128 22 L150 40 L170 40 L192 22 L216 30 Z" fill="url(#vd-shaft)"/>
  <path d="M160 96 L96 150 L108 168 L212 168 L224 150 Z" fill="url(#vd-shaft)" opacity="0.7"/>
  <path d="M160 96 L58 78 L58 62 L104 68 Z" fill="url(#vd-shaft)" opacity="0.5"/>
  <path d="M160 96 L262 84 L262 100 L206 104 Z" fill="url(#vd-shaft)" opacity="0.45"/>

  <!-- lit floor + wall lips inside the light -->
  <g>
    <rect x="112" y="66" width="96" height="70" fill="#1d2634"/>
    <rect x="112" y="132" width="96" height="4" fill="#55648a" opacity="0.8"/>
    <rect x="112" y="62" width="96" height="4" fill="#3d4963"/>
    <g fill="#26313f">
      <rect x="126" y="80" width="5" height="3"/>
      <rect x="176" y="94" width="5" height="3"/>
      <rect x="140" y="118" width="5" height="3"/>
      <rect x="192" y="72" width="5" height="3"/>
    </g>
  </g>

  <!-- lantern falloff -->
  <circle cx="160" cy="96" r="74" fill="url(#vd-lamp)"/>

  <!-- artifacts on the floor -->
  <g>
    <rect x="127" y="106" width="9" height="9" fill="#c9a0d8" opacity="0.95" transform="rotate(14 131 110)"/>
    <rect x="186" y="82" width="8" height="8" fill="#8fd0c4" opacity="0.9" transform="rotate(-18 190 86)"/>
    <rect x="171" y="122" width="8" height="8" fill="#e0a049" opacity="0.85" transform="rotate(8 175 126)"/>
  </g>

  <!-- a thing at the edge of the light, facing you -->
  <g transform="translate(206,120)">
    <circle r="9" fill="#6a3f7a"/>
    <path d="M0 0 L-9 -3 A9 9 0 0 1 -9 3 Z" fill="#000" opacity="0.45"/>
  </g>

  <!-- the diver -->
  <g transform="translate(160,96)">
    <circle r="7.5" fill="#dfe4ee"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <!-- exit ring, always faintly readable -->
  <g transform="translate(66,44)">
    <circle r="11" fill="#5ac8b4" fill-opacity="0.10" stroke="#5ac8b4" stroke-opacity="0.55" stroke-width="1.6"/>
  </g>

  <!-- corruption creeping in from the corner -->
  <rect width="320" height="180" fill="url(#vd-mad)"/>
  <g opacity="0.5">
    <rect x="0" y="38" width="320" height="3" fill="#c600ff" opacity="0.16"/>
    <rect x="0" y="142" width="320" height="2" fill="#c600ff" opacity="0.12"/>
  </g>

  <!-- vignette -->
  <rect width="320" height="180" fill="none"/>
  <path d="M0 0 h320 v180 h-320 Z M0 0" fill="none"/>
  <radialGradient id="vd-vig" cx="0.5" cy="0.5" r="0.72">
    <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
  </radialGradient>
  <rect width="320" height="180" fill="url(#vd-vig)"/>
</svg>
