<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Thử anim · Xưởng 3D</title>
  <meta name="description" content="Chạy anim Mixamo lên model đã có xương của Xưởng 3D." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/design.css" />
  <link rel="stylesheet" href="css/gen3d-studio.css?v=20261119d" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script src="js/session.js"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    (function () {
      if (/[?&]mock=1\b/.test(location.search)) return;
      var c = window.SUPABASE_CONFIG || {};
      if (!(c.url && c.anonKey)) return;
      var s = window.HubSession && window.HubSession.get();
      if (!s || s.kind !== "member") location.replace("login.html?next=gen3d.html");
    })();
  </script>
</head>
<body class="g3-body">
  <header class="g3-top">
    <a class="g3-top__hub" id="ga-back" href="gen3d.html">← Xưởng 3D</a>
    <b class="g3-top__title">Thử anim</b>
    <span class="g3-top__sub" id="ga-model"></span>
    <span class="g3-spacer"></span>
  </header>
  <div id="g3-banner" class="dz-banner g3-banner" role="alert" hidden></div>
  <div class="ga-app">
    <aside class="ga-list">
      <input id="ga-q" class="g3-input" type="search" placeholder="Tìm anim theo tên hoặc mô tả…" aria-label="Tìm anim" />
      <div class="g3-dim" id="ga-count" style="margin-top:6px"></div>
      <div id="ga-items" class="ga-items" role="listbox" aria-label="Danh sách anim"></div>
    </aside>
    <main id="ga-view" class="g3-view">
      <div class="g3-bar">
        <div class="g3-bar__row ga-ctl">
          <button id="ga-play" class="g3-tb g3-tb--primary" type="button">⏸ Dừng</button>
          <input id="ga-scrub" class="ga-scrub" type="range" min="0" max="1000" value="0" aria-label="Thời điểm" />
          <span id="ga-time" class="ga-time">0.00 / 0.00 s</span>
        </div>
        <div class="g3-bar__row ga-ctl">
          <label>Tốc độ <input id="ga-speed" type="range" min="0.1" max="2" step="0.05" value="1" /> <span id="ga-speedv">1.00×</span></label>
          <label><input id="ga-loop" type="checkbox" class="g3-toggle" checked /> Lặp</label>
          <label title="Xoá dịch chuyển ngang của Hips: nhân vật chạy tại chỗ"><input id="ga-inplace" type="checkbox" class="g3-toggle" /> Tại chỗ</label>
          <label><input id="ga-grid" type="checkbox" class="g3-toggle" checked /> Lưới nền</label>
          <label><input id="ga-skel" type="checkbox" class="g3-toggle" /> Xương</label>
        </div>
      </div>
    </main>
  </div>
  <div id="g3-toasts" class="dz-toasts" role="status"></div>
  <script src="js/supabase-auth.js"></script>
  <script type="module" src="js/gen3d-anim.js?v=20261119b"></script>
</body>
</html>
