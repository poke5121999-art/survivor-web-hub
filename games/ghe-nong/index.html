<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Ghế Nóng</title>
<!-- biểu tượng nhúng thẳng: không có dòng này thì mọi lần tải đều kèm một 404 favicon.ico -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22h14v3H9z' fill='%233ddc97'/%3E%3Cpath d='M11 12h10v9H11z' fill='%23e5484d'/%3E%3Cpath d='M13 6c0 3-3 3-3 6h4c0-2 2-3 2-6z' fill='%23f2c94c'/%3E%3C/svg%3E">

</head>
<body>

<!-- Toàn bộ game vẽ trong khung 1280x720 rồi phóng to bằng transform:scale.
     Lý do: mọi toạ độ trong code là toạ độ cố định, không phải tính lại theo màn hình. -->
<div id="san">
  <div id="khung">

    <!-- ══ MÀN CHỜ / TẢI ══ -->
    <div class="man" id="man-tai">
      <div class="tai-giua">
        <div class="tai-logo">GHẾ NÓNG</div>
        <div class="tai-phu">quản lý đội tuyển · mùa giải không có chỗ cho người hiền</div>
        <div class="tai-thanh"><i></i></div>
      </div>
    </div>

    <!-- ══ MÀN CHÍNH (CLB) ══ -->
    <!-- ══ MÀN CLB ══
         Bố cục lấy của màn Menu / Trainee Select trong Uma Musume (ảnh
         esport-ref/uma/sheets_guide/sheet001.jpg): thanh trên sáng có viên ví bo tròn,
         nội dung ở giữa, cột phải là thẻ hành động, và THANH NÚT LỚN Ở ĐÁY — Uma điều
         hướng bằng hàng nút dưới đáy chứ không phải menu dọc bên trái. -->
    <div class="man uma-clb" id="man-clb" hidden>
      <div class="uc-tren">
        <span class="uc-crest">GN</span>
        <div class="uc-ten"><b id="clb-ten">CLB Chưa Đặt Tên</b><span id="clb-mua">Mùa 1</span></div>
        <div class="uc-vi">
          <span class="uc-dong" title="Xu"><i>🪙</i><b id="vi-xu">0</b></span>
          <span class="uc-dong" title="Vé chơi"><i>🎟️</i><b id="vi-ve">5/5</b></span>
          <span class="uc-dong" title="Danh tiếng"><i>💗</i><b id="vi-fan">0</b></span>
        </div>
      </div>
      <div class="uc-than">
        <div class="uc-giua" id="clb-giua"></div>
        <aside class="uc-phai" id="clb-phai"></aside>
      </div>
      <nav class="uc-day" id="clb-menu"></nav>
    </div>

    <!-- ══ MÀN CHUẨN BỊ CA (chọn 1 HLV + 5 tuyển thủ + 2 cựu HLV) ══ -->
    <div class="man" id="man-chuanbi" hidden></div>

    <!-- ══ MÀN HUẤN LUYỆN ══ -->
    <!-- ══ MÀN HUẤN LUYỆN ══
         Bố cục dựng theo màn Career của Uma Musume, bản PC (ảnh steam/shot05.jpg):
           [ khung game ] [ panel Log ] [ rail icon dọc ]
         Trong khung game, từ trên xuống: badge số lượt · mục tiêu + thanh thể lực cầu vồng ·
         tâm trạng · nhân vật đứng giữa cảnh · bảng năm chỉ số · hai hàng nút viên thuốc. -->
    <div class="man" id="man-ca" hidden>
      <div class="uma-san">
        <div class="uma-nen" id="ca-canh-nen"></div>
        <div class="ca-bay" id="ca-bay"></div>

        <div class="uma-tren">
          <div class="uma-luot"><b id="ca-luot-so">1</b><span>/<i id="ca-luot-tong">24</i> lượt</span></div>
          <div class="uma-mt">
            <div class="uma-goal">
              <span class="ic">◉</span>
              <b id="ca-mucteu-chu">—</b>
              <button id="ca-nut-lich">Lịch</button>
            </div>
            <div class="uma-luc">
              <span>Thể lực</span>
              <div class="uma-thanh"><i id="ca-luc-thanh"></i></div>
              <em id="ca-luc-so">100/100</em>
            </div>
          </div>
          <div class="uma-tam" id="ca-tam">THƯỜNG</div>
        </div>

        <div class="uma-duoi">
          <div class="uma-chiso" id="bang-chiso"></div>
          <div class="uma-san-nut" id="hang-san"></div>
          <div class="uma-hong" id="ca-hong" hidden>Hỏng: <b>0%</b></div>
          <div class="uma-viec" id="hang-viec"></div>
        </div>
      </div>

      <div class="uma-log">
        <div class="uma-log-dau">Nhật ký</div>
        <div class="uma-log-than" id="nk-than"></div>
      </div>

      <nav class="uma-rail" id="ca-rail"></nav>
    </div>

    <!-- ══ MÀN BAN/PICK ══ -->
    <div class="man" id="man-draft" hidden></div>

    <!-- ══ MÀN CHIẾN THUẬT ══ -->
    <div class="man" id="man-chienthuat" hidden></div>

    <!-- ══ MÀN TRẬN ĐẤU ══ -->
    <div class="man" id="man-tran" hidden></div>

    <!-- ══ MÀN GACHA ══ -->
    <div class="man" id="man-gacha" hidden></div>

    <!-- ══ LỚP PHỦ: hộp thoại, sự kiện, thông báo ══ -->
    <div id="lop-phu" hidden></div>
    <div id="banner-lon" hidden></div>
    <div id="phao-hoa"></div>
  </div>
</div>

<!-- nhắc xoay ngang -->
<div id="nhac-xoay" hidden>
  <div class="xoay-hop">
    <div class="xoay-icon">▭</div>
    <div class="xoay-chu">Xoay ngang máy để chơi</div>
    <button id="xoay-bo">Cứ chơi dọc</button>
  </div>
</div>
