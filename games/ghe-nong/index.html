<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Ghế Nóng</title>
<!-- biểu tượng nhúng thẳng: không có dòng này thì mọi lần tải đều kèm một 404 favicon.ico -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 22h14v3H9z' fill='%233ddc97'/%3E%3Cpath d='M11 12h10v9H11z' fill='%23e5484d'/%3E%3Cpath d='M13 6c0 3-3 3-3 6h4c0-2 2-3 2-6z' fill='%23f2c94c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap">

</head>
<body>

<!-- Toàn bộ game vẽ trong khung 1280x720 rồi phóng to bằng transform:scale.
     Lý do: mọi toạ độ trong code là toạ độ cố định, không phải tính lại theo màn hình. -->
<div id="san">
  <div id="khung">

    <!-- ══ MÀN CHỜ / TẢI ══ -->
    <div class="man" id="man-tai">
      <div class="tai-giua">
        <div class="tai-logo">GHẾ NÓNG</div>
        <div class="tai-phu">quản lý đội tuyển · mùa giải không có chỗ cho người hiền</div>
        <div class="tai-thanh"><i></i></div>
      </div>
    </div>

    <!-- ══ MÀN CHÍNH (CLB) ══ -->
    <!-- ══ MÀN NGOÀI RUN (Home của Uma) ══
         Đọc từ esport-ref/uma/sheets_career/sheet001.jpg và sheets_guide/sheet001-003.jpg.
         Bản PC của Uma chia đôi màn: "màn hình game" dọc bên trái, PANEL bên phải (Menu /
         Sparks / Log tuỳ ngữ cảnh). Trong màn hình game, từ dưới lên:

           • THANH NÚT DƯỚI — ĐÚNG 5 nút: Enhance · Story · Home · Race · Scout,
             nút giữa (Home) to hơn và tô xanh.
           • BA NÚT TRÒN nhỏ nổi phía trên thanh ấy: Club · Concert Theater · Shop.
           • MỘT NÚT LỚN "CAREER" — cửa duy nhất để vào một run. Nó KHÔNG nằm trong thanh
             nút dưới; đó là điểm mấu chốt: run là một chế độ riêng, không phải một tab.

         Bản trước ở đây gộp tất cả thành tám nút ngang bằng nhau, nên "Ca huấn luyện" chỉ
         là một tab như mọi tab khác và bảng xếp hạng của mùa (thứ chỉ tồn tại trong một
         run) lại nằm ngoài run. Đó là chỗ lẫn. -->
    <div class="man uma-clb" id="man-clb" hidden>
      <div class="uc-game">
        <div class="uc-tren">
          <span class="uc-hang" id="clb-hang"><b>E</b><i>0</i></span>
          <span class="uc-crest">GN</span>
          <div class="uc-ten"><b id="clb-ten">CLB Chưa Đặt Tên</b><span id="clb-mua">Mùa 1</span></div>
          <div class="uc-vi">
            <span class="uc-dong" title="Xu"><i>🪙</i><b id="vi-xu">0</b></span>
            <span class="uc-dong" title="Danh tiếng"><i>💗</i><b id="vi-fan">0</b></span>
          </div>
        </div>
        <div class="uc-noi" id="clb-giua"></div>
        <div class="uc-duoi">
          <div class="uc-tron" id="clb-tron"></div>
          <div class="uc-career" id="clb-career"></div>
        </div>
        <nav class="uc-day" id="clb-menu"></nav>
      </div>
      <aside class="uc-panel" id="clb-phai"></aside>
    </div>

    <!-- ══ MÀN CHUẨN BỊ CA (chọn 1 HLV + 5 tuyển thủ + 2 cựu HLV) ══ -->
    <div class="man" id="man-chuanbi" hidden></div>

    <!-- ══ MÀN HUẤN LUYỆN ══
         Chép màn Career / Training của Uma Musume bản PC (esport-ref/uma/steam/shot05.jpg, 1920×1080,
         thu về 2/3): khung game dọc 540×720 ở x 99, panel Log ở x 693, rail ở x 1171.
         Ảnh, nút, khung, hoạt ảnh đều là tệp gốc của Uma (art/uma/ca, art/uma/fl, art/uma/nen). -->
    <div class="man" id="man-ca" hidden>
      <div class="ca-khung" id="ca-khung">
        <div class="ca-nen" id="ca-nen"></div>
        <div class="ca-nguoi" id="ca-nguoi"></div>
        <canvas class="ca-fl" id="ca-fl" width="1080" height="1440"></canvas>

        <div class="ca-tieude"><b id="ca-nhan">Ca huấn luyện</b><button class="ca-i" id="ca-nut-so"></button></div>
        <div class="ca-gd" id="ca-gd"></div>
        <div class="ca-lich" id="ca-lich"><b id="ca-luot-so">1</b><span>lượt còn lại</span></div>
        <div class="ca-goal">
          <span class="ca-goal-nhan">Mục tiêu</span>
          <b id="ca-mucteu-chu"></b>
          <button id="ca-nut-lich">Chi tiết</button>
        </div>
        <div class="ca-luc"><span>Thể lực</span><div class="ca-luc-thanh"><i id="ca-luc-thanh"></i></div><em id="ca-luc-so"></em></div>
        <div class="ca-tam" id="ca-tam"></div>
        <div class="ca-giai" id="ca-giai"></div>
        <div class="ca-bong" id="ca-bong" hidden></div>

        <div class="ca-hotro" id="ca-hotro"></div>
        <div class="ca-tang" id="ca-tang"></div>
        <div class="ca-cs" id="bang-chiso"></div>
        <div class="ca-viec" id="hang-viec"></div>
        <div class="ca-sannut" id="hang-san" hidden></div>
        <div class="ca-bay" id="ca-bay"></div>
      </div>

      <div class="ca-log">
        <div class="ca-log-dau">Nhật ký</div>
        <div class="ca-log-than" id="nk-than"></div>
      </div>

      <nav class="ca-rail" id="ca-rail"></nav>
    </div>

    <!-- ══ MÀN BAN/PICK ══ -->
    <div class="man" id="man-draft" hidden></div>

    <!-- ══ MÀN CHIẾN THUẬT ══ -->
    <div class="man" id="man-chienthuat" hidden></div>

    <!-- ══ MÀN TRẬN ĐẤU ══ -->
    <div class="man" id="man-tran" hidden></div>

    <!-- ══ MÀN GACHA ══ -->
    <div class="man" id="man-gacha" hidden></div>

    <!-- ══ LỚP PHỦ: hộp thoại, sự kiện, thông báo ══ -->
    <div id="lop-phu" hidden></div>
    <div id="banner-lon" hidden></div>
    <div id="phao-hoa"></div>
  </div>
</div>

<!-- nhắc xoay ngang -->
<div id="nhac-xoay" hidden>
  <div class="xoay-hop">
    <div class="xoay-icon">▭</div>
    <div class="xoay-chu">Xoay ngang máy để chơi</div>
    <button id="xoay-bo">Cứ chơi dọc</button>
  </div>
</div>
