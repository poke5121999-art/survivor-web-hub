<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>UI test</title><link rel="stylesheet" href="./css/game.css"></head>
<body><div id="stage"><div id="ui"><div class="root"></div></div></div>
<script type="module">
// uitest.html renders art/ui/hud.json alone (no world) to check the NGUI rebuild against the original layout.
import { NGUI } from './js/view/ngui.js';
const lang = await fetch('./data/lang-vi.json').then(r => r.json());
const ng = await NGUI.load('.', lang);
const hud = await fetch('./art/ui/hud.json').then(r => r.json());
const root = document.querySelector('#ui .root');
for (const n of hud.roots) root.appendChild(ng.build(n));
const fit = () => { document.getElementById('ui').style.transform = `scale(${document.getElementById('stage').clientWidth / 1080})`; };
fit(); addEventListener('resize', fit);
setTimeout(() => { window.__ready = true; }, 2500);
</script></body></html>
