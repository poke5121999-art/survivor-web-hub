<script>
// Portrait frame, aspect 9:21..9:16 (3:4 on touch); body is the frame (README "Khung dọc")
(function () {
  var d = document.documentElement, q = matchMedia('(pointer: coarse)');
  function f() {
    var W = innerWidth, H = innerHeight, A = W / H, a = Math.min(q.matches ? .75 : .5625, Math.max(9 / 21, A)), s = d.style,
      w = A > a ? Math.round(H * a) : W, h = A < a ? Math.round(W / a) : H;
    s.setProperty('--fw', w + 'px'); s.setProperty('--fh', h + 'px'); s.setProperty('--fx', (W - w) / 2 + 'px'); s.setProperty('--fy', (H - h) / 2 + 'px');
    d.classList.toggle('rot', q.matches && A > 1);
  }
  f(); onresize = f; onorientationchange = f; window.visualViewport && visualViewport.addEventListener('resize', f);
})();
</script>
<style>
  :root { --fw: 100vw; --fh: 100vh; --u: calc(var(--fh) / 1334); }
  html, body { margin: 0; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  html { height: 100%; background: var(--bar, #0a1940); }
  body { position: fixed; left: var(--fx, 0); top: var(--fy, 0); width: var(--fw); height: var(--fh); transform: translateZ(0);
    background: #00b4fc; }
  html.rot::after { content: 'Xoay dọc điện thoại để chơi'; position: fixed; left: 0; top: 0; bottom: 0; width: var(--fx);
    display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; font: 700 16px system-ui, sans-serif; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 2; font: 700 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  .btn { width: 46px; height: 46px; border-radius: 14px; border: 3px solid #0d1b2a; background: #fff; color: #0d1b2a;
    font-size: 22px; font-weight: 900; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 0 #0d1b2a; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d1b2a; }
  /* DefaultInGameUI PauseButton: 80 x 80 at (25, 30) from the top left of a 750 x 1334 canvas matched to the height */
  #btnPause { top: calc(env(safe-area-inset-top) + var(--u) * 30); left: calc(var(--u) * 25); width: calc(var(--u) * 80); height: calc(var(--u) * 80); padding: 0;
    border: 0; background: no-repeat; cursor: pointer; }
  /* PauseUI: transparent full-screen Continue button (its text is drawn on the canvas), Home button 90 x 90 at (20, 25) */
  #pause { background: rgba(0, 20, 40, .25); }
  #btnMenu { position: absolute; top: calc(env(safe-area-inset-top) + var(--u) * 25); left: calc(var(--u) * 20); width: calc(var(--u) * 90); height: calc(var(--u) * 90);
    padding: 0; border: 0; background: no-repeat center / contain; cursor: pointer; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  #pause .row { position: absolute; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); justify-content: center;
    gap: 12px; width: auto; }
  .overlay { inset: 0; display: none; z-index: 3; }
  .overlay.on { display: flex; }
  #levels { background: rgba(0, 40, 70, .82); align-items: center; justify-content: center; }
  .panel { background: #fff; color: #0d1b2a; border: 4px solid #0d1b2a; border-radius: 22px; padding: 16px;
    width: min(calc(var(--fw) * .92), 560px); max-height: calc(var(--fh) * .8); display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
  .panel h2 { margin: 0; font-size: 20px; text-align: center; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; overflow: auto; padding: 4px; }
  #grid button { height: 46px; border-radius: 12px; border: 3px solid #0d1b2a; background: #ffd23f; font: 900 16px system-ui;
    color: #0d1b2a; cursor: pointer; }
  #grid button.done { background: #7ee0ff; }
  #grid button.cur { background: #ff5a5f; color: #fff; }
  #grid button:disabled { background: #e4e7eb; color: #9aa5b1; border-color: #9aa5b1; cursor: default; }
  #hint { left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom)); text-align: center; pointer-events: none;
    text-shadow: 0 2px 0 #0d1b2a; font-size: 17px; transition: opacity .4s; }
  #loading { inset: 0; display: grid; place-items: center; font-size: 18px; }
  /* home screen: hidden until home.js has laid it out (its CSS and art load with it) */
  #start { visibility: hidden; }
  #start.ready { visibility: visible; }
  .big { border: 4px solid #0d1b2a; border-radius: 20px; font: 900 26px system-ui, sans-serif; color: #0d1b2a;
    background: #ffd23f; box-shadow: 0 6px 0 #0d1b2a; cursor: pointer; width: 100%; padding: 12px; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #0d1b2a; }
  .row { display: flex; gap: 12px; width: 100%; }
  body.menu #btnPause, body.menu #hint, body.fin #btnPause { visibility: hidden; }
  #toast { left: 50%; bottom: 120px; transform: translate(-50%, 20px); max-width: calc(var(--fw) * .8); text-align: center; background: #0d1b2a; border-radius: 14px; padding: 10px 16px;
    opacity: 0; transition: .3s; pointer-events: none; z-index: 5; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #revive { left: 0; right: 0; top: 38%; text-align: center; font: 900 120px/1 system-ui, sans-serif; color: #ff483e; -webkit-text-stroke: 8px #1a1c4b;
    paint-order: stroke fill; display: none; pointer-events: none; }
  #revive.on { display: block; }
</style>

<canvas id="cv"></canvas>
<div class="ui" id="loading">Đang tải…</div>
<button class="ui" id="btnPause" title="Tạm dừng"></button>
<div class="ui overlay" id="pause">
  <button id="btnMenu" title="Trang chính"></button>
  <div class="row">
    <button class="btn" id="btnLevels" title="Chọn màn">☰</button>
    <button class="btn" id="btnRestart" title="Chơi lại màn">↻</button>
    <button class="btn" id="btnSound" title="Âm thanh">♪</button>
    <a class="btn" id="home" href="../../index.html" title="Về hub">⌂</a>
  </div>
</div>
<div class="ui" id="hint" hidden>Giữ chuột / chạm / Space để móc, thả để bay</div>
<div class="ui" id="toast"></div>
<div class="ui" id="revive"></div>
<!-- HomePage (home.js lays it out from the prefab with art/m-home.webp; ids are read by main.js, bonus.js and the tests) -->
<div class="ui overlay" id="start">
  <div class="hbg"><i class="hpat"></i></div>
  <button id="btnSettings" data-s="Settings" title="Chọn màn"></button>
  <div class="hcur"><div class="hpill" title="Vé bỏ qua"><i data-s="SkipTickets"></i><b id="tickets">0</b><i class="add" data-s="AddButton"></i></div>
    <div class="hpill" title="Xu"><i data-s="SkinCoins"></i><b id="coins">0</b><i class="add" data-s="AddButton" id="btnAddCoins"></i></div></div>
  <button id="xpbar" title="Đường XP"><i class="medal"><b id="rank">1</b></i><span class="bar"><span id="xpfill"></span><b id="xptext"></b></span>
    <i class="gift" data-s="GiftIcon"></i><b class="badge" id="roadBadge"></b><span id="league" hidden></span></button>
  <div class="hplayer"><i class="light" data-s="glow"></i><i class="shadow"></i><canvas id="homePlayer"></canvas></div>
  <div class="hcol l none" id="homeOffers"></div>
  <div class="hcol r"><button class="hw" id="btnLucky" title="Lucky Drop"><i data-s="Icon_Pachinko"></i><span>Lucky Drop</span></button>
    <button class="hw" id="btnWheel" title="Vòng quay may mắn"><i data-s="Icon_LuckyWheel"></i><span class="cnt" data-s="HolderLuckyWheelCoin"><b id="wheelPrice"></b><i data-s="SkinCoins"></i></span><b class="dot" id="wheelDot"></b></button></div>
  <button class="hm" id="btnTour" title="Đua"><i class="bt"></i><i class="ic"></i><b class="pos"></b><span class="time"></span></button>
  <button class="hm" id="btnAdv" title="Phiêu lưu"><i class="bt"></i><i class="ic"></i><b class="pos"></b><span class="time"></span></button>
  <button id="btnPlay" data-s="ButtonPlay_Holder_02"><span class="pt k-vi">Chơi</span><span class="pc"><b id="playLevel"></b></span></button>
  <nav class="mbar"><button id="btnTabShop" title="Chợ"><i data-s="Icon_Shop"></i></button>
    <button id="btnShop" title="Tuỳ biến"><i data-s="Icon_Customization"></i><b class="num" id="skinCount"></b></button>
    <button class="sel" id="btnHome" title="Trang chính"><i data-s="Icon_Home"></i><span class="k-vi">Trang chủ</span></button>
    <button id="btnModes" title="Chế độ chơi"><i data-s="Icon_GameMode"></i></button>
    <button id="btnCards" title="Thẻ bài"><i data-s="Icon_CardsLocked"></i></button></nav>
</div>
<div class="ui overlay" id="levels"><div class="panel"><h2 id="levelsTitle">Chọn màn</h2><p id="levelsNote" style="margin:0;text-align:center;font-weight:700"></p><div id="grid"></div>
  <button class="btn" id="btnClose" style="width:auto;padding:0 18px;align-self:center">Đóng</button></div></div>
