<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TD uGUI viewer</title>
<style>html,body{margin:0;height:100%;background:#1c2530;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#bar{position:fixed;left:0;top:0;font:11px monospace;color:#cde;background:#0008;padding:2px 4px;pointer-events:none}</style>
<div id="bar"></div>
<canvas id="cv"></canvas>
<script src="../data/ugui.js"></script>
<script src="../js/ui/ugui.js"></script>
<script>
// ?p=<khoá prefab>&hide=a/b,c  &all=1 (bật mọi nút tắt)  &bg=0 (không vẽ nền)  &w=&h= (ép cỡ)  &compose=1 (ghép HUD đua)
const ug = TD.ugui; ug.base = '../';
const params = new URLSearchParams(location.search);
const key = params.get('p') || Object.keys(TD.UGUI.prefabs)[0];
const W = +params.get('w') || innerWidth, H = +params.get('h') || innerHeight, dpr = devicePixelRatio || 1;
const cv = document.getElementById('cv'); cv.width = W * dpr; cv.height = H * dpr;
function render() {
  const inst = ug.inst(key);
  if (params.get('all') === '1') (function on(n) { delete n.off; if (n.img) delete n.img.off; if (n.txt) delete n.txt.off; (n.k || []).forEach(on); })(inst.root);
  (params.get('hide') || '').split(',').filter(Boolean).forEach(p => { const n = inst.q(p); if (n) n.off = 1; });
  if (params.get('demo') === '1' && key === 'racehud') {
    const B = 'DynamicUI/AnchorButtom/IG_SigleSpeedNitrogen/';
    inst.q(B + 'N2o/N2OShow/N2OProgress Bar/Foreground').img.fa = 0.7;
    inst.q(B + 'HideRoot/Speed/Speed/Label').txt.s = '186';
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (params.get('bg') !== '0') { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5a7088'); g.addColorStop(1, '#2c3a48'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  inst.draw(ctx, W, H);
  window.inst = inst; window.rendered = true;
  document.getElementById('bar').textContent = key + ' ' + W + 'x' + H;
}
ug.load().then(render);
</script>
