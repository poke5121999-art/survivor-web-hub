<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Pet viewer</title>
<style>html,body{margin:0;height:100%;background:#2a3446;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="../vendor/three-r140.min.js"></script>
<script src="../vendor/GLTFLoader-r140.js"></script>
<script src="../vendor/meshopt_decoder.js"></script>
<script>
// ?ids=00002,00003,...&az=<độ>   Lưới xem nhanh art/pets/pet_<id>.glb (mặt +z hướng về camera khi az = 0).
'use strict';
const Q = new URLSearchParams(location.search);
const ids = (Q.get('ids') || '').split(',').filter(Boolean), az = (+Q.get('az') || 0) * Math.PI / 180;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x2a3446);
sc.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(2, 4, 5); sc.add(dl);
const cols = Math.ceil(Math.sqrt(ids.length * innerWidth / innerHeight)), rows = Math.ceil(ids.length / cols);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
cam.position.set(cols / 2 * 1.5 - 0.75, rows * 0.7, Math.max(cols, rows) * 2.6); cam.lookAt(cols / 2 * 1.5 - 0.75, rows * 0.7 - 0.3, 0);
window.problems = []; window.ready = false;
let left = ids.length;
ids.forEach((id, i) => {
  const l = new THREE.GLTFLoader(); l.setMeshoptDecoder(window.MeshoptDecoder);
  l.load('../art/pets/pet_' + id + '.glb', (g) => {
    const m = g.scene, b = new THREE.Box3().setFromObject(m), s = 1 / Math.max(b.max.x - b.min.x, b.max.y - b.min.y, b.max.z - b.min.z);
    const h = new THREE.Group(); m.scale.setScalar(s); h.add(m); h.rotation.y = az;
    h.position.set((i % cols) * 1.5, (rows - 1 - ((i / cols) | 0)) * 1.4, 0); sc.add(h);
    if (!--left) { r.render(sc, cam); window.ready = true; }
  }, undefined, (e) => { window.problems.push(id + ': ' + e.message); if (!--left) window.ready = true; });
});
</script>
</body>
</html>
