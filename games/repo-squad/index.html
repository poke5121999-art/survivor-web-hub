<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ca Trực Đêm: Biệt Đội</title>
<meta name="description" content="Một tổ năm người: bạn cầm một xác, bốn xác còn lại chạy theo chiến thuật bạn giao. Khuân đồ cho đủ chỉ tiêu qua từng tầng, hết tầng là phá đảo map.">
<link rel="icon" href="../../assets/favicon.svg">
<style>
  :root{
    --ground:#07080a; --panel:#12151a; --panel2:#171b21; --panel3:#1d222a;
    --line:#272d37; --line2:#39424f;
    --ink:#dfe4ea; --dim:#98a2ad; --faint:#68727e;
    --gold:#e0b03c; --amber:#d08a34; --blood:#a8443a; --teal:#4fa0a8;
    --good:#6fbf73; --bad:#d0574c; --gem:#7fd0e8; --purple:#a678d8;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --body: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --display: Cambria,"Times New Roman","Liberation Serif","Noto Serif",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden;
       user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
  .shell{display:flex;flex-direction:column;height:100%}

  .bar{display:flex;align-items:center;gap:12px;padding:7px 12px;background:var(--panel2);
       border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;
       letter-spacing:.05em;color:var(--dim);flex:0 0 auto}
  .bar a.back{color:var(--dim);text-decoration:none;border:1px solid var(--line);padding:4px 9px;border-radius:3px}
  .bar a.back:hover{color:var(--ink);border-color:var(--line2)}
  .bar .name{font-family:var(--display);font-size:15px;color:#eef1f4;letter-spacing:0}
  .bar .grow{flex:1}
  .foot{display:flex;align-items:center;gap:10px;padding:5px 12px;background:var(--panel2);
        border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 auto}
  .foot button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
       color:var(--dim);background:#0d1116;border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer}
  .foot button[aria-pressed="true"]{color:#08110f;background:var(--teal);border-color:var(--teal)}
  .foot .grow{flex:1}

  .screen{position:relative;flex:1 1 auto;min-height:0;background:#000;display:flex;
          align-items:center;justify-content:center;
          padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  /* khung dọc 9:16 — cùng hình dạng với mọi game khác trên hub. Kích thước do JS đặt. */
  .frame{position:relative;background:#06070a;overflow:hidden;box-shadow:0 0 0 2px #1b212a,0 18px 60px rgba(0,0,0,.75)}
  canvas#view{display:block;width:100%;height:100%;background:#04050699;touch-action:none}

  /* ---------------- MENU ----------------
     Bố cục theo kiểu game sinh tồn di động (tham chiếu sur_client/MenuSceneController):
     thanh trên cố định · hai cột phím tắt hai bên · nhóm chọn chương · nút vào trận
     · thanh tab năm ô ở dưới với ô giữa nổi lên.                                    */
  .menu{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
        background:radial-gradient(120% 70% at 50% -8%,#1b2433 0%,#0b0e14 55%,#06070a 100%)}
  body.in-run .menu{display:none}
  body:not(.in-run) .hud{display:none}

  /* --- thanh trên: hồ sơ + ví tiền --- */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 8px;
          background:linear-gradient(180deg,rgba(11,14,20,.98),rgba(11,14,20,.86));
          border-bottom:1px solid var(--line);z-index:6}
  .me{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:16px;
      background:#151a22;border:1px solid var(--line);cursor:pointer;flex:0 0 auto}
  .me:active{transform:translateY(1px)}
  .me-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         font-size:15px;background:radial-gradient(circle at 35% 30%,#2c3542,#151a22);
         border:1px solid var(--line2)}
  .me-n{font-size:11px;font-weight:700;line-height:1.15}
  .me-p{font-family:var(--mono);font-size:9px;color:var(--gold);line-height:1.2}
  .purse{flex:1;display:flex;justify-content:flex-end;gap:4px;min-width:0}
  .coin{display:flex;align-items:center;gap:3px;padding:2px 2px 2px 4px;border-radius:12px;
        background:#0d1117;border:1px solid var(--line);cursor:pointer;min-width:0}
  .coin i{font-style:normal;font-size:11px}
  .coin b{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62px}
  .coin s{text-decoration:none;width:14px;height:14px;border-radius:50%;flex:0 0 auto;
          background:#2c3644;color:#cfd6de;font-size:11px;line-height:13px;text-align:center}
  .coin:active{filter:brightness(1.25)}

  /* --- vùng cuộn duy nhất --- */
  .stage{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .stage.is-home{position:relative;display:flex;flex-direction:column;gap:8px;padding:8px 10px 12px}

  /* --- cột phím tắt bên phải ở sảnh --- */
  .rail{position:absolute;top:6px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
  .rail.left{right:auto;left:8px}
  .rail-b{position:relative;width:46px;padding:5px 2px 4px;border-radius:9px;text-align:center;cursor:pointer;
          background:linear-gradient(180deg,#212a36,#141a22);border:1px solid var(--line2);
          box-shadow:0 2px 0 #0a0d12}
  .rail-b:active{transform:translateY(2px);box-shadow:none}
  .rb-i{font-size:18px;line-height:1.1}
  .rb-n{font-size:7.5px;color:var(--dim);letter-spacing:.02em}

  /* --- sân khấu nhân vật --- */
  .showcase{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:12px;
            padding:14px 58px 10px;text-align:center;cursor:pointer;
            background:linear-gradient(180deg,hsl(var(--hue,40) 30% 16%),#0c1016 72%)}
  .stage.is-home>.showcase{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
  .sc-glow{position:absolute;left:50%;top:50%;width:210px;height:210px;border-radius:50%;
           transform:translate(-50%,-62%);
           background:radial-gradient(circle,hsl(var(--hue,40) 70% 55% / .26),transparent 66%)}
  .sc-face{position:relative;font-size:78px;line-height:1.1;filter:drop-shadow(0 8px 18px rgba(0,0,0,.75))}
  .sc-name{position:relative;font-family:var(--display);font-size:22px;color:#f4ead4;margin-top:2px}
  .sc-ep{font-family:var(--body);font-size:11px;color:var(--dim)}
  .sc-star{position:relative;color:var(--gold);font-size:13px;letter-spacing:.14em}
  .sc-skill{position:relative;font-size:10.5px;color:var(--dim);line-height:1.45;margin-top:5px;
            padding-top:6px;border-top:1px solid rgba(255,255,255,.07)}
  .sc-skill b{color:#e8dcc0}

  /* --- hàng năm người --- */
  .lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .lu{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:5px 2px;
      text-align:center;cursor:pointer;background:#10141a}
  .lu:before{content:'';position:absolute;inset:0;background:hsl(var(--hue,40),45%,50%);opacity:.09}
  .lu.is-me{box-shadow:0 0 0 1px var(--gold) inset}
  .lu.empty{opacity:.45;border-style:dashed}
  .lu-f{position:relative;font-size:20px;line-height:1.15}
  .lu-n{position:relative;font-size:10px;font-weight:700}
  .lu-t{position:relative;font-size:7.5px;color:var(--dim);line-height:1.25;min-height:10px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lu.is-me .lu-t{color:var(--gold)}

  /* --- nhóm chọn chương --- */
  .stage.is-home>.chapter{margin-top:auto}
  .chapter{display:flex;align-items:stretch;gap:6px;background:#111721;border:1px solid var(--line2);
           border-radius:11px;padding:7px}
  .ch-b{flex:1;min-width:0;cursor:pointer}
  .ch-n{font-family:var(--display);font-size:17px;color:#f2e8d2;line-height:1.2}
  .ch-ok{color:var(--good);font-size:13px}
  .ch-s{font-size:10px;color:var(--dim);margin-top:1px}
  .ch-bar{height:5px;background:#080b0f;border-radius:3px;overflow:hidden;margin:5px 0 3px;
          border:1px solid #1d232c}
  .ch-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--gold))}
  .ch-f{font-family:var(--mono);font-size:8.5px;color:var(--faint)}
  .b.chev{flex:0 0 auto;width:30px;padding:0;font-size:20px;line-height:1;background:#1b2430;
          color:var(--ink);border:1px solid var(--line2);border-radius:8px;letter-spacing:0}
  .b.chev:disabled{opacity:.3;cursor:default}

  /* --- nút vào trận --- */
  .b.cta{width:100%;font-size:17px;letter-spacing:.16em;padding:15px;border-radius:11px;
         color:#062010;background:linear-gradient(180deg,#8fd88a,#3f9a4d);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 0 #1f5c2b;
         text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .b.cta:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #1f5c2b}

  /* --- tấm nội dung của các màn khác --- */
  .sheet{display:flex;flex-direction:column;min-height:100%}
  .sheet-h{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:8px 10px;
           background:linear-gradient(180deg,#131820,#0e1218);border-bottom:1px solid var(--line)}
  .sheet-t{font-family:var(--display);font-size:19px;color:#f0e6d2}
  .sheet-b{padding:10px 10px 16px;display:flex;flex-direction:column;gap:9px}

  /* --- thanh tab dưới --- */
  .tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:2px;
          padding:4px 5px calc(5px + env(safe-area-inset-bottom));
          background:linear-gradient(180deg,#141922,#0a0d12);border-top:1px solid var(--line2)}
  .tb{position:relative;padding:5px 1px 4px;border-radius:9px;text-align:center;cursor:pointer;color:var(--faint)}
  .tb.on{color:var(--ink);background:#1c2531}
  .tb-i{font-size:19px;line-height:1.15;filter:grayscale(.55) opacity(.75)}
  .tb.on .tb-i{filter:none}
  .tb-n{font-size:8px;letter-spacing:.02em;line-height:1.2}
  .tb.mid{margin-top:-18px;padding:9px 1px 5px;border-radius:12px;color:#062010;
          background:linear-gradient(180deg,#8fd88a,#3f9a4d);
          box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 #1f5c2b}
  .tb.mid .tb-i{filter:none;font-size:23px}
  .tb.mid .tb-n{font-weight:700;font-size:8.5px;letter-spacing:.08em}
  .tb:active{transform:translateY(1px)}

  /* ---------------- các khối dùng chung ---------------- */
  h2{font-family:var(--display);font-weight:400;font-size:21px;margin:2px 0 0;color:#eef1f4}
  h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
     color:var(--faint);margin:6px 0 0;display:flex;align-items:center;gap:7px}
  h3:after{content:'';flex:1;height:1px;background:var(--line)}
  p.hint{margin:0;font-size:11.5px;line-height:1.5;color:var(--dim)}
  .dim{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)}

  .b{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
     color:#120d06;background:linear-gradient(180deg,#f0c65a,#c8912c);border:none;border-radius:7px;
     padding:9px 14px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 #7d5716}
  .b:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #7d5716}
  .b.big{font-size:14px;padding:13px 18px;letter-spacing:.14em}
  .b.ghost{background:linear-gradient(180deg,#222b37,#161c25);color:var(--ink);
           border:1px solid var(--line2);box-shadow:0 3px 0 #0a0d12}
  .b.ghost:active{box-shadow:0 1px 0 #0a0d12}
  .b.small{padding:6px 10px;font-size:10px;align-self:flex-start}
  .b.tiny{padding:5px 8px;font-size:9.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 #7d5716}
  .b.danger{background:linear-gradient(180deg,#c9584c,#8e3730);color:#ffe6e2;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 #55201b}
  .b.ghost.danger{background:linear-gradient(180deg,#2a1d1c,#1a1211);color:#c9756b;border-color:#5a3430;box-shadow:0 3px 0 #0a0d12}
  .b:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .row .b{flex:1 1 auto}

  .cc{position:relative;border:1px solid var(--line);border-radius:8px;background:#10141a;
      padding:5px 3px;text-align:center;cursor:pointer;overflow:hidden}
  .cc:before{content:'';position:absolute;inset:0;background:hsl(var(--hue,40),40%,50%);opacity:.08}
  .cc>*{position:relative}
  .cc.sel{box-shadow:0 0 0 2px var(--gold)}
  .cc.in{background:#171f29}
  .cc-face{font-size:22px;line-height:1.2}
  .cc-n{font-size:11px;font-weight:700;color:var(--ink)}
  .cc-s{font-family:var(--mono);font-size:8.5px;color:var(--faint)}
  .cc-tag{font-size:8.5px;color:var(--dim);margin-top:2px;line-height:1.25;min-height:11px}
  .cc-tag.lead{color:var(--gold);font-weight:700}
  .cc-p{font-family:var(--mono);font-size:8.5px;color:var(--amber)}
  .cc.empty{opacity:.5;display:flex;flex-direction:column;justify-content:center}
  .cc-plus{font-size:20px;color:var(--faint)}
  .cc.unknown{opacity:.5;filter:grayscale(.7)}
  .char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .char-strip{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-size:11px;padding:5px 10px;
        border:1px solid var(--line);border-radius:15px;background:#10141a;color:var(--dim);
        cursor:pointer;white-space:nowrap}
  .chip.on{background:#26313f;color:#fff;box-shadow:0 0 0 1px var(--gold)}
  .dot{position:absolute;top:-4px;right:-4px;background:var(--blood);color:#fff;font-size:9px;
       min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;
       padding:0 4px;border:1px solid #1a0f0d}
  .foot-note{display:flex;align-items:center;justify-content:space-between;gap:8px;
             font-size:9.5px;color:var(--faint)}

  /* --- danh sách map --- */
  .map{position:relative;background:#111721;border:1px solid var(--line);border-radius:10px;padding:10px}
  .map.locked{opacity:.5} .map.done{border-color:#2f4a34}
  .map.cur{box-shadow:0 0 0 1px var(--gold) inset}
  .map-h{display:flex;align-items:baseline;gap:8px}
  .map-h b{font-family:var(--display);font-size:16px;color:#f0e6d2}
  .map-f{font-family:var(--mono);font-size:10px;color:var(--gold)}
  .map-d{font-size:11px;color:var(--dim);margin:3px 0 5px;line-height:1.45}
  .map-s{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
  .map-s .ok{color:var(--good)} .map-s .bad{color:var(--bad)}
  .map-r{font-size:10px;color:var(--dim);margin:5px 0 7px}
  .map-badge{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:8.5px;
             color:var(--good);border:1px solid #2f4a34;border-radius:4px;padding:2px 5px}
  .map-badge.dim{color:var(--faint);border-color:var(--line)}
  .lockmsg{font-size:11px;color:var(--faint)}

  /* --- ô đội hình --- */
  .slot-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .slot{background:#10141a;border:1px solid var(--line);border-radius:8px;padding:5px 3px;text-align:center}
  .slot.lead{border-color:var(--gold);background:#171410}
  .slot.empty{opacity:.75;border-style:dashed}
  .slot-l{font-family:var(--mono);font-size:7px;letter-spacing:.06em;color:var(--faint)}
  .slot-f{font-size:20px} .slot-n{font-size:11px;font-weight:700}
  .slot .tac{width:100%;font-size:9px;background:#0c0f14;color:var(--ink);border:1px solid var(--line);
             border-radius:4px;padding:2px;margin-top:3px}
  .tac-d{font-size:8px;color:var(--faint);line-height:1.3;margin-top:3px;min-height:20px}
  .slot-acts{display:flex;flex-direction:column;gap:3px;margin-top:4px}
  .slot-acts .b{width:100%;padding:4px 2px;font-size:8px;letter-spacing:.02em}

  .detail{background:#131922;border:1px solid var(--line2);border-radius:10px;padding:10px}
  .det-h{font-family:var(--display);font-size:16px;color:#f0e6d2}
  .stars{color:var(--gold);font-size:12px}
  .det-sk{font-size:11px;color:var(--dim);line-height:1.5;margin-top:5px}
  .det-sk b{color:var(--ink)}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;margin-top:7px}
  .sc{display:flex;justify-content:space-between;font-size:10.5px;background:#0e1218;
      border:1px solid var(--line);border-radius:5px;padding:3px 6px}
  .sc span{color:var(--faint)} .sc b{font-family:var(--mono);color:var(--ink)}
  .det-lv{font-family:var(--mono);font-size:10px;color:var(--amber);margin-top:7px}

  /* --- TRANG BỊ: xác đứng giữa, sáu ô vây quanh, kho 5 ô mỗi hàng --- */
  .eq-rig{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:5px;align-items:center}
  .eq-col{display:flex;flex-direction:column;gap:5px}
  .eq-body{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:11px;
           padding:10px 4px 8px;text-align:center;
           background:linear-gradient(180deg,hsl(var(--hue,40) 28% 15%),#0c1016 78%)}
  .eb-f{font-size:46px;line-height:1.1;filter:drop-shadow(0 5px 10px rgba(0,0,0,.65))}
  .eb-n{font-family:var(--display);font-size:15px;color:#f2e8d2;line-height:1.2}
  .eb-s{color:var(--gold);font-size:10px;letter-spacing:.1em}
  .eb-p{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:2px}
  .eqs{position:relative;background:#10141a;border:1px solid var(--line);border-radius:9px;
       padding:5px 3px;text-align:center;cursor:pointer;min-height:60px;overflow:hidden}
  .eqs.sel{box-shadow:0 0 0 2px var(--gold)}
  .eqs.empty{border-style:dashed;opacity:.72}
  .eqs:before{content:'';position:absolute;inset:0;opacity:.13;background:var(--rc,transparent)}
  .eqs>*{position:relative}
  .eqs-i{font-size:17px;line-height:1.15}
  .eqs-n{font-size:8px;color:var(--faint);letter-spacing:.04em}
  .eqs-t{font-size:9.5px;font-weight:700;line-height:1.2;margin-top:1px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .eqs-v{font-family:var(--mono);font-size:8.5px;color:var(--gold)}
  .eqs-l{position:absolute;top:2px;right:3px;font-family:var(--mono);font-size:7.5px;color:var(--faint)}
  .stat-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .sb{background:#0e1218;border:1px solid var(--line);border-radius:7px;padding:4px 2px;text-align:center}
  .sb i{font-style:normal;font-size:11px}
  .sb b{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink)}
  .sb span{font-size:7.5px;color:var(--faint)}
  .setbox{background:#101820;border:1px solid #24343f;border-radius:8px;padding:7px}
  .setline{font-size:10.5px;color:var(--teal);line-height:1.5}
  .filters{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
  .inv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .inv{position:relative;overflow:hidden;background:#10141a;border:1px solid var(--line);
        border-radius:8px;padding:4px 2px 3px;text-align:center;cursor:pointer;min-height:56px}
  .inv:before{content:'';position:absolute;inset:0;opacity:.16;background:var(--rc,transparent)}
  .inv>*{position:relative}
  .inv.sel{box-shadow:0 0 0 2px var(--gold)}
  .inv-i{font-size:19px;line-height:1.1}
  .inv-n{font-size:8px;line-height:1.15;color:var(--dim);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .inv-lv{font-family:var(--mono);font-size:7.5px;color:var(--gold)}
  .inv-star{position:absolute;top:1px;left:0;right:0;font-size:6.5px;color:var(--gold);letter-spacing:-.5px}
  .inv-on{position:absolute;bottom:1px;right:2px;font-size:9px}
  .inv-lock{position:absolute;top:1px;right:2px;font-size:8px}
  .subs{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;margin-top:6px}
  .sub{font-family:var(--mono);font-size:9.5px;background:#0e1218;border:1px solid var(--line);
       border-radius:5px;padding:3px 5px}
  .sub.off{opacity:.45}

  /* --- TIẾN HOÁ: lưới ô có huy hiệu cấp --- */
  .evo-top{background:#111721;border:1px solid var(--line2);border-radius:10px;padding:9px}
  .evo-tn{font-family:var(--mono);font-size:11px;color:var(--gold)}
  .evo-bar{height:6px;background:#080b0f;border:1px solid #1d232c;border-radius:4px;
           overflow:hidden;margin-top:5px}
  .evo-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--gold))}
  .evo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .evo{position:relative;background:#10141a;border:1px solid var(--line);border-radius:9px;
       padding:8px 4px 6px;text-align:center;cursor:pointer}
  .evo.maxed{border-color:#2f4a34;background:#101710}
  .evo.can{box-shadow:0 0 0 1px var(--gold) inset}
  .evo-i{font-size:22px;line-height:1.15}
  .evo-n{font-size:10px;font-weight:700;line-height:1.2;margin-top:1px}
  .evo-lv{font-family:var(--mono);font-size:8.5px;color:var(--dim);margin-top:1px}
  .evo-c{font-family:var(--mono);font-size:8.5px;color:var(--amber);margin-top:2px}
  .evo-max{font-family:var(--mono);font-size:8.5px;color:var(--good);margin-top:2px}

  /* --- GACHA --- */
  .tabs{display:flex;gap:5px}
  .tab{flex:1;font-size:11px;padding:8px 4px;background:linear-gradient(180deg,#1a212b,#12171e);
       color:var(--dim);border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .tab.on{background:linear-gradient(180deg,#2b3745,#1e2733);color:#fff;border-color:var(--line2)}
  .banner{position:relative;overflow:hidden;border:1px solid var(--bc);border-radius:11px;padding:11px;
          background:linear-gradient(160deg,color-mix(in srgb,var(--bc) 26%,#0d1117),#0d1117)}
  .ban-t{font-family:var(--display);font-size:20px;color:#f4ecd8}
  .ban-d{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.45}
  .ban-r{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:6px}
  .ban-p{font-family:var(--mono);font-size:10px;color:var(--gold);margin-top:3px}
  .pool{background:#0e1218;border:1px solid var(--line);border-radius:8px;padding:8px}
  .pool-t{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
  .pool-r{font-size:11px;margin-top:4px;line-height:1.6}
  .pool-r span{margin-right:7px}
  .pool-r .dim{opacity:.4}

  /* --- CỬA HÀNG --- */
  .pack-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
  .pack{position:relative;background:linear-gradient(170deg,#221f36,#101119);border:1px solid #37325180;
        border-radius:10px;padding:9px;cursor:pointer;text-align:center}
  .pack:active{transform:translateY(2px)}
  .pk-n{font-size:11px;font-weight:700}
  .pk-tag{position:absolute;top:-6px;right:-4px;font-size:8px;background:var(--blood);color:#fff;
          padding:1px 5px;border-radius:8px;border:1px solid #1a0f0d}
  .pk-g{font-family:var(--mono);font-size:15px;color:var(--gem);margin:6px 0 2px}
  .pk-g .bonus{color:var(--good);font-size:10px}
  .pk-p{display:inline-block;font-family:var(--mono);font-size:11px;color:#120d06;margin-top:4px;
        background:linear-gradient(180deg,#f0c65a,#c8912c);border-radius:6px;padding:4px 10px;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #7d5716}
  .fakebox{background:#1d1710;border:1px solid #4a3a20;border-radius:8px;padding:8px;
           font-size:10.5px;color:#e0c48a;line-height:1.5}
  .xrow{display:flex;align-items:center;gap:8px;background:#10141a;border:1px solid var(--line);
        border-radius:8px;padding:8px}
  .x-g{flex:1;font-family:var(--mono);font-size:12px;color:var(--gold)}
  .x-l{font-size:9.5px;color:var(--faint)}

  /* --- NHIỆM VỤ --- */
  .quest{display:flex;align-items:center;gap:8px;background:#10141a;border:1px solid var(--line);
         border-radius:8px;padding:8px}
  .quest.done{border-color:var(--gold);background:#161309}
  .quest.claimed{opacity:.45}
  .q-b{flex:1;min-width:0}
  .q-t{font-size:11.5px}
  .q-bar{height:5px;background:#080b0f;border:1px solid #1d232c;border-radius:3px;
         overflow:hidden;margin-top:4px}
  .q-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--good))}
  .q-p{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:3px}
  .q-ok{color:var(--good);font-size:16px}

  /* ---------------- HUD ---------------- */
  .hud{position:absolute;inset:0;pointer-events:none;font-family:var(--body)}
  .hud button,.hud .h-stick{pointer-events:auto}
  .h-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:7px 8px;
         background:linear-gradient(180deg,rgba(5,7,10,.92),rgba(5,7,10,0))}
  .h-x{width:28px;height:28px;border-radius:4px;background:rgba(20,24,30,.85);color:var(--dim);
       border:1px solid var(--line);font-size:13px;cursor:pointer}
  .h-mid{flex:1;min-width:0}
  .h-l{display:flex;align-items:baseline;gap:7px;font-size:11px;color:var(--dim)}
  .h-l b{font-size:12.5px;color:#f0e6d2}
  .h-q{height:7px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:4px;
       overflow:hidden;margin-top:3px}
  .h-q i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--gold));transition:width .2s}
  .h-q i.full{background:linear-gradient(90deg,#4e9a52,var(--good))}
  .h-qn{font-family:var(--mono);font-size:9.5px;color:var(--gold);margin-top:2px}
  .h-squad{position:absolute;left:6px;top:66px;display:flex;flex-direction:column;gap:4px}
  .hu{width:40px;background:rgba(10,13,18,.72);border:1px solid var(--line);border-radius:5px;
      padding:3px 2px;text-align:center}
  .hu.is-me{border-color:var(--gold)}
  .hu.down{border-color:var(--blood);opacity:.85}
  .hu.out{opacity:.35}
  .hu.carry{box-shadow:0 0 0 1px var(--teal) inset}
  .hu-f{font-size:14px;line-height:1.1}
  .hu-b{height:3px;background:rgba(0,0,0,.7);border-radius:2px;overflow:hidden;margin:2px 0}
  .hu-b i{display:block;height:100%;background:var(--good)}
  .hu.down .hu-b i{background:var(--blood)}
  .hu-n{font-size:8px;color:var(--dim);line-height:1.1}
  .hu-cd{font-family:var(--mono);font-size:8px;color:var(--faint)}
  .h-msg{position:absolute;left:52px;right:8px;top:66px;font-size:11px;color:#e8dcc0;
         text-shadow:0 1px 3px #000;line-height:1.5;text-align:right}
  .h-ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;
         justify-content:space-between;padding:12px 14px 20px}
  .h-stick{position:relative;width:104px;height:104px;border-radius:50%;
           background:radial-gradient(circle,rgba(80,95,115,.18),rgba(20,25,32,.30));
           border:1px solid rgba(120,135,155,.25);touch-action:none}
  .h-stick i{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;
             border-radius:50%;background:rgba(200,215,230,.30);border:1px solid rgba(220,230,240,.45)}
  .h-skill{position:relative;width:82px;height:82px;border-radius:50%;border:2px solid var(--line2);
           background:rgba(20,24,30,.75);color:var(--faint);cursor:pointer;display:flex;
           flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .h-skill.ready{border-color:var(--gold);color:var(--ink);background:rgba(58,45,18,.75);
                 box-shadow:0 0 16px rgba(224,176,60,.30)}
  .hs-i{font-size:22px;line-height:1}
  .hs-n{font-size:8.5px;letter-spacing:.04em}
  .hs-cd{position:absolute;inset:-2px;transform:rotate(-90deg)}
  .hs-cd circle{fill:none;stroke:rgba(220,230,240,.35);stroke-width:5}
  .hs-t{position:absolute;font-family:var(--mono);font-size:16px;color:#fff;text-shadow:0 1px 3px #000}


  /* Nằm ngang: hai thanh chữ ngoài khung nhường chiều cao lại cho game — mỗi pixel
     bớt ở đây là một pixel khung to thêm, mà chiều cao là thứ hiếm nhất khi nằm ngang. */
  body.landscape .bar{padding:1px 8px;font-size:9px;gap:6px}
  body.landscape .bar .name{font-size:11px}
  body.landscape .bar a.back{padding:1px 6px}
  body.landscape .foot{padding:1px 8px;gap:5px}
  body.landscape .foot button{padding:2px 7px;font-size:8.5px}
  body.landscape .hide-land{display:none}

  /* ---------------- MÁY NẰM NGANG ----------------
     Khung 16:9 chỉ cao bằng nửa khung dọc, nên sảnh xếp thành HAI CỘT: xác đứng bên
     trái, đội hình + chọn map + nút vào ca bên phải. Các màn khác giữ nguyên một cột
     nhưng bó lại giữa khung cho khỏi kéo dài hết bề ngang. */
  /* Hàng co theo nội dung và dồn lên trên: khung ngang trên điện thoại chỉ còn ~260px
     chiều cao cho vùng cuộn, để hàng dãn đều thì thẻ chọn map phình ra và nút ĐI CA
     bị thanh tab dưới cắn mất. */
  body.landscape .stage.is-home{
    display:grid;grid-template-columns:1fr 1.15fr;grid-template-rows:auto auto auto 1fr;
    gap:6px;align-content:start;padding:6px}
  body.landscape .chapter{padding:5px}
  body.landscape .ch-n{font-size:14px}
  body.landscape .ch-s{font-size:9px}
  body.landscape .ch-f{font-size:8px}
  body.landscape .ch-bar{margin:4px 0 2px}
  body.landscape .lu{padding:3px 2px}
  body.landscape .lu-f{font-size:17px}
  body.landscape .lu-n{font-size:9px}
  body.landscape .foot-note{font-size:8.5px}
  body.landscape .stage.is-home>.showcase{grid-row:1 / span 4;min-height:0;padding:10px 52px}
  body.landscape .sc-face{font-size:52px}
  body.landscape .sc-name{font-size:18px}
  body.landscape .sc-skill{font-size:9.5px;margin-top:3px;padding-top:4px}
  /* Khung ngang chỉ rộng chứ không cao, mà cột phím tắt bên phải nằm đè lên hàng năm
     người của cột phải. Dồn cả hai cột về mép TRÁI — một cột neo trên, một cột neo
     dưới — vì cột trái là sân khấu, vốn đã chừa sẵn 52px lề hai bên. */
  body.landscape .rail{top:auto;bottom:4px;right:auto;left:4px}
  body.landscape .rail.left{top:4px;bottom:auto;left:4px}
  body.landscape .rail-b{width:40px;padding:3px 2px}
  body.landscape .rb-i{font-size:15px}
  body.landscape .rb-n{font-size:7px}
  body.landscape .stage.is-home>.lineup{grid-column:2;align-self:end}
  body.landscape .stage.is-home>.chapter{grid-column:2;margin-top:0}
  body.landscape .stage.is-home>.b.cta{grid-column:2;padding:11px;font-size:15px}
  body.landscape .stage.is-home>.foot-note{grid-column:2;align-self:start}
  /* Vùng cuộn khi nằm ngang chỉ còn ~260px, nên tiêu đề tấm và giàn đồ phải gọn lại,
     nếu không thì mở màn Trang Bị ra đã phải cuộn mới thấy được cái ô đầu tiên. */
  body.landscape .sheet-b{max-width:660px;width:100%;margin:0 auto;padding:6px 8px 12px;gap:6px}
  body.landscape .sheet-h{padding:4px 8px}
  body.landscape .sheet-t{font-size:15px}
  body.landscape .sheet-h .b.chev{width:24px;height:24px;font-size:14px}
  body.landscape .eq-body{padding:5px 4px}
  body.landscape .eb-f{font-size:34px}
  body.landscape .eb-n{font-size:13px}
  body.landscape .eqs{min-height:46px;padding:3px 2px}
  body.landscape .eqs-i{font-size:14px}
  body.landscape .sb{padding:2px}
  body.landscape .chip{padding:4px 8px;font-size:10px}
  body.landscape .slot .tac{font-size:8px}
  body.landscape .tac-d{min-height:16px}
  body.landscape .char-grid{grid-template-columns:repeat(7,1fr)}
  body.landscape .evo-grid{grid-template-columns:repeat(5,1fr)}
  body.landscape .pack-grid{grid-template-columns:repeat(3,1fr)}
  body.landscape .inv-grid{grid-template-columns:repeat(8,1fr)}
  body.landscape .tabbar{padding:3px 5px calc(4px + env(safe-area-inset-bottom))}
  body.landscape .tb-i{font-size:16px}
  body.landscape .tb.mid{margin-top:-12px}
  body.landscape .tb.mid .tb-i{font-size:19px}

  /* HUD trong trận: khung thấp nên cột năm người nằm NGANG dưới thanh chỉ tiêu,
     nếu để dọc như cũ thì năm thẻ tràn khỏi đáy khung. */
  body.landscape .h-squad{flex-direction:row;left:8px;right:auto;top:52px}
  body.landscape .h-msg{left:8px;right:auto;top:106px;max-width:52%;text-align:left}
  body.landscape .h-ctl{padding:8px 14px 12px}
  body.landscape .h-stick{width:88px;height:88px}
  body.landscape .h-stick i{width:36px;height:36px;margin:-18px 0 0 -18px}
  body.landscape .h-skill{width:70px;height:70px}

  /* ---------------- modal / toast ---------------- */
  .modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
         background:rgba(4,5,8,.86);padding:14px;z-index:20;overflow-y:auto}
  .modal.show{display:flex}
  .mcard{width:100%;max-width:340px;background:#111620;border:1px solid var(--line2);
         border-radius:12px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .pop-h{display:flex;align-items:center;gap:8px;margin:-2px 0 8px}
  .pop-t{flex:1;font-family:var(--display);font-size:18px;color:#f2e8d2;min-width:0;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pop-h .b.chev{width:26px;height:26px;font-size:13px;line-height:1}
  .pop-b{display:flex;flex-direction:column;gap:7px}
  .pop-item{position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;
            background:#0e1218;border:1px solid var(--line);border-radius:9px;padding:9px}
  .pop-item:before{content:'';position:absolute;inset:0;opacity:.14;background:var(--rc,transparent)}
  .pop-item>*{position:relative}
  .pi-i{font-size:30px;line-height:1}
  .pi-b{flex:1;min-width:0}
  .pi-s{font-family:var(--mono);font-size:9px;color:var(--gold)}
  .pi-m{font-size:12px;color:var(--dim);margin-top:2px}
  .pi-m b{font-family:var(--mono);color:var(--ink)}
  .pi-set{font-size:10px;color:var(--teal);margin-top:2px}
  .mcard h3{font-family:var(--display);font-size:19px;letter-spacing:0;text-transform:none;
            color:#f2e8d2;margin:0 0 8px}
  .mline{font-size:12px;color:var(--dim);line-height:1.6}
  .mline b{color:var(--ink)}
  .modal.win .mcard{border-color:#3f6b45} .modal.lose .mcard{border-color:#6b3a34}
  .pull-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}
  .pcard{background:#0e1218;border:1px solid var(--line);border-radius:4px;padding:4px 2px;text-align:center}
  .pcard.s5{background:linear-gradient(160deg,#3a2c10,#0e1218)}
  .pcard.s4{background:linear-gradient(160deg,#2a1f3a,#0e1218)}
  .pc-f{font-size:16px} .pc-n{font-size:8.5px;line-height:1.15}
  .pc-s{font-size:8px;color:var(--gold)} .pc-t{font-size:7.5px;color:var(--dim);line-height:1.2}
  .pc-t .new{color:var(--good)}
  .toast{position:absolute;left:50%;bottom:16%;transform:translate(-50%,20px);opacity:0;
         background:rgba(12,16,22,.96);border:1px solid var(--line2);border-radius:5px;
         padding:8px 14px;font-size:12px;color:var(--ink);pointer-events:none;transition:.18s;z-index:30;
         max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.good{border-color:#3f6b45;color:#d8f0da}

  @media (max-width:820px){
    .bar{gap:8px;font-size:10px;padding:5px 9px}
    .bar .name{font-size:13px}
    .hide-sm{display:none}
    .foot{padding:4px 9px;gap:7px}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="bar">
    <a class="back" href="../../index.html">&larr; Hub</a>
    <span class="name">Ca Trực Đêm: Biệt Đội</span>
    <span class="grow"></span>
    <span class="hide-sm">1 người cầm · 4 bot theo chiến thuật</span>
  </header>

  <div class="screen" id="stage">
    <div class="frame" id="play">
      <canvas id="view" width="540" height="960" aria-label="Màn chơi nhìn từ trên xuống"></canvas>
      <div class="hud" id="hud"></div>
      <div class="menu" id="menu"></div>
      <div class="modal" id="modal"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <footer class="foot">
    <button id="botBtn" aria-pressed="false">Bot tự chơi</button>
    <button id="spdBtn">Tốc độ ×1</button>
    <span class="grow"></span>
    <span class="hide-sm">Bàn phím: W A S D đi · Space dùng kỹ năng · P tạm dừng</span>
  </footer>

</div>
