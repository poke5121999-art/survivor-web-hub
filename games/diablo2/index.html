<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ác Quỷ II</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap");
:root{--gold:#c4a96b;--gold2:#6b5a2e;--ink:#e8d9a8;--panel:rgba(18,12,10,.94);--red:#b0141a;--blue:#1a3fb0;--d2:"Cinzel","Palatino Linotype","Book Antiqua",Georgia,serif;--body:"Palatino Linotype","Book Antiqua","Times New Roman",Georgia,serif;--d2white:#e8e8e8;--d2gold:#c7b377}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:var(--body);user-select:none;-webkit-user-select:none;touch-action:none}
#frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
/* flex:0 0 auto: nếu không, #stage co theo flex-shrink còn canvas vẫn 960px và mép phải bị cắt. */
#stage{position:relative;flex:0 0 auto;width:960px;height:540px;transform-origin:center center;background:#000;overflow:hidden}
canvas#view{position:absolute;inset:0;width:960px;height:540px;display:block;touch-action:none;cursor:default}
.ui{position:absolute;inset:0;pointer-events:none;z-index:5}
.ui button,.ui .panel,.ui .dialog,.ui .modal,.ui .screen,.ui .skpop,.ui .hud .orb,.ui .hud .skbtn,.ui .belt,.ui .hudbtns,.ui .ptsflag,.ui .lvlbtn{pointer-events:auto}
button{font-family:var(--body);color:var(--ink);cursor:pointer;background:linear-gradient(#3a2e1c,#17110a);border:1px solid var(--gold2);border-radius:2px;padding:4px 10px;font-size:13px;box-shadow:inset 0 0 0 1px #000}
button:hover{border-color:var(--gold);color:#fff}
button.off{opacity:.45}
/* ---------- HUD: thanh điều khiển D2 (800x104 theo toạ độ D2, nhân 1.2 cho vừa 960, neo đáy) */
.hud{position:absolute;inset:0}
.hbar{position:absolute;left:0;bottom:0;width:800px;height:104px;transform:scale(1.2);transform-origin:0 100%;pointer-events:none}
.sp{position:absolute;pointer-events:none;background-repeat:no-repeat}
.hbar>*{position:absolute}
.orb{overflow:visible}
.orb .fill{position:absolute;pointer-events:none}
.orb .lab{position:absolute;left:-10px;right:-10px;top:30px;text-align:center;font:700 12px var(--d2);color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;opacity:0;transition:opacity .15s;pointer-events:none}
.orb:hover .lab{opacity:1}
.xpbar{background:rgba(0,0,0,.55)}
.xpbar i{display:block;height:100%;background:linear-gradient(#f0d878,#a88a28)}
.stam{background:rgba(0,0,0,.35)}
.stam i{display:block;height:100%;background:linear-gradient(#58c858,#2a7a2a)}
.belt{pointer-events:auto}
.bslot{position:absolute;top:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bslot small{position:absolute;left:2px;top:0;font-size:9px;color:#caa;text-shadow:0 0 2px #000;z-index:2;pointer-events:none}
.bslot .item{background:none}
.skbtn{display:flex;align-items:center;justify-content:center;cursor:pointer;background:#0b0705;border:1px solid #5a4a2a;overflow:hidden}
.skbtn:hover{border-color:var(--gold)}
.skbtn small{display:none}
.ico{display:flex;align-items:center;justify-content:center;font-size:11px;color:#c9a24a;overflow:hidden;flex:none}
.ico .sn{font-size:8px;line-height:9px;text-align:center;word-break:break-word;padding:1px;color:#d8c07a}
.hudbtns{pointer-events:auto}
.hb{position:absolute;padding:0;margin:0;border:0;border-radius:0;background-color:transparent;background-repeat:no-repeat;box-shadow:none;width:20px;height:19px;filter:brightness(1.1)}
.hb:hover{filter:brightness(1.8)}
.lvlbtn{background-repeat:no-repeat;cursor:pointer;animation:blink 1s infinite}
@keyframes blink{50%{filter:brightness(1.7)}}
.ptsflag{position:absolute;left:50%;transform:translateX(-50%);bottom:136px;background:rgba(20,14,6,.88);border:1px solid var(--gold);color:#ffe27a;padding:3px 10px;font:600 12px var(--d2);display:none;cursor:pointer}
.monbar{position:absolute;left:50%;top:8px;width:300px;margin-left:-150px;text-align:center;font:600 13px var(--body);display:none;text-shadow:0 0 3px #000}
.monbar div{height:8px;border:1px solid var(--gold2);background:#150808;margin-top:2px}.monbar i{display:block;height:100%;background:#c01818}
.monbar.unique span{color:#ffe45a}.monbar.champion span{color:#6e7bff}
.toasts{position:absolute;left:50%;top:44px;transform:translateX(-50%);text-align:center;pointer-events:none}
.toast{font-size:15px;color:#ffe9a8;text-shadow:0 0 4px #000,0 0 4px #000;transition:opacity .6s;margin:2px 0}.toast.out{opacity:0}
/* ---------- bảng D2: .pin là 320x432 theo toạ độ D2, co 0.95 */
.panel{position:absolute;top:4px;width:304px;height:411px;overflow:visible}
.panel.left{left:12px}.panel.right{right:12px}
.pin{position:absolute;left:0;top:0;width:320px;height:432px;transform:scale(.95);transform-origin:0 0;font-family:var(--body);font-size:12px;color:var(--d2white)}
.pin>*{position:absolute}
.pin .sp{position:absolute}
.ptitle{font:700 14px/24px var(--d2);color:var(--d2gold);text-align:center;letter-spacing:1px;text-shadow:0 0 3px #000;pointer-events:none;white-space:nowrap}
.fld{display:flex;align-items:center;justify-content:center;font:12px var(--body);color:var(--d2white);overflow:hidden;white-space:nowrap;line-height:1.05;pointer-events:none}
.fld.two{flex-direction:column}.fld.two small{font-size:8px;color:var(--d2gold);display:block}
.fld.lv{justify-content:space-between;padding:0 6px;font-size:11px}.fld.lv span{color:var(--d2gold)}.fld.lv b{font-weight:400;color:#fff}
.plus{border:0;background-color:transparent;background-repeat:no-repeat;border-radius:0;padding:0;box-shadow:none;color:transparent;cursor:pointer}
.plus:hover{filter:brightness(1.6)}
.xbtn{display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--d2gold);font:700 16px var(--d2);border:0;background:none}
.xbtn:hover{color:#fff;background:rgba(255,255,255,.07)}
.gold{font:12px var(--body);color:var(--d2gold);pointer-events:none;white-space:nowrap}.gold b{color:#ffd24a;font-weight:400}
.eslot{background:none}
.eslot .item{background-color:rgba(0,0,0,.72)}
.grid{position:absolute}
.gridbg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,29px);grid-template-rows:repeat(4,29px);pointer-events:none}
.gridbg i{display:block}
.lockcell{background:rgba(0,0,0,.72)}
.item{position:absolute;display:flex;align-items:center;justify-content:center;font-size:11px;overflow:hidden;background:none}
.item.sel{outline:2px solid #fff;outline-offset:-2px}
.iimg{position:absolute}
.dim{color:#8a7a5a;font-size:12px}
/* khung chi tiết nằm ngoài bảng, phía giữa màn hình */
.detail{position:absolute;top:0;width:280px;background:rgba(10,7,4,.95);border:1px solid var(--gold2);padding:7px 9px;font:12px/1.45 var(--body);color:var(--ink);box-shadow:0 0 0 1px #000}
.panel.left .detail{left:312px}.panel.right .detail{right:312px;top:150px}
.acts{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.tabs button{position:absolute;background:none;border:0;box-shadow:none;border-radius:0;padding:0;color:var(--d2gold);font:600 11px var(--d2);text-shadow:0 0 3px #000;cursor:pointer}
.tabs button.on{color:#fff}.tabs button:hover{background:rgba(255,255,255,.06)}
.skpts{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:600 10px var(--d2);color:var(--d2gold);pointer-events:none}.skpts b{font-size:24px;color:#fff;font-weight:700}
.tree{position:absolute;inset:0;pointer-events:none}
.sknode{position:absolute;width:48px;height:48px;padding:2px;background:#0b0806;opacity:.62;cursor:pointer;pointer-events:auto;border:1px solid #2a2014}
.sknode.on{opacity:1;border-color:var(--gold)}.sknode.can{opacity:1;border-color:#6c6;box-shadow:0 0 6px #6c6}.sknode.sel{outline:2px solid #fff}
.sknode b{position:absolute;right:2px;bottom:0;font:700 11px var(--body);color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.plus2{position:absolute;left:-6px;top:-6px;background:#2a6a2a;color:#fff;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;font-size:14px;cursor:pointer;z-index:2}
.qlist{overflow:hidden}
.quest{border:1px solid #3a2c18;background:rgba(0,0,0,.6);padding:6px;margin:0 0 6px;line-height:1.45;font-size:12px;color:var(--d2white)}.quest.done{border-color:#2a6a2a}
.wplist{display:flex;flex-direction:column;gap:1.2px;overflow:hidden}
.modal.d2 .wpb{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;box-shadow:none;border-radius:0;padding:0 8px 0 42px;font:13px var(--body);color:var(--d2white);height:35px;flex:none}
.modal.d2 .wpb:hover{border-color:var(--gold);color:#fff}.modal.d2 .wpb.off{color:var(--d2gold)}.modal.d2 .wpb.xb{text-align:center;font:700 16px var(--d2);color:var(--d2gold);background:none;border:0}
.shoprow{position:absolute;cursor:pointer}
.shoprow .price{position:absolute;left:0;right:0;bottom:0;height:13px;padding:0;border:0;border-radius:0;background:rgba(0,0,0,.78);color:#ffd24a;font:700 9px/13px var(--body);box-shadow:none}
.shoprow .price.off{color:#c66}
.hint{font:10px var(--body);color:var(--d2gold);white-space:nowrap;pointer-events:none}
.dialog{position:absolute;left:50%;bottom:136px;transform:translateX(-50%);width:520px;background:var(--panel);border:2px solid var(--gold2);outline:1px solid #000;padding:10px 14px;box-shadow:inset 0 0 0 1px #000,0 0 18px #000}
.dname{color:var(--d2gold);font:700 17px var(--d2);margin-bottom:4px}.dtext{font-size:14px;line-height:1.5;margin-bottom:8px;color:var(--d2white)}.dbtns{display:flex;gap:8px;flex-wrap:wrap}
.skpop{position:absolute;bottom:134px;display:none;background:var(--panel);border:2px solid var(--gold2);padding:6px;max-width:420px;flex-wrap:wrap;gap:6px}
.skpop[style*="block"]{display:flex!important}
.pk{width:70px;text-align:center;border:1px solid #3a2c18;padding:3px;cursor:pointer;font-size:10px}.pk:hover{border-color:var(--gold)}.pk .ico{margin:0 auto}
.tip{position:absolute;z-index:20;background:rgba(8,5,3,.96);border:1px solid var(--gold2);padding:6px 9px;font:12px/1.45 var(--body);max-width:260px;pointer-events:none;color:var(--d2white)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;background:var(--panel);border:2px solid var(--gold2);padding:12px;text-align:center}
.modal.d2{left:12px;top:4px;width:304px;height:411px;transform:none;background:none;border:0;padding:0;text-align:left}
.modal h3{margin:0 0 8px;color:var(--d2gold);font:700 18px var(--d2)}.modal button{display:block;width:100%;margin:6px 0;padding:8px}
.modal.d2 button{margin:0}
.automap{position:absolute;inset:0;pointer-events:none;z-index:1}
/* ---------- màn hình */
.screen{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#2a0c08,#050202 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30}
.screen.dead{background:rgba(40,0,0,.7)}.screen.load{background:#050202}
.logo{font:700 60px var(--d2);letter-spacing:6px;color:#c01818;text-shadow:0 0 18px #700,0 3px 0 #000}
.logo2{font:600 22px var(--d2);color:var(--d2gold);letter-spacing:3px}
.tmenu{display:flex;flex-direction:column;gap:10px;margin-top:20px}.tmenu button,.go{font:600 18px var(--d2);padding:10px 40px}
.credit{position:absolute;bottom:8px;font-size:11px;color:#6a5a3a}
.classes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px}
.ccard{width:112px;height:92px;border:2px solid var(--gold2);background:#140c08;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:4px;font-family:var(--d2)}
.ccard.on{border-color:#ffd24a;background:#2a1a0c}.ccard.locked{opacity:.4}.ccard small{font:10px var(--body);color:#a96;text-align:center;padding:0 4px}
.cinfo{min-height:36px;font-size:14px;max-width:600px;text-align:center}.namerow{display:flex;gap:10px}
.namerow input{background:#0c0806;border:1px solid var(--gold2);color:var(--ink);padding:8px;font-size:16px;font-family:inherit;width:220px;pointer-events:auto;user-select:text;-webkit-user-select:text}
.back{position:absolute;left:14px;top:14px}
.rotate{position:fixed;inset:0;z-index:99;background:#000;color:var(--gold);display:none;flex-direction:column;align-items:center;justify-content:center;font-size:22px;gap:8px;pointer-events:none}
/* cảm ứng: nút bấm là của input.js; thanh điều khiển chỉ là nền, thu 1.0 và căn giữa để chừa chỗ cho nút */
body.touch .belt,body.touch .skbtn,body.touch .hudbtns,body.touch .stam{display:none}
body.touch .hbar{transform:translateX(80px) scale(1)}
body.touch .ptsflag{bottom:110px}
body.touch .panel{font-size:12px}
body.touch .panel.right{right:auto;left:326px}
body.touch .panel.right .detail{right:auto;left:312px;top:0;width:250px}
body.touch .dialog{bottom:112px}
@media (orientation:portrait) and (pointer:coarse){.rotate{display:flex}}
</style>
</head>
<body>
<div id="frame"><div id="stage"><canvas id="view"></canvas></div></div>
<script>
/* Co giãn stage 960x540 vừa khung nhìn, chừa viền đen (letterbox). */
(function () {
  var st = document.getElementById('stage');
  function fit() {
    var k = Math.min(window.innerWidth / 960, window.innerHeight / 540);
    st.style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit); fit();
  window.D2_FIT = fit;
})();
</script>
<script src="assets/sprites.js?v=20261006b"></script>
<script src="assets/sprites_obj.js?v=20261006b"></script>
<script src="assets/world.js?v=20261006b"></script>
<script src="assets/maps.js?v=20261006b"></script>
<script src="assets/ui.js?v=20261006b"></script>
<script src="js/data.js?v=20261006b"></script>
<script src="js/rules.js?v=20261006b"></script>
<script src="js/drlg.js?v=20261006b"></script>
<script src="js/engine.js?v=20261006b"></script>
<script src="js/input.js?v=20261006b"></script>
<script src="js/ui.js?v=20261006b"></script>
<script src="js/game.js?v=20261006b"></script>
</body>
</html>
