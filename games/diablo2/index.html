<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ác Quỷ II</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<style>
:root{--gold:#c9a24a;--gold2:#7a5f22;--ink:#e8d9a8;--panel:rgba(18,12,10,.94);--red:#b0141a;--blue:#1a3fb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:"Times New Roman",Georgia,serif;user-select:none;-webkit-user-select:none;touch-action:none}
#frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
/* flex:0 0 auto: nếu không, #stage co theo flex-shrink còn canvas vẫn 960px và mép phải bị cắt. */
#stage{position:relative;flex:0 0 auto;width:960px;height:540px;transform-origin:center center;background:#000;overflow:hidden}
canvas#view{position:absolute;inset:0;width:960px;height:540px;display:block;touch-action:none;cursor:default}
.ui{position:absolute;inset:0;pointer-events:none;z-index:5}
.ui button,.ui .panel,.ui .dialog,.ui .modal,.ui .screen,.ui .skpop,.ui .hud .orb,.ui .hud .skbtn,.ui .belt,.ui .hudbtns,.ui .ptsflag{pointer-events:auto}
button{font-family:inherit;color:var(--ink);cursor:pointer;background:linear-gradient(#3a2a1a,#1c120a);border:1px solid var(--gold2);border-radius:3px;padding:4px 10px;font-size:13px}
button:hover{border-color:var(--gold);color:#fff}
button.off{opacity:.45}
/* ---------- HUD */
.hud{position:absolute;inset:0}
.orb{position:absolute;width:92px;height:92px;border-radius:50%;bottom:8px;overflow:hidden;border:3px solid #2b1d10;box-shadow:0 0 0 2px var(--gold2),inset 0 0 14px #000;background:#120808}
.orb.life{left:10px}.orb.mana{right:10px}
.orb .fill{position:absolute;left:0;right:0;bottom:0;height:100%;transition:height .12s}
.orb.life .fill{background:radial-gradient(circle at 35% 30%,#ff6a5a,#b0141a 55%,#5a0509)}
.orb.mana .fill{background:radial-gradient(circle at 35% 30%,#7aa0ff,#1a3fb0 55%,#0a1a5a)}
.orb .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;opacity:0;transition:opacity .15s}
.orb:hover .lab{opacity:1}
.xpbar{position:absolute;left:112px;right:112px;bottom:0;height:5px;background:#120c08;border-top:1px solid var(--gold2)}
.xpbar i{display:block;height:100%;background:linear-gradient(#e8d070,#a08020)}
.stam{position:absolute;left:112px;width:120px;bottom:10px;height:6px;background:#1a1208;border:1px solid var(--gold2)}
.stam i{display:block;height:100%;background:#3a9a3a}
.belt{position:absolute;left:50%;margin-left:-100px;bottom:16px;display:flex;gap:4px;padding:4px;background:rgba(10,6,4,.8);border:1px solid var(--gold2)}
.bslot{position:relative;width:42px;height:42px;background:#0c0806;border:1px solid #3a2c18;display:flex;align-items:center;justify-content:center}
.bslot small{position:absolute;left:2px;top:0;font-size:10px;color:#a96}
.skbtn{position:absolute;bottom:14px;width:62px;height:62px;background:#0c0806;border:2px solid var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.skbtn.left{left:122px}.skbtn.right{right:122px}
.skbtn small{position:absolute;bottom:-14px;font-size:10px;white-space:nowrap;color:var(--ink);text-shadow:0 0 3px #000}
.ico{display:flex;align-items:center;justify-content:center;font-size:11px;color:#c9a24a;overflow:hidden}
.ico .sn{font-size:8px;line-height:9px;text-align:center;word-break:break-word;padding:1px;color:#d8c07a}
.hudbtns{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.hb{padding:3px 6px;font-size:12px;position:relative}.hb small{font-size:9px;color:#a96;margin-left:3px}
.ptsflag{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;background:rgba(40,28,10,.85);border:1px solid var(--gold);color:#ffe27a;padding:3px 10px;font-size:13px;display:none;cursor:pointer}
.monbar{position:absolute;left:50%;top:8px;width:300px;margin-left:-150px;text-align:center;font-size:13px;display:none;text-shadow:0 0 3px #000}
.monbar div{height:8px;border:1px solid var(--gold2);background:#150808;margin-top:2px}.monbar i{display:block;height:100%;background:#c01818}
.monbar.unique span{color:#ffe45a}.monbar.champion span{color:#6e7bff}
.toasts{position:absolute;left:50%;top:44px;transform:translateX(-50%);text-align:center;pointer-events:none}
.toast{font-size:15px;color:#ffe9a8;text-shadow:0 0 4px #000,0 0 4px #000;transition:opacity .6s;margin:2px 0}.toast.out{opacity:0}
/* ---------- bảng */
.panel{position:absolute;top:8px;bottom:112px;width:360px;background:var(--panel);border:2px solid var(--gold2);padding:8px 10px;font-size:13px;overflow:hidden}
.panel.left{left:8px}.panel.right{right:8px}
.panel.inv{width:360px}
.phead{font-size:16px;color:var(--gold);border-bottom:1px solid var(--gold2);margin-bottom:6px;padding-bottom:3px;display:flex;justify-content:space-between}
.phead .x{padding:0 7px;font-size:12px}
.sub{color:#d8c8a0;margin:4px 0}.row{margin:3px 0}.dim{color:#8a7a5a;font-size:12px}
.stats{width:100%;margin:6px 0}.stats td{padding:2px 4px}.stats .v{text-align:right;color:#fff;width:50px}
.plus{padding:0 8px;font-weight:bold;color:#9f9}
.derived{line-height:1.55;margin-top:6px}
.equip{position:relative;height:238px}
.eslot{position:absolute;border:1px solid #4a3a20;background:#0b0806}
.eslot small{position:absolute;left:2px;top:1px;font-size:9px;color:#6a5a3a;pointer-events:none}
.grid{position:relative;margin:2px auto 0;width:300px}
.gridbg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,30px);grid-template-rows:repeat(4,30px)}
.gridbg i{border:1px solid #2a2014;background:#0b0806}
.item{position:absolute;border:1px solid;background:rgba(40,30,16,.9);display:flex;align-items:center;justify-content:center;font-size:11px;overflow:hidden}
.item.sel{outline:2px solid #fff}
.iimg{position:absolute}
.bottle{width:70%;height:78%;border-radius:40% 40% 35% 35%;border:2px solid #fff6}
.bottle.hp{background:radial-gradient(circle at 35% 30%,#ff8a7a,#b0141a)}.bottle.mp{background:radial-gradient(circle at 35% 30%,#8ab0ff,#1a3fb0)}.bottle.rej{background:radial-gradient(circle at 35% 30%,#e0a0ff,#8a1ab0)}
.gold{margin:6px 0;text-align:right}
.detail{margin-top:4px;font-size:12px;line-height:1.45;min-height:70px;border-top:1px solid #3a2c18;padding-top:4px}
.acts{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px}.tabs button.on{border-color:var(--gold);background:#4a3418}
.tree{position:relative;height:272px;margin-top:4px}.tree svg{position:absolute;left:0;top:0}
.sknode{position:absolute;width:42px;height:42px;border:2px solid #3a2c18;background:#0b0806;opacity:.7;cursor:pointer}
.sknode.on{opacity:1;border-color:var(--gold)}.sknode.can{opacity:1;border-color:#6c6;box-shadow:0 0 6px #6c6}.sknode.sel{outline:2px solid #fff}
.sknode b{position:absolute;right:1px;bottom:0;font-size:11px;color:#fff;text-shadow:0 0 3px #000}
.sknode .ico{margin:2px}.plus2{position:absolute;left:-5px;top:-5px;background:#2a6a2a;color:#fff;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;font-size:14px;cursor:pointer}
.quest{border:1px solid #3a2c18;padding:6px;margin:6px 0;line-height:1.5}.quest.done{border-color:#2a6a2a}
.dialog{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:520px;background:var(--panel);border:2px solid var(--gold);padding:10px 14px}
.dname{color:var(--gold);font-size:17px;margin-bottom:4px}.dtext{font-size:14px;line-height:1.5;margin-bottom:8px}.dbtns{display:flex;gap:8px;flex-wrap:wrap}
.shoplist{max-height:340px;overflow:auto}.shoprow{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid #2a2014}.shoprow .nm{flex:1}
.skpop{position:absolute;bottom:92px;display:none;background:var(--panel);border:2px solid var(--gold2);padding:6px;max-width:420px;flex-wrap:wrap;gap:6px}
.skpop[style*="block"]{display:flex!important}
.pk{width:70px;text-align:center;border:1px solid #3a2c18;padding:3px;cursor:pointer;font-size:10px}.pk:hover{border-color:var(--gold)}.pk .ico{margin:0 auto}
.tip{position:absolute;z-index:20;background:rgba(10,6,4,.96);border:1px solid var(--gold);padding:6px 9px;font-size:12px;line-height:1.45;max-width:260px;pointer-events:none}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;background:var(--panel);border:2px solid var(--gold);padding:12px;text-align:center}
.modal h3{margin:0 0 8px;color:var(--gold)}.modal button{display:block;width:100%;margin:6px 0;padding:8px}
.automap{position:absolute;inset:0;pointer-events:none;z-index:1}
/* ---------- màn hình */
.screen{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#2a0c08,#050202 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30}
.screen.dead{background:rgba(40,0,0,.7)}.screen.load{background:#050202}
.logo{font-size:64px;letter-spacing:6px;color:#c01818;text-shadow:0 0 18px #700,0 3px 0 #000;font-weight:bold}
.logo2{font-size:22px;color:var(--gold);letter-spacing:3px}
.tmenu{display:flex;flex-direction:column;gap:10px;margin-top:20px}.tmenu button,.go{font-size:18px;padding:10px 40px}
.credit{position:absolute;bottom:8px;font-size:11px;color:#6a5a3a}
.classes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px}
.ccard{width:112px;height:92px;border:2px solid var(--gold2);background:#140c08;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:4px}
.ccard.on{border-color:#ffd24a;background:#2a1a0c}.ccard.locked{opacity:.4}.ccard small{font-size:10px;color:#a96;text-align:center;padding:0 4px}
.cinfo{min-height:36px;font-size:14px;max-width:600px;text-align:center}.namerow{display:flex;gap:10px}
.namerow input{background:#0c0806;border:1px solid var(--gold2);color:var(--ink);padding:8px;font-size:16px;font-family:inherit;width:220px;pointer-events:auto;user-select:text;-webkit-user-select:text}
.back{position:absolute;left:14px;top:14px}
.rotate{position:fixed;inset:0;z-index:99;background:#000;color:var(--gold);display:none;flex-direction:column;align-items:center;justify-content:center;font-size:22px;gap:8px;pointer-events:none}
body.touch .belt,body.touch .skbtn,body.touch .hudbtns,body.touch .stam{display:none}
body.touch .orb{width:70px;height:70px;bottom:6px}
body.touch .xpbar{left:90px;right:90px}
body.touch .ptsflag{bottom:90px}
body.touch .panel{bottom:8px;width:340px;font-size:12px}
@media (orientation:portrait) and (pointer:coarse){.rotate{display:flex}}
</style>
</head>
<body>
<div id="frame"><div id="stage"><canvas id="view"></canvas></div></div>
<script>
/* Co giãn stage 960x540 vừa khung nhìn, chừa viền đen (letterbox). */
(function () {
  var st = document.getElementById('stage');
  function fit() {
    var k = Math.min(window.innerWidth / 960, window.innerHeight / 540);
    st.style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit); fit();
  window.D2_FIT = fit;
})();
</script>
<script src="assets/manifest.js?v=20261001d"></script>
<script src="js/data.js?v=20261001d"></script>
<script src="js/rules.js?v=20261001d"></script>
<script src="js/drlg.js?v=20261001d"></script>
<script src="js/engine.js?v=20261001d"></script>
<script src="js/input.js?v=20261001d"></script>
<script src="js/ui.js?v=20261001d"></script>
<script src="js/game.js?v=20261001d"></script>
</body>
</html>
