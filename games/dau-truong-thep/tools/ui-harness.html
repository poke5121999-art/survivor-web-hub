<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Đấu Trường Thép: thử giao diện</title>
<link rel="stylesheet" href="../css/ui.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3f7a3a; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script type="module">
import { MECHS, MECH_ORDER, TEAMS, TICK, BOT_NAMES, PAINTS, BOSSES, MODES, MODE_ORDER } from '../js/data.js';
import { MAPS, THEMES, pickArena } from '../js/maps.js';
import { createMatch, step, summary } from '../js/sim.js';
import { mulberry } from '../js/rng.js';
import { makeUI } from '../js/ui.js';
import { makeInput } from '../js/input.js';
import { makeMeta } from '../js/meta.js';

const q = new URLSearchParams(location.search);
const screen = q.get('screen') || 'menu';
window.__errors = [];
addEventListener('error', (e) => window.__errors.push(String(e.message)));
addEventListener('unhandledrejection', (e) => window.__errors.push(String(e.reason)));

// nha is not in MODE_ORDER until its HUD is released: the harness adds it so the picker, the saved mode and the lobby can be exercised.
if ((q.get('mode') === 'nha' || q.has('nha')) && !MODE_ORDER.includes('nha')) MODE_ORDER.push('nha');
if (q.get('lock')) MECHS[q.get('lock')].price = 600;
if (q.get('fresh')) { try { localStorage.removeItem('dtt.save.v1'); localStorage.removeItem('dtt.keys.v1'); } catch (e) { /* ignore */ } }

const cv = document.getElementById('scene');
const g2 = cv.getContext('2d');
let W = 0, H = 0, S = 1;
function resize() { cv.width = W = innerWidth; cv.height = H = innerHeight; }
addEventListener('resize', resize); resize();
const scale = () => (G.match ? Math.min(W / (G.match.map.w * 0.62), H / (G.match.map.d * 0.75)) : 10);

function portrait(key, team, paint) {
  (window.__portraitCalls = window.__portraitCalls || []).push([key, team, paint]);
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), col = '#' + (MECHS[key] || BOSSES[key]).tint.toString(16).padStart(6, '0');
  const grd = g.createRadialGradient(64, 50, 8, 64, 64, 90);
  grd.addColorStop(0, team ? '#6a3a2c' : '#2c5a72'); grd.addColorStop(1, '#10151a');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  g.fillStyle = col; g.fillRect(34, 46, 60, 52); g.fillStyle = '#20262d'; g.fillRect(40, 98, 12, 18); g.fillRect(76, 98, 12, 18);
  g.beginPath(); g.arc(64, 44, 22, 0, 7); g.fillStyle = col; g.fill(); g.strokeStyle = '#0008'; g.lineWidth = 4; g.stroke();
  g.fillStyle = '#0d1116'; g.fillRect(48, 38, 32, 9); g.fillStyle = team ? '#ff5a36' : '#35b8ff'; g.fillRect(52, 40, 24, 5);
  g.fillStyle = '#20262d'; g.fillRect(8, 56, 20, 12); g.fillRect(100, 56, 20, 12);
  const pc = PAINTS[paint] && PAINTS[paint].color;
  if (pc != null) { g.fillStyle = '#' + pc.toString(16).padStart(6, '0'); g.fillRect(34, 84, 60, 8); g.fillRect(48, 36, 32, 3); }
  return c.toDataURL();
}

const handlers = {};
const bus = {
  on(t, f) { (handlers[t] = handlers[t] || []).push(f); },
  emit(t, d) { (window.__log = window.__log || []).push([t, d]); (handlers[t] || []).forEach((f) => f(d)); },
};
const meta = makeMeta();
if (q.get('coins')) meta.get().coins = +q.get('coins');
if (q.get('trophies')) meta.get().trophies = +q.get('trophies');
if (MODES[q.get('mode')]) meta.get().mode = q.get('mode');
if (MAPS[q.get('map')]) meta.get().map = q.get('map');
if (q.get('theme') && (q.get('theme') === 'random' || THEMES[q.get('theme')])) meta.get().theme = q.get('theme');
const G = {
  bus, meta, match: null, me: 0, alpha: 1,
  audio: { setVolume(v) { window.__vol = v; }, setMusic(v) { window.__mus = v; } },
  portrait,
  project(x, y, z) {
    const s = scale(), px = W / 2 + x * s, py = H / 2 + z * s - y * s * 0.45;
    return { x: px, y: py, visible: px > -20 && px < W + 20 && py > -20 && py < H + 20 };
  },
  groundAt(cx, cy) { const s = scale(); return [(cx - W / 2) / s, (cy - H / 2) / s]; },
};

// A stand-in for online.js: the same surface the UI reads (state, lobby, error, calls) driven by URL params, so every screen can be shot without a network.
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const fo = { state: 'off', role: null, code: '', error: '', me: null, lobby: null, calls: [] };
{
  const emit = () => { bus.emit('net:state', { state: fo.state, role: fo.role }); bus.emit('net:lobby', fo.lobby); };
  const NAMES = ['Chủ Phòng', 'Bão Số 9', 'Cò Lả', 'Mèo Mun', 'Tí Sắt', 'Gió Chướng', 'Nắp Chai', 'Bánh Tét', 'Sấm Rền', 'Lúa Non'];
  const mine = () => fo.lobby.players.find((p) => p.id === fo.me);
  let held = null;
  fo.seed = (role, fill, mode) => {
    const ps = [];
    for (let i = 0; i < fill; i++) ps.push({ id: 'p' + i, name: NAMES[i], mech: MECH_ORDER[(i * 3) % MECH_ORDER.length], paint: i === 2 ? 'vang' : null, mods: { hp: 1, dmg: 1 }, team: mode === 'trum' ? 0 : i % 2, ready: i === 0 || i % 2 === 1, host: i === 0 });
    fo.me = role === 'host' ? 'p0' : 'p1'; fo.role = role; fo.code = 'K7QX2'; fo.state = 'lobby';
    if (role === 'host') ps[0].name = meta.get().name; else ps[1].name = meta.get().name;
    fo.lobby = { players: ps, map: 'denrung', theme: null, mode, diff: 'normal' };
  };
  const connect = async (call, ok) => {
    fo.calls.push(call);
    if (fo.state !== 'off') return false;
    fo.state = 'connecting'; fo.error = ''; emit();
    if (q.get('hold')) await new Promise((r) => { held = r; }); else await sleep(80);
    if (fo.state !== 'connecting') return false;
    const bad = ok();
    if (bad) { fo.error = bad; fo.state = 'off'; emit(); return false; }
    emit();
    return true;
  };
  fo.host = (a) => connect(['host', a], () => { fo.seed('host', +(q.get('fill') || 1), q.get('rmode') || 'tdm'); return ''; });
  fo.join = (a) => connect(['join', a], () => {
    if (String(a.code || '').toUpperCase() === 'XXXXX') return 'Không tìm thấy phòng. Hãy kiểm tra lại mã phòng.';
    fo.seed('guest', +(q.get('fill') || 3), q.get('rmode') || 'tdm'); return '';
  });
  fo.listRooms = async () => {
    fo.calls.push(['list']);
    await sleep(+(q.get('listms') || 60));
    if (q.get('listfail')) { fo.error = 'Không tải được danh sách phòng.'; return []; }
    if (q.has('norooms')) return [];
    return [
      { id: 'AB3D9', name: 'Phòng của Bão Số 9', mode: 'tdm', map: 'denrung', host: 'Bão Số 9', players: 3, max: 10 },
      { id: 'QW8ZK', name: 'Săn trùm cuối tuần', mode: 'trum', map: 'mienglua', host: 'Cò Lả', players: 5, max: 10 },
      { id: 'LM4TT', name: 'Hỗn chiến chớp nhoáng', mode: 'tudo', map: 'cangbang', host: 'Mèo Mun', players: 10, max: 10 },
    ];
  };
  fo.leave = () => {
    if (fo.state === 'off') return;
    fo.calls.push(['leave']); fo.state = 'off'; fo.role = null; fo.lobby = null; fo.me = null; fo.code = '';
    if (held) held(); emit();
  };
  fo.setMine = (m) => {
    if (fo.state !== 'lobby') return false;
    const p = mine(); fo.calls.push(['setMine', m]);
    for (const k of ['mech', 'paint', 'mods']) if (k in m) p[k] = m[k];
    if (typeof m.ready === 'boolean' && !p.host) p.ready = m.ready;
    bus.emit('net:lobby', fo.lobby); return true;
  };
  fo.setRoom = (r) => {
    fo.calls.push(['setRoom', r]); fo.error = '';
    if (fo.role !== 'host') return false;
    if (r.mode === 'trum' && fo.lobby.players.length > 5) { fo.error = 'Chế độ Săn trùm tối đa 5 người chơi.'; return false; }
    Object.assign(fo.lobby, r);
    if (r.mode) fo.lobby.players.forEach((p, i) => { p.team = r.mode === 'trum' ? 0 : p.host ? 0 : i % 2; });
    bus.emit('net:lobby', fo.lobby); return true;
  };
  fo.swapTeam = (id) => {
    fo.calls.push(['swapTeam', id]);
    if (fo.role !== 'host') return false;
    const p = fo.lobby.players.find((x) => x.id === id);
    if (!p || fo.lobby.mode === 'trum' || fo.lobby.mode === 'tudo') return false;
    p.team = 1 - p.team; bus.emit('net:lobby', fo.lobby); return true;
  };
  fo.start = () => {
    fo.calls.push(['start']); fo.error = '';
    if (fo.lobby.players.some((p) => !p.ready)) { fo.error = 'Còn người chơi chưa sẵn sàng.'; return false; }
    return true;
  };
  fo.toLobby = () => { fo.state = 'lobby'; emit(); return true; };
  fo.onLobby = () => () => {};
}
G.online = fo;
G.input = makeInput(G);
G.ui = makeUI(G);
window.__G = G;

const rnd = mulberry(1234);
const ang = (ax, az, bx, bz) => Math.atan2(bz - az, bx - ax);
function bot(m, u) {
  const b = u.brain || (u.brain = { t: 0, tx: 0, tz: 0 });
  let en = null, ed = 1e9;
  for (const o of m.units) {
    if (o.team === u.team || !o.alive) continue;
    const d = Math.hypot(o.x - u.x, o.z - u.z);
    if (d < ed) { ed = d; en = o; }
  }
  if (m.time > b.t) { b.t = m.time + 1 + rnd() * 1.5; b.tx = (rnd() - 0.5) * (m.map.w - 14); b.tz = (rnd() - 0.5) * (m.map.d - 14); }
  const tx = en && ed > 9 ? en.x : b.tx, tz = en && ed > 9 ? en.z : b.tz;
  const mv = ang(u.x, u.z, tx, tz);
  const aim = en ? ang(u.x, u.z, en.x, en.z) : mv;
  const R = rnd;
  return {
    mx: Math.cos(mv), mz: Math.sin(mv), aim, fire: !!en && ed < 14, tx: en ? en.x : tx, tz: en ? en.z : tz,
    s1: R() < 0.02, s2: R() < 0.015, ult: R() < 0.006, heal: u.hp < u.maxHp * 0.6,
  };
}

const modeParam = () => (MODES[q.get('mode')] ? q.get('mode') : 'tdm');
const mapParam = () => (MAPS[q.get('map')] || q.get('map') === 'random' ? q.get('map') : 'denrung');

function newMatch(choice) {
  const mech = (choice && choice.mech) || q.get('mech') || 'soi';
  const mode = (choice && MODES[choice.mode] && choice.mode) || modeParam();
  const seed = +(q.get('seed') || 7);
  const arena = pickArena((choice && choice.map) || mapParam(), choice && choice.theme !== undefined ? choice.theme : (q.get('theme') || null), seed);
  const map = arena.map;
  const roster = [];
  const names = BOT_NAMES.slice();
  const mine = (i) => ({ mech: i === 0 ? mech : MECH_ORDER[(i * 3 + 1) % MECH_ORDER.length], name: i === 0 ? meta.get().name : names[i], bot: i !== 0, diff: 'normal', mods: i === 0 && choice && choice.mods, paint: i === 0 && choice && choice.paint });
  // trum: five mechs against one boss; every other mode: ten mechs (tudo makes each its own team inside the sim).
  if (mode === 'trum') {
    for (let i = 0; i < 5; i++) roster.push({ team: 0, ...mine(i) });
    roster.push({ team: 1, mech: 'titan', name: 'Cự Thần', bot: true, diff: 'normal' });
  } else for (let i = 0; i < 10; i++) roster.push({ team: i % 2, ...mine(i) });
  G.match = createMatch({ map, theme: arena.theme, seed, roster, mode });
  G.me = 0;
  G.match.units[0].color = 0;
  if (!q.has('manual')) G.input.script(q.get('auto') === '0' ? null : (m, u) => bot(m, u));
}

function tick() {
  const m = G.match;
  if (!m || m.over) return;
  const inp = {};
  for (const u of m.units) inp[u.id] = u.id === G.me ? G.input.sample(u) : bot(m, u);
  step(m, inp);
  for (const e of m.events) G.ui.event(e);
}

let paused = false;
bus.on('ui:pause', (d) => { paused = d.paused; });
bus.on('ui:menu', () => { G.match = null; G.ui.showMenu(); });
bus.on('ui:play', (c) => { newMatch(c); G.ui.showHUD(); });

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (G.match && !paused && !q.get('freeze')) {
    acc += dt;
    while (acc >= TICK) { tick(); acc -= TICK; }
    G.alpha = acc / TICK;
  }
  g2.fillStyle = '#437f3d'; g2.fillRect(0, 0, W, H);
  const m = G.match;
  if (m) {
    const s = scale(), X = (x) => W / 2 + x * s, Z = (z) => H / 2 + z * s;
    g2.fillStyle = 'rgba(30,70,30,.6)'; for (const b of m.map.bushes) { g2.beginPath(); g2.arc(X(b.x), Z(b.z), b.r * s, 0, 7); g2.fill(); }
    g2.fillStyle = '#8a8f86'; for (const w of m.map.walls) g2.fillRect(X(w.x0), Z(w.z0), (w.x1 - w.x0) * s, (w.z1 - w.z0) * s);
    g2.fillStyle = '#5e6b4a'; for (const r of m.map.rounds) { g2.beginPath(); g2.arc(X(r.x), Z(r.z), r.r * s, 0, 7); g2.fill(); }
    for (const t of m.towers) { g2.fillStyle = t.alive ? TEAMS[t.color].css : '#555'; g2.globalAlpha = t.alive ? 1 : .5; g2.fillRect(X(t.x) - t.r * s * 0.8, Z(t.z) - t.r * s * 0.8, t.r * s * 1.6, t.r * s * 1.6); g2.globalAlpha = 1; }
    for (const p of m.points) { g2.strokeStyle = p.owner < 0 ? '#fff' : TEAMS[p.owner].css; g2.lineWidth = 4; g2.beginPath(); g2.arc(X(p.x), Z(p.z), p.r * s, 0, 7); g2.stroke(); }
    for (const c of m.crates) { g2.fillStyle = '#e8d27a'; g2.fillRect(X(c.x) - 8, Z(c.z) - 8, 16, 16); }
    for (const sh of m.shots) { g2.fillStyle = '#fff'; g2.fillRect(X(sh.x) - 2, Z(sh.z) - 2, 4, 4); }
    for (const u of m.units) {
      if (!u.alive) continue;
      g2.fillStyle = TEAMS[u.color].css; g2.beginPath(); g2.arc(X(u.x), Z(u.z), u.radius * s, 0, 7); g2.fill();
      g2.strokeStyle = '#000'; g2.lineWidth = 3; g2.beginPath(); g2.moveTo(X(u.x), Z(u.z)); g2.lineTo(X(u.x) + Math.cos(u.aim) * u.radius * s * 1.6, Z(u.z) + Math.sin(u.aim) * u.radius * s * 1.6); g2.stroke();
    }
    G.ui.update(paused ? 0 : dt);
  }
  requestAnimationFrame(frame);
}

function demoTweaks() {
  const m = G.match, me = m.units[0];
  if (q.get('low')) { me.hp = me.maxHp * 0.18; }
  if (q.get('buffs')) { me.hasteT = 8; me.hasteF = 1.3; me.dmgT = 11; me.dmgF = 1.35; me.shield = 500; me.shieldMax = 800; me.shieldT = 9; me.slowT = 2; me.slowF = .4; }
  if (q.get('dead')) { const a = m.units.find((u) => u.team === 0 && u.id !== 0); a.alive = false; a.respawnT = 3.4; a.hp = 0; }
  if (q.get('meDead')) { me.alive = false; me.hp = 0; me.respawnT = 3.2; }
}

async function iconSheet() {
  const { icon } = await import('../js/ui.js');
  const names = new Set(['weapon', 'shield', 'dash', 'quake', 'rocket', 'boost', 'barrage', 'mine', 'blink', 'beam', 'heal', 'slow', 'dome', 'trophy', 'wrench', 'up', 'info', 'nope-unknown-icon']);
  for (const k of MECH_ORDER) { names.add(MECHS[k].roleKey); for (const s of MECHS[k].skills) names.add(s.icon); }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;padding:10px;align-content:start;background:#151a20;color:#ffd467;font:11px sans-serif;overflow:auto';
  for (const n of names) {
    const c = document.createElement('div');
    c.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;background:#07090c;padding:8px 2px';
    c.innerHTML = icon(n) + '<span style="color:#98a5b3">' + n + '</span>';
    c.firstChild.style.cssText = 'width:40px;height:40px';
    box.appendChild(c);
  }
  document.body.appendChild(box);
}

function boot() {
  if (screen === 'icons') { iconSheet().then(() => { window.__ready = true; }); return; }
  if (screen === 'menu') { G.ui.showMenu(); }
  else if (screen === 'online') { G.ui.showMenu(); G.ui.showOnline(); }
  else if (screen === 'lobby') {
    fo.seed(q.get('role') || 'host', +(q.get('fill') || 4), q.get('rmode') || 'tdm');
    G.ui.showLobby();
  } else {
    if (q.get('onl')) fo.state = 'playing';
    newMatch({});
    G.ui.showHUD();
    const warp = +(q.get('warp') || (screen === 'hud' ? 700 : 1500));
    for (let i = 0; i < warp && !G.match.over; i++) tick();
    G.ui.update(1);
    if (screen === 'result') {
      const m = G.match;
      if (q.get('levelup')) { const d = meta.get(); d.level = 1; d.xp = 190; }
      if (m.mode === 'tudo') {
        // me finishes in ?place= (default 3); the others take the remaining distinct scores.
        const place = Math.max(1, Math.min(10, +(q.get('place') || 3))), pool = [12, 9, 8, 7, 6, 5, 4, 3, 2, 1];
        const mineScore = pool.splice(place - 1, 1)[0];
        m.units.forEach((u) => { u.kills = u.id === G.me ? mineScore : pool.shift(); m.score[u.id] = u.kills; });
        m.winner = m.units.find((u) => u.kills === 12).id; m.over = true;
      } else if (m.mode === 'trum') {
        const boss = m.units.find((u) => u.def.boss), won = !q.get('lose');
        m.units.forEach((u) => { if (!u.def.boss) u.dmg = 3000 + u.id * 2500 + (u.id === G.me ? 4000 : 0); });
        m.lives = won ? 5 : 0; boss.hp = won ? 0 : boss.maxHp * 0.3; boss.alive = !won;
        m.winner = won ? 0 : 1; m.over = true;
      } else if (m.mode === 'nha') {
        // won: their main fell; lose: ours fell; clock: nobody fell and the tower HP decides (?clock=win|lose|draw).
        const clock = q.get('clock'), lose = !!q.get('lose');
        const of = (team, kind) => m.towers.filter((t) => t.team === team && t.kind === kind);
        const kill = (t) => { t.alive = false; t.hp = 0; };
        if (clock) {
          of(0, 'sub')[0].hp = 3200; of(1, 'sub')[1].hp = 5100; of(1, 'main')[0].hp = 7400; of(0, 'main')[0].hp = clock === 'lose' ? 4000 : 9000;
          if (clock === 'draw') for (const t of m.towers) t.hp = t.maxHp / 2;
          m.winner = clock === 'win' ? 0 : clock === 'lose' ? 1 : -1; m.score[0] = 1; m.score[1] = 1;
        } else if (lose) {
          of(0, 'sub').forEach(kill); kill(of(0, 'main')[0]); kill(of(1, 'sub')[0]); of(1, 'main')[0].hp = 6200;
          m.winner = 1; m.score[0] = 1; m.score[1] = 3;
        } else {
          of(1, 'sub').forEach(kill); kill(of(1, 'main')[0]); kill(of(0, 'sub')[1]); of(0, 'main')[0].hp = 8800; of(0, 'sub')[0].hp = 2300;
          m.winner = 0; m.score[0] = 3; m.score[1] = 1;
        }
        m.over = true;
      } else {
        if (q.get('lose')) { m.score[0] = 12; m.score[1] = 25; m.winner = 1; m.over = true; }
        if (!m.over) { m.score[0] = 25; m.score[1] = 17; m.over = true; m.winner = 0; }
      }
      const sm = summary(m);
      G.ui.showResult(sm, meta.applyResult(sm, G.me));
    } else {
      demoTweaks();
      if (screen === 'pause') G.ui.showPause();
    }
  }
  window.__ready = true;
}
requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
boot();
</script>
</body>
</html>
