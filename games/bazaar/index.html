<style>
#bz-boot{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#120c08;color:#cfd6dc;font:15px/1.3 system-ui,sans-serif}
#bz-boot.done{display:none}
#bz-boot .t{font-size:15px;letter-spacing:.12em;color:#8a949e}
#bz-boot .bar{width:min(62vw,280px);height:6px;border-radius:3px;background:#23272e}
#bz-boot .bar i{display:block;width:0;height:100%;border-radius:3px;background:#e0a53c;transition:width .2s}
#bz-boot .pct{font-size:13px;font-variant-numeric:tabular-nums}
#bz-boot .hint{font-size:12px;color:#8a949e;min-height:1em;text-align:center;max-width:86vw}
#bz-boot button{display:none;padding:6px 14px;font-size:14px;border-radius:6px;border:0;background:#e0a53c;color:#14161a;font-weight:600;cursor:pointer}
#bz-boot.fail button{display:block}
</style>

<div id="bz-root"></div>
<!-- màn chờ: vẽ ngay khi HTML + CSS về, trước khi ~1 MB dữ liệu/JS tải xong (trên mạng chậm đó là vài giây trắng); gỡ khi BZ_READY -->
<!-- màn tải (giống repo2d-unity): vẽ ngay khi HTML về; chặn mọi thao tác tới khi dữ liệu, thẻ cả 7 hero, bóng PvP, ảnh giao diện và Spine sảnh
     tải xong (js/ui/core.js bootPreload gọi BZBoot.done). Phần đầu thanh = các <script> bên dưới, phần sau = bootPreload -->
<div id="bz-boot" role="progressbar" aria-label="Đang tải" data-scripts="56"><div class="t">ĐANG TẢI</div><div class="bar"><i></i></div><div class="pct">0%</div><div class="hint"></div><button type="button" onclick="location.reload()">Tải lại</button></div>
<noscript><p style="padding:24px">Chợ Phiên cần JavaScript để chạy.</p></noscript>
<script>window.BZ_REV = '20261023f';
// giữ tài nguyên đã tải trên máy (sw.js); ?v= theo rev để lên bản mới thì worker mới dọn bản cũ
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js?v=' + window.BZ_REV).catch(function (e) { console.info('service worker: ' + e.message); });
(function () {
  var el = document.getElementById('bz-boot'), bar = el.querySelector('.bar i'), pct = el.querySelector('.pct'), hint = el.querySelector('.hint'), title = el.querySelector('.t');
  var t0 = Date.now(), shown = -1, lastChange = Date.now(), finished = false, failed = false, SCRIPTS = 0.35;
  function show(f, label) {
    if (failed) return;
    var p = Math.max(0, shown, Math.min(100, Math.floor(f * 100)));
    if (p !== shown) { shown = p; lastChange = Date.now(); bar.style.width = p + '%'; }
    if (label) title.textContent = label;
    pct.textContent = p + '% · ' + Math.round((Date.now() - t0) / 1000) + ' s';
  }
  // phần <script> tĩnh: đếm sự kiện load / error của từng thẻ script (bắt ở pha capture vì load không nổi bọt)
  var got = 0;
  function onRes(e) {
    var s = e.target;
    if (finished || !s || s.tagName !== 'SCRIPT' || !s.src) return;
    if (e.type === 'error' && !/\/data\/(cards-|ghosts|frames)/.test(s.src)) B.fail('Không tải được ' + s.src.split('?')[0].split('/').slice(-2).join('/'));
    got++;
    var total = Math.max(+el.getAttribute('data-scripts') || 1, document.querySelectorAll('script[src]').length); // data-scripts = số thẻ <script src> tĩnh bên dưới
    if (!B.phase2) show(SCRIPTS * Math.min(1, got / total));
  }
  // nghe trên document: sự kiện load của phần tử không đi tới window
  document.addEventListener('load', onRes, true); document.addEventListener('error', onRes, true);
  var B = window.BZBoot = {
    phase2: false,
    // f = 0..1 của phần tải trước trong game (js/ui/core.js)
    progress: function (f, label) { B.phase2 = true; show(SCRIPTS + (1 - SCRIPTS) * f, label); },
    done: function () { if (failed) return; finished = true; show(1); clearInterval(tick); el.classList.add('done'); },
    fail: function (msg) { failed = true; el.classList.add('fail'); title.textContent = 'TẢI KHÔNG THÀNH CÔNG'; hint.textContent = msg || ''; clearInterval(tick); }
  };
  var tick = setInterval(function () {
    if (finished) return;
    show(shown / 100);
    hint.textContent = Date.now() - lastChange > 15000 ? 'Mạng chậm, vẫn đang tải…' : '';
  }, 1000);
})();
</script>
