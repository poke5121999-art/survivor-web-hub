<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="../../assets/favicon.svg">
    <title>Tiệm Nông Sản Mini</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2a1a; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
      /* The game's UI is authored against a 1080x1920 portrait canvas, so the canvas is the largest
         box of the project's own web aspect (WIDTH:HEIGHT) that fits the window. */
      #unity-canvas {
        width: min(100vw, calc(100vh * 540 / 960));
        height: min(100vh, calc(100vw * 960 / 540));
        background: #000; display: block; touch-action: none;
      }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; color: #e8f5d8; pointer-events: none; }
      #bar { width: 220px; height: 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #8bd450; transition: width .2s; }
      #back { position: fixed; left: 10px; top: 10px; padding: 6px 10px; border-radius: 6px;
        background: #0008; color: #fff; text-decoration: none; font-size: 14px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
    <div id="loading"><div>Đang tải…</div><div id="bar"><div id="fill"></div></div></div>
    <a id="back" href="../../index.html">← Hub</a>
    <script src="Build/casual-farm.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/casual-farm.data.unityweb",
        frameworkUrl: "Build/casual-farm.framework.js.unityweb",
        codeUrl: "Build/casual-farm.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Nikolay Chernyshov",
        productName: "Tiệm Nông Sản Mini",
        productVersion: "0.1",
      }, (p) => { document.getElementById("fill").style.width = (100 * p) + "%"; })
      .then((unityInstance) => {
        window.unityInstance = unityInstance;
        document.getElementById("loading").remove();
      }).catch((message) => { alert(message); });
    </script>
  </body>
</html>
