<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../../js/game-gate.js?v=20261103"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stylized Weapons</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f1016; --panel:#171925; --ink:#e8eaf2; --mut:#8c92a8; --acc:#ffb347; --line:#2a2d3d; }
  * { box-sizing: border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; }
  body[data-sheet="1"] #stage { background: radial-gradient(120% 140% at 30% 20%, #20212c, #14151d 60%, #101118); }
  body[data-sheet="2"] #stage { background: linear-gradient(#3e5d98, #213069 55%, #1b2757); }
  body.inspecting #stage { background: radial-gradient(90% 90% at 50% 40%, #272a3a, #101118); }
  header { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0 8px 0 0; letter-spacing:.04em; }
  button, .btn { background:#22253a; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  button.on { background:var(--acc); color:#1a1205; border-color:var(--acc); }
  button:hover { border-color:var(--acc); }
  #tip { color:var(--mut); min-height:1.4em; margin-left:auto; }
  #stage { width:100%; overflow:hidden; position:relative; }
  canvas { display:block; touch-action:none; margin:0 auto; }
  body.shot header, body.shot #panel, body.shot #lists, body.shot #tip { display:none; }
  body.shot { margin:0; background:transparent; }
  body.shot #stage { width:auto; }
  body.shot[data-sheet="1"] #stage { background: radial-gradient(120% 140% at 30% 20%, #20212c, #14151d 60%, #101118); }
  #panel { padding:12px 16px; display:grid; gap:10px; max-width:1100px; margin:0 auto; }
  #panel .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin-top:6px; }
  .kv span,.muted { color:var(--mut); }
  h2 { margin:0; font-size:18px; }
  #lists { padding:8px 16px 40px; max-width:1300px; margin:0 auto; }
  #lists summary { cursor:pointer; padding:8px 0; color:var(--mut); }
  #list { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px; }
  #list button { display:flex; justify-content:space-between; gap:8px; text-align:left; padding:5px 10px; font-size:13px; }
  #list b { color:var(--acc); font-weight:600; }
  body:not(.inspecting) #panel { display:none; }
  [hidden] { display:none !important; }
  label { color:var(--mut); }
</style>
</head>
<body data-sheet="1">
<header>
  <h1>STYLIZED WEAPONS</h1>
  <button data-sheet="1" class="on">Sheet 1 - combat</button>
  <button data-sheet="2">Sheet 2 - tools</button>
  <button id="view">Sheet / grid</button>
  <span id="total" class="muted"></span>
  <span id="tip"></span>
</header>
<div id="stage"></div>
<section id="panel" hidden>
  <div class="row"><button id="back">&larr; Back</button><button id="prev">&lsaquo;</button><button id="next">&rsaquo;</button>
    <button id="variant">Wear variant 1</button><button id="reseed">Reseed</button>
    <label><input type="checkbox" id="socks" checked> sockets</label><label><input type="checkbox" id="hand"> hand demo</label></div>
  <div id="winfo"></div>
  <div class="muted">drag = orbit, wheel / pinch = zoom. Dots: red grip, orange grip2, yellow muzzle, cyan tip, green edge.</div>
</section>
<section id="lists"><details><summary>All weapons and triangle counts</summary><div id="list"></div></details></section>
<script type="module" src="js/app.js"></script>
</body>
</html>
