<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#2b2f3a}canvas{background:#3a4152;margin:2px}
#grid{display:flex;flex-wrap:wrap;width:1040px}
.lab{color:#cfd6e4;font:12px monospace;width:100%}
</style></head><body>
<div id="grid"></div>
<script src="../js/sprite.js"></script>
<script>
async function load(id, form){
  const base='../assets/units/'+id+'_'+form;
  const j=await (await fetch(base+'.json')).json();
  const img=new Image(); img.src=base+'.png';
  await img.decode();
  return {model:j, sheet:img, anims:j.anims};
}
function cell(label){
  const c=document.createElement('canvas'); c.width=200; c.height=200;
  const d=document.createElement('div'); d.className='lab'; d.textContent=label;
  if(label) document.getElementById('grid').appendChild(d);
  document.getElementById('grid').appendChild(c);
  return c.getContext('2d');
}
function render(ctx, u, A, fr){
  const S=0.33;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,200,200);
  ctx.translate(100,185); ctx.scale(S,S); ctx.translate(-480,-320);
  const st=BCSprite.animState(u.model, A, fr);
  BCSprite.draw(ctx, u.model, u.sheet, st, {scale:1, flip:false});
}
window.run=async function(id, form){
  const u=await load(id, form);
  let ctx=cell(id+'_'+form+'  (static / walk00 x3 / attack02 x3)');
  render(ctx, u, null, 0);
  for(const an of ['00','02']){
    const A=u.anims[an]; const end=A?A.end:30;
    for(const fr of [Math.floor(end*0.2),Math.floor(end*0.5),Math.floor(end*0.8)]){
      ctx=cell(''); render(ctx, u, A, fr);
    }
  }
  document.title='done';
};
</script></body></html>
