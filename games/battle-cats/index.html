<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Battle Cats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3a2a12; --ink-soft: #5c4526;
    --cream: #fff4da; --cream-d: #f3d79a; --cream-dd: #e6bf74;
    --wood: #b07a3e; --wood-d: #7d5222;
    --sky1: #74c7f4; --sky2: #bfe8ff; --grass: #8fcf5f; --grass-d: #67a83e;
    --orange1: #ffd65a; --orange2: #ffac2e;
    --blue1: #8fd8ff; --blue2: #49aef0;
    --pink1: #ffb0db; --pink2: #ff69b4;
    --accent: #ffd34d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: "Baloo 2", system-ui, "Segoe UI", sans-serif; color: var(--ink);
    background: #bfe8ff; }
  #app { position: fixed; inset: 0; }
  .scr { position: absolute; inset: 0; display: none; flex-direction: column; }
  button { font-family: inherit; }

  /* ---- chunky Battle-Cats buttons & plates ---- */
  .chunky { border: 3px solid var(--ink); border-radius: 16px; cursor: pointer;
    color: var(--ink); font-weight: 800; box-shadow: 0 5px 0 rgba(58,42,18,.55);
    position: relative; transition: transform .05s, box-shadow .05s; }
  .chunky:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(58,42,18,.55); }
  .chunky:disabled { filter: grayscale(.5) brightness(.9); box-shadow: 0 5px 0 rgba(58,42,18,.3); }
  .plate { background: var(--cream); border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 0 3px 0 rgba(58,42,18,.35); }

  /* ---- shared chrome (topbar used by map/equip/upgrade/gacha) ---- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; flex-shrink: 0;
    background: linear-gradient(var(--wood), var(--wood-d)); border-bottom: 4px solid var(--ink); z-index: 3; }
  .topbar .back { background: linear-gradient(var(--cream), var(--cream-d)); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 12px; padding: 7px 13px; font-size: 14px; font-weight: 800;
    cursor: pointer; box-shadow: 0 3px 0 rgba(58,42,18,.5); }
  .topbar .back:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(58,42,18,.5); }
  .topbar h2 { margin: 0; font-size: 19px; flex: 1; color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 1px var(--ink); }
  .pill { background: linear-gradient(var(--cream), var(--cream-d)); border: 3px solid var(--ink);
    border-radius: 20px; padding: 4px 13px; font-size: 13px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .pill.food { color: #b5560b; } .pill.xp { color: #1d72c0; }

  /* ---- menu (title screen) ---- */
  #scr-menu { align-items: center; justify-content: flex-start; overflow: hidden;
    background: linear-gradient(var(--sky1), var(--sky2) 62%, #d7f0ff 62%); }
  #scr-menu::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
    background: linear-gradient(var(--grass), var(--grass-d)); border-top: 6px solid #4e8a2d; z-index: 0; }
  #scr-menu .cloud { position: absolute; background: #fff; border-radius: 50%; opacity: .85; z-index: 0;
    box-shadow: 42px 8px 0 -4px #fff, -42px 10px 0 -6px #fff, 20px -16px 0 -6px #fff; }
  .menu-inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center;
    width: min(360px, 88vw); margin-top: 6vh; }
  #scr-menu .logo { font-size: clamp(30px, 9vw, 46px); font-weight: 800; line-height: .98; text-align: center;
    color: #fff34f; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--wood-d), 0 7px 10px rgba(0,0,0,.35); letter-spacing: .5px; }
  #scr-menu .sub { color: #fff; font-weight: 700; font-size: 13px; margin: 2px 0 10px;
    text-shadow: 0 1px 0 var(--ink); }
  #scr-menu .mascot { width: 118px; margin: 2px 0 6px; filter: drop-shadow(0 6px 3px rgba(0,0,0,.25)); }
  #scr-menu .stats { display: flex; gap: 7px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
  .menu-btns { display: flex; flex-direction: column; gap: 13px; width: 100%; }
  .menu-btns button { font-size: 20px; padding: 15px; text-shadow: 0 2px 0 rgba(255,255,255,.4); }
  #go-play { background: linear-gradient(var(--orange1), var(--orange2)); }
  #go-upgrade { background: linear-gradient(var(--blue1), var(--blue2)); }
  #go-gacha { background: linear-gradient(var(--pink1), var(--pink2)); color: #5a1538; }

  /* ---- map (world map: themed strips with a winding node path) ---- */
  #map-list { flex: 1; overflow-y: auto; padding: 0 0 20px; background: #cdeeff; }
  .chapter { position: relative; margin-bottom: 10px; }
  .ch-banner { position: sticky; left: 0; display: flex; align-items: center; gap: 10px;
    padding: 7px 14px; font-size: 15px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 2px rgba(0,0,0,.55); z-index: 2; }
  .ch-banner .stars { font-size: 13px; font-weight: 800; color: #ffe79a; }
  .ch-track { position: relative; overflow-x: auto; overflow-y: hidden; height: 210px;
    -webkit-overflow-scrolling: touch; }
  .ch-inner { position: relative; height: 100%; }
  .ch-track svg.path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .node { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    border: 4px solid #fff; cursor: pointer; color: var(--ink); font-weight: 800;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 4px 7px rgba(0,0,0,.4); background: radial-gradient(circle at 50% 34%, #ffe9a6, #f2b43c 88%); }
  .node .n-no { font-size: 18px; line-height: 1; }
  .node .n-nm { font-size: 8px; font-weight: 700; margin-top: 2px; opacity: .85; max-width: 52px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .node.cleared { background: radial-gradient(circle at 50% 34%, #d6f5c0, #74c35a 88%); }
  .node.boss { background: radial-gradient(circle at 50% 34%, #ffc0cb, #d4506a 88%); color: #fff; border-color: #ffd7df; }
  .node.locked { background: radial-gradient(circle at 50% 34%, #cfd4e0, #8a93a8 88%); color: #5a6072;
    border-color: #c6ccd8; cursor: default; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .node.next { animation: nodePulse 1.1s ease-in-out infinite; }
  @keyframes nodePulse { 0%,100% { box-shadow: 0 4px 7px rgba(0,0,0,.4), 0 0 0 0 #ffe14d99; }
    50% { box-shadow: 0 4px 7px rgba(0,0,0,.4), 0 0 0 10px #ffe14d00; } }
  .node .n-star { position: absolute; top: -9px; font-size: 16px; color: #ffd34d; text-shadow: 0 1px 2px #000; }

  /* ---- equip ---- */
  #scr-equip { background: #cdeeff; }
  #eq-cats { flex: 1; overflow-y: auto; padding: 10px 12px 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap: 9px; align-content: start; }
  .eqcard { position: relative; background: linear-gradient(var(--cream), var(--cream-d));
    border: 3px solid var(--ink); border-radius: 12px; padding: 4px 3px 5px; cursor: pointer;
    color: var(--ink); display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 3px 0 rgba(58,42,18,.4); }
  .eqcard.on { border-color: #ff8e2b; background: linear-gradient(#fff0c0, #ffd977); transform: translateY(-2px);
    box-shadow: 0 5px 0 #c9711a; }
  .eqcard canvas { width: 80px; height: 64px; background: #fffaf0; border-radius: 8px; border: 2px solid var(--cream-dd); }
  .eqcard .nm { font-size: 10px; line-height: 1.12; height: 24px; overflow: hidden; text-align: center; font-weight: 700; margin-top: 3px; }
  .eqcard .meta { font-size: 10px; color: #a06a1e; font-weight: 700; }
  .eqcard .slotno { position: absolute; top: -8px; left: -8px; min-width: 22px; height: 22px;
    background: #ff5a4d; color: #fff; border: 2px solid var(--ink); border-radius: 50%; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 rgba(58,42,18,.4); }
  .eqcard .slotno:empty { display: none; }
  .eq-foot { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: linear-gradient(var(--wood), var(--wood-d)); border-top: 4px solid var(--ink); }
  #eq-start { flex: 1; font-size: 18px; padding: 13px; background: linear-gradient(var(--orange1), var(--orange2)); }

  /* ---- upgrade ---- */
  #scr-upgrade { background: #cdeeff; }
  #up-cats { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
  .up-base { display: flex; align-items: center; gap: 10px; margin: 10px 12px 6px; padding: 11px;
    background: linear-gradient(var(--cream), var(--cream-d)); border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: 0 3px 0 rgba(58,42,18,.4); }
  .up-base b { flex: 1; font-size: 15px; }
  .uprow { display: flex; align-items: center; gap: 10px; padding: 8px; margin-bottom: 7px;
    background: linear-gradient(var(--cream), var(--cream-d)); border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: 0 3px 0 rgba(58,42,18,.35); }
  .uprow canvas { width: 64px; height: 54px; flex-shrink: 0; background: #fffaf0; border-radius: 8px; border: 2px solid var(--cream-dd); }
  .uprow .info { flex: 1; min-width: 0; }
  .uprow .info .nm { font-size: 14px; font-weight: 800; }
  .uprow .info .lv { font-size: 11px; color: #a06a1e; font-weight: 700; }
  .upbtn, .up-base button { background: linear-gradient(var(--blue1), var(--blue2)); color: #08263f;
    border: 3px solid var(--ink); border-radius: 11px; padding: 9px 13px; font-size: 13px; font-weight: 800;
    cursor: pointer; white-space: nowrap; box-shadow: 0 3px 0 rgba(58,42,18,.45); }
  .upbtn:active, .up-base button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(58,42,18,.45); }
  .upbtn:disabled, .up-base button:disabled { filter: grayscale(.5) brightness(.92); }

  /* ---- gacha ---- */
  #scr-gacha { background: linear-gradient(#ffd9ef, #cdeeff 55%); }
  #g-result { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; }
  .g-banner { margin: 16px auto 0; width: min(340px, 86vw); padding: 14px; text-align: center;
    background: linear-gradient(var(--cream), var(--cream-d)); border: 3px solid var(--ink); border-radius: 16px;
    box-shadow: 0 4px 0 rgba(58,42,18,.4); }
  .g-banner .g-title { font-size: 20px; font-weight: 800; color: #d23b8a; }
  .g-banner .g-desc { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }
  #g-result .g-cap { width: 150px; height: 130px; background: #fffaf0; border: 3px solid var(--ink); border-radius: 14px; }
  #g-result .g-nm { font-size: 22px; font-weight: 800; }
  #g-result .g-tag { font-size: 15px; color: #b5560b; font-weight: 800; }
  #g-roll { margin: 0 auto 26px; font-size: 18px; padding: 15px 30px;
    background: linear-gradient(var(--pink1), var(--pink2)); color: #5a1538; }

  /* ---- FTUE intro overlay ---- */
  #ftue { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px;
    background: radial-gradient(120% 90% at 50% 30%, rgba(40,70,110,.55), rgba(10,20,35,.82)); text-align: center; }
  #ftue .ftue-cat { width: 128px; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  #ftue .bubble { max-width: 360px; background: var(--cream); border: 3px solid var(--ink); border-radius: 16px;
    padding: 16px 18px; font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.5;
    box-shadow: 0 4px 0 rgba(0,0,0,.4); }
  #ftue .bubble b { color: #c9711a; }
  #ftue-ok { font-size: 18px; padding: 14px 30px; background: linear-gradient(var(--orange1), var(--orange2)); }

  /* ---- battle (HUD overlays the full-screen field, like the original) ---- */
  #field { flex: 1; position: relative; min-height: 0; overflow: hidden; background: #8fc4e8; }
  #field canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #bt-top { position: absolute; top: 0; left: 0; right: 0; z-index: 4; display: flex;
    align-items: flex-start; justify-content: space-between; padding: 8px 12px; pointer-events: none; }
  #bt-topL { display: flex; align-items: center; gap: 6px; pointer-events: auto; }
  #bt-topR { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: auto; }
  #pause, #bt-quit { width: 36px; height: 36px; border-radius: 10px; border: 3px solid var(--ink); background: rgba(255,244,218,.92);
    color: #7d5222; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(58,42,18,.5); }
  #bt-quit { color: #c0392b; }
  #stage-name { background: rgba(255,244,218,.92); color: var(--ink); font-size: 13px; font-weight: 800;
    padding: 7px 12px; border-radius: 10px; border: 3px solid var(--ink); }
  #money { font-weight: 800; font-size: 25px; color: #fff14d; text-shadow: 0 0 1px var(--ink), -2px 0 var(--ink), 2px 0 var(--ink), 0 2px var(--ink), 0 3px 4px rgba(0,0,0,.6);
    font-variant-numeric: tabular-nums; letter-spacing: .5px; }
  #speed { background: rgba(255,244,218,.92); border: 3px solid var(--ink); color: var(--ink); border-radius: 16px;
    padding: 5px 13px; font-size: 12px; font-weight: 800; cursor: pointer; }

  #hud { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex;
    align-items: flex-end; justify-content: space-between; gap: 8px; padding: 8px 10px 10px; pointer-events: none; }
  .sysbtn { pointer-events: auto; width: 70px; height: 70px; border-radius: 50%; flex-shrink: 0;
    border: 4px solid var(--ink); background: radial-gradient(circle at 50% 32%, #fff, #e6d7a6 85%);
    color: #3a2d12; font-size: 10px; font-weight: 800; line-height: 1.12; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 3px 6px rgba(0,0,0,.5); }
  .sysbtn b { font-size: 13px; }
  #cannon { background: radial-gradient(circle at 50% 32%, #fff3dd, #f0a84e 85%); }
  .sysbtn:disabled { filter: grayscale(.55) brightness(.82); }
  #cats { pointer-events: auto; display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 4px; width: min(560px, 66vw); }
  .catbtn { position: relative; aspect-ratio: 5 / 4; border: 3px solid var(--ink); border-radius: 8px;
    background: linear-gradient(#fffaf0, #f0e6cf); color: #2a2113; cursor: pointer; overflow: hidden; padding: 0; }
  .catbtn canvas { position: absolute; top: 1px; left: 50%; transform: translateX(-50%); width: 98%; height: 74%; }
  .catbtn .cost { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; text-align: center;
    font-size: 11px; font-weight: 800; color: #b26a00; background: rgba(255,250,235,.85); line-height: 1.3; }
  .catbtn .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(86,182,236,.62);
    height: 0; z-index: 3; pointer-events: none; }
  .catbtn:disabled { filter: grayscale(.35) brightness(.9); }
  .catbtn.empty { visibility: hidden; }

  #bt-load { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--sky2); font-size: 18px; font-weight: 800; color: #5c4526; z-index: 6; }
  #bt-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20,30,45,.72); z-index: 5; flex-direction: column; gap: 14px; text-align: center; }
  #bt-overlay h1 { margin: 0; font-size: 46px; color: #fff34f; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--wood-d); }
  #bt-reward { color: #fff; font-size: 16px; font-weight: 700; line-height: 1.5; }
  .ov-btns { display: flex; gap: 12px; }
  #bt-overlay .ov-btns button { font-size: 16px; padding: 12px 24px; background: linear-gradient(var(--blue1), var(--blue2)); color: #08263f; }
  #bt-next { background: linear-gradient(var(--orange1), var(--orange2)) !important; }

  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 800; color: #5c4526; z-index: 10; background: var(--sky2); }
</style>
</head>
<body>
<div id="app">
  <!-- MENU -->
  <div class="scr" id="scr-menu">
    <span class="cloud" style="top:10%; left:16%; width:30px; height:30px;"></span>
    <span class="cloud" style="top:20%; left:70%; width:26px; height:26px;"></span>
    <span class="cloud" style="top:6%; left:48%; width:22px; height:22px;"></span>
    <div class="menu-inner">
      <div class="logo">THE<br>BATTLE CATS</div>
      <div class="sub">Bản web</div>
      <img class="mascot" src="assets/bg/catbase.png" alt="">
      <div class="stats">
        <span class="pill food">🍖 <span id="m-food">0</span></span>
        <span class="pill xp">XP <span id="m-xp">0</span></span>
        <span class="pill">🐱 <span id="m-owned">0</span></span>
        <span class="pill">Màn <span id="m-prog">0/0</span></span>
      </div>
      <div class="menu-btns">
        <button class="chunky" id="go-play">▶ Xuất trận</button>
        <button class="chunky" id="go-upgrade">⬆ Nâng cấp</button>
        <button class="chunky" id="go-gacha">🎰 Quay mèo</button>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div class="scr" id="scr-map">
    <div class="topbar"><button class="back" id="map-back">‹ Menu</button><h2>Chọn màn</h2></div>
    <div id="map-list"></div>
  </div>

  <!-- EQUIP -->
  <div class="scr" id="scr-equip">
    <div class="topbar"><button class="back" id="eq-back">‹ Màn</button>
      <h2>Đội hình · <span id="eq-stage"></span></h2>
      <span class="pill">Đã chọn <span id="eq-count">0/10</span></span></div>
    <div id="eq-cats"></div>
    <div class="eq-foot"><button class="chunky" id="eq-start">XUẤT TRẬN</button></div>
  </div>

  <!-- UPGRADE -->
  <div class="scr" id="scr-upgrade">
    <div class="topbar"><button class="back" id="up-back">‹ Menu</button><h2>Nâng cấp</h2>
      <span class="pill xp">XP <span id="up-xp">0</span></span></div>
    <div class="up-base"><b id="up-base">Cat Base Lv1</b><button id="up-base-btn">Nâng</button></div>
    <div id="up-cats"></div>
  </div>

  <!-- GACHA -->
  <div class="scr" id="scr-gacha">
    <div class="topbar"><button class="back" id="g-back">‹ Menu</button><h2>Quay mèo</h2>
      <span class="pill food">🍖 <span id="g-food">0</span></span></div>
    <div class="g-banner"><div class="g-title">Rare Cat Capsule</div>
      <div class="g-desc">Quay ra một chú mèo mới cho đội hình của bạn</div></div>
    <div id="g-result"></div>
    <button class="chunky" id="g-roll">Quay</button>
  </div>

  <!-- BATTLE -->
  <div class="scr" id="scr-battle">
    <div id="field">
      <canvas id="cv"></canvas>
      <div id="bt-top">
        <div id="bt-topL">
          <button id="pause" title="Tạm dừng">⏸</button>
          <button id="bt-quit" title="Rút lui">✕</button>
          <span id="stage-name"></span>
        </div>
        <div id="bt-topR">
          <div id="money">0/0¢</div>
          <button id="speed">2×</button>
        </div>
      </div>
      <div id="hud">
        <button class="sysbtn" id="worker"><b>Lv 1</b><span>Worker</span></button>
        <div id="cats"></div>
        <button class="sysbtn" id="cannon"><b>⚡</b><span>Cannon</span></button>
      </div>
      <div id="bt-load">Đang vào trận…</div>
      <div id="bt-overlay">
        <h1 id="bt-result"></h1>
        <div id="bt-reward"></div>
        <div class="ov-btns">
          <button class="chunky" id="bt-retry">Chơi lại</button>
          <button class="chunky" id="bt-next">Về bản đồ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FTUE intro -->
  <div id="ftue">
    <img class="ftue-cat" src="assets/bg/catbase.png" alt="">
    <div class="bubble" id="ftue-text"></div>
    <button class="chunky" id="ftue-ok">Bắt đầu!</button>
  </div>

  <div id="loading">Đang tải…</div>
</div>

<script src="js/sprite.js?v=20261102a"></script>
<script src="js/sim.js?v=20261102a"></script>
<script src="js/render.js?v=20261102a"></script>
<script src="js/save.js?v=20261102a"></script>
<script src="js/main.js?v=20261102a"></script>
</body>
</html>
