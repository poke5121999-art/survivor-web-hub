<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéOne UI viewer</title>
<!--
  Xem một panel NGUI qua js/ngui.js. Tham số URL:
    panel=<khoá P1.UI hoặc P1.UI_PREFABS>   (mặc định BattlePanel)
    show=<đường dẫn>,<...>   bật nút đang tắt;  hide=<...> tắt nút
    set=<đường dẫn>=<chữ>|...  đổi chữ label;  fill=<đường dẫn>=<0..1>|...
    bg=<màu css>   nền;  list=1  hiện ô chọn panel
-->
<style>
  html, body { margin: 0; height: 100%; background: #2b3a4a; overflow: hidden; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #pick { position: fixed; left: 4px; top: 4px; z-index: 10; font: 12px sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../data/atlas.js"></script>
<script src="../data/ui.js"></script>
<script src="../data/settings.js"></script>
<script src="../js/ngui.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const list = (k) => (q.get(k) || '').split(',').map((s) => s.trim()).filter(Boolean);
  const pairs = (k) => (q.get(k) || '').split('|').filter(Boolean).map((s) => {
    const i = s.lastIndexOf('=');
    return [s.slice(0, i), s.slice(i + 1)];
  });
  P1.ngui.base = '../';
  if (q.get('bg')) document.body.style.background = q.get('bg');
  const panel = q.get('panel') || 'BattlePanel';
  const ui = P1.ngui.build(panel, document.getElementById('stage'));
  list('show').forEach((p) => ui.show(p, true));
  list('hide').forEach((p) => ui.show(p, false));
  pairs('set').forEach(([p, t]) => ui.label(p, t.replace(/\\n/g, '\n')));
  pairs('fill').forEach(([p, v]) => ui.fill(p, +v));
  window.viewer = ui;
  window.viewerReady = P1.ngui.ready().then(() => ui.refresh()).then(() => P1.ngui.ready()).then(() => true);
  if (q.get('list')) {
    const sel = document.createElement('select');
    sel.id = 'pick';
    Object.keys(P1.UI).concat(Object.keys(P1.UI_PREFABS)).forEach((k) => {
      const o = document.createElement('option');
      o.value = o.textContent = k;
      o.selected = k === panel;
      sel.appendChild(o);
    });
    sel.onchange = () => { q.set('panel', sel.value); location.search = q.toString(); };
    document.body.appendChild(sel);
  }
})();
</script>
</body>
</html>
