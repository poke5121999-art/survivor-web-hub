  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; font-family: 'Plumpfull', 'Trebuchet MS', sans-serif; }
  #ui { z-index: 4; }
  a.hub { position: fixed; left: 6px; top: 4px; z-index: 9; font: 12px/1 system-ui, sans-serif; color: #fff; opacity: .7;
    text-decoration: none; padding: 4px 7px; border-radius: 6px; background: rgba(0, 0, 0, .35); }
  a.hub:hover { opacity: 1; }
  /* HUD navigation markers */
  .nav-marker { position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; display: none; }
  .nav-marker i { display: block; width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%;
    border: 4px solid #ffd23f; box-shadow: 0 0 8px rgba(0, 0, 0, .6), inset 0 0 6px rgba(255, 210, 63, .7);
    animation: navpulse 1s ease-in-out infinite alternate; }
  .nav-marker.off i { border-radius: 0; border: 0; box-shadow: none; animation: none; background: #ffd23f;
    clip-path: polygon(50% 100%, 0 30%, 30% 30%, 30% 0, 70% 0, 70% 30%, 100% 30%); filter: drop-shadow(0 0 3px #000); }
  @keyframes navpulse { from { transform: scale(.8); } to { transform: scale(1.05); } }
  /* level 5 gesture drawing */
  .gesture { position: absolute; inset: 0; }
  .gesture .g-area { position: absolute; left: 3%; top: 16%; width: 46%; height: 62%; pointer-events: auto; touch-action: none;
    border: 3px dashed rgba(255, 255, 255, .55); border-radius: 18px; background: rgba(0, 30, 60, .18); }
  .gesture .g-area canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gesture .g-tip { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #fff; font-size: 18px;
    text-shadow: 0 0 4px #000; pointer-events: none; }
  .gesture .g-ref { position: absolute; right: 3%; top: 16%; width: 18vmin; padding: 1.2vmin; border-radius: 16px;
    background: rgba(0, 40, 80, .55); border: 3px solid #ffd23f; text-align: center; }
  .gesture .g-ref canvas { width: 100%; display: block; }
  .gesture .g-name { color: #fff; font-size: 3vmin; text-shadow: 0 0 4px #000; }
  .gesture .g-result { position: absolute; left: 0; right: 0; text-align: center; color: #fff; opacity: 0;
    text-shadow: 0 0 6px #000, 0 3px 0 #0a3c78; white-space: pre-line; }
  .gesture .g-result { top: 80%; font-size: 4vmin; }
  .gesture .show { animation: gpop 1.6s ease-out forwards; }
  @keyframes gpop { 0% { opacity: 0; transform: scale(.5); } 15% { opacity: 1; transform: scale(1.1); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
</style>
