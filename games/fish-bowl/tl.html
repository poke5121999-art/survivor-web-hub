<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Bowl timeline check</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #sub { position: fixed; left: 0; right: 0; bottom: 6%; text-align: center; font-size: 22px; text-shadow: 0 0 4px #000; }
  #big { position: fixed; left: 0; right: 0; top: 42%; text-align: center; font-size: 56px; text-shadow: 0 0 6px #000; }
  #info { position: fixed; left: 8px; top: 6px; white-space: pre; text-shadow: 0 0 3px #000; }
  .bar { position: fixed; left: 0; right: 0; height: 12%; background: #000; transform-origin: center; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="top" style="top:0"></div><div class="bar" id="bottom" style="bottom:0"></div>
<div id="sub"></div><div id="big"></div><div id="info"></div>
<script type="module">
// Dev page: ?tl=<part of the director path or asset name, e.g. Intro>&t=<seconds> seeks one frame (window.__ready = true
// when drawn); without t it plays. Letterbox bars and subtitles are plain divs here; the game uses the uGUI layer.
import { createStage } from './js/stage.js';
import { TimelinePlayer } from './js/timeline.js';
import { Sound } from './js/sound.js';

const q = new URLSearchParams(location.search);
const stage = await createStage(document.getElementById('c'));
const sound = new Sound('./art/sfx', stage.sfx);
const [path, def] = stage.timeline(q.get('tl') || 'Intro');
const ui = {
  text(p, s) { document.getElementById(p.endsWith('SubtitlesText') ? 'sub' : 'big').textContent = s; },
  uiTrack(p, prop, v) {
    if (prop !== 'scale') return;
    const el = document.getElementById(p.endsWith('TopBar_Img') ? 'top' : 'bottom');
    el.style.transform = `scaleY(${v[1]})`;
  },
};
const player = new TimelinePlayer(def, { ...stage, ui, sound, rigs: new Map() });
const info = document.getElementById('info');
await stage.ready;
const seek = q.get('t');
if (seek != null) {
  // walk up to t in small steps so damped cameras settle the way they would while playing
  player.start();
  for (let t = 0; t < +seek; t += 1 / 30) player.update(Math.min(1 / 30, +seek - t));
  stage.render();
  info.textContent = `${def.asset} t=${player.t.toFixed(2)} / ${player.duration.toFixed(2)}`;
  window.__ready = true;
} else {
  player.start();
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    stage.update(now / 1000);
    if (player.update(dt)) player.start();
    stage.render();
    info.textContent = `${def.asset} t=${player.t.toFixed(2)} / ${player.duration.toFixed(2)}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
