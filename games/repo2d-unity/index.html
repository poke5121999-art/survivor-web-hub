<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ca Trực Đêm Biệt Đội</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /*
       * Khuôn trang cho hub.
       *
       * WHY tự viết thay vì dùng khuôn mặc định của Unity: khuôn mặc định ghi CỨNG
       * `canvas.style.width = "540px"` cho máy tính, nên trang không bao giờ co theo cửa sổ.
       * Đo được trên bản đã đẩy lên hub: cửa sổ cỡ điện thoại (390x780) thì khung game nằm ở
       * toạ độ x=-75, y=-111 — mất 75 điểm mỗi bên và 111 điểm trên dưới, bay luôn dòng ví và
       * chữ trên thanh tab. Nó cũng kèm một thanh chân có logo Unity mà không game nào khác
       * trên hub có.
       *
       * Ở đây khung game LUÔN vừa cửa sổ và GIỮ ĐÚNG TỈ LỆ 9:16: lấy cạnh nào chật hơn làm
       * chuẩn. Giữ tỉ lệ chứ không kéo giãn, vì giao diện trong game được dựng theo khung dọc
       * 9:16 và kéo giãn thì chữ méo.
       */
      html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        background: #0c0d10; overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #unity-container {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      /* Tỉ lệ 9:16, luôn vừa cửa sổ. `min()` chọn cạnh chật hơn nên không bao giờ tràn. */
      #unity-canvas {
        display: block; background: #0c0d10; outline: none;
        width: min(100vw, calc(100vh * 9 / 16));
        height: min(100vh, calc(100vw * 16 / 9));
      }
      #unity-loading-bar {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; color: #cfd6dc; pointer-events: none;
      }
      #unity-loading-bar.done { display: none; }
      #unity-loading-title { font-size: 15px; letter-spacing: .12em; color: #8a949e; }
      #unity-progress-bar-empty {
        width: min(62vw, 280px); height: 6px; border-radius: 3px; background: #23272e;
      }
      #unity-progress-bar-full {
        width: 0%; height: 100%; border-radius: 3px; background: #e0a53c; transition: width .2s;
      }
      #unity-warning {
        position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
        color: #e6ebee; background: rgba(20,22,26,.92); padding: 10px 14px; border-radius: 8px;
        font-size: 13px; max-width: 86vw; display: none;
      }
      /* Nút về hub — mấy game khác trên hub đều có, bản Unity trước đây thì không. */
      #back-to-hub {
        position: absolute; right: 10px; top: 10px; z-index: 5;   /* bên phải: bên trái là chỗ tiêu đề của game */
        color: #cfd6dc; background: rgba(20,22,26,.72); border: 1px solid #2c323a;
        border-radius: 8px; padding: 6px 12px; font-size: 13px; text-decoration: none;
      }
      #back-to-hub:hover { background: rgba(32,36,42,.92); }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <a id="back-to-hub" href="../../index.html">← Hub</a>
      <div id="unity-loading-bar">
        <div id="unity-loading-title">ĐANG TẢI</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        warningBanner.style.display = "block";
        warningBanner.textContent = msg;
        if (type !== "error") setTimeout(function () { warningBanner.style.display = "none"; }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/repo2d-unity.data.unityweb",
        frameworkUrl: buildUrl + "/repo2d-unity.framework.js.unityweb",
        codeUrl: buildUrl + "/repo2d-unity.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HLO",
        productName: "Ca Trực Đêm Biệt Đội",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Bộ đệm vẽ phải khớp cỡ THẬT của canvas trên màn hình, nhân với độ nét của máy.
      // Không đặt thì Unity vẽ ở cỡ mặc định rồi trình duyệt phóng lên — chữ nhoè và
      // chỗ chạm lệch với chỗ nhìn thấy.
      function fitCanvas() {
        var r = canvas.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(r.width * dpr);
        canvas.height = Math.round(r.height * dpr);
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", function () { setTimeout(fitCanvas, 200); });

      var script = document.createElement("script");
      script.src = buildUrl + "/repo2d-unity.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function () {
          loadingBar.classList.add("done");
          fitCanvas();
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
