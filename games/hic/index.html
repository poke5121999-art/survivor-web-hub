<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hắn Đang Tới</title>
<!-- WHY: thiếu favicon thì trình duyệt gọi /favicon.ico mỗi lần tải và ghi một
     lỗi 404, che mất lỗi thật trong console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E%F0%9F%97%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<!-- VT323 là một trong rất ít phông pixel có bộ chữ tiếng Việt (đo 2026-09-15:
     Pixelify Sans, Silkscreen, Tiny5 đều thiếu dải U+1EA0). Tải không được thì
     rơi về phông hệ thống, game vẫn đọc được. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root{
    --ink:#eef3f7; --dim:#9fb0bf; --bg:#0b0f14; --panel:#17202b; --panel2:#101820;
    --line:#2e3d4d; --line2:#46586b; --gold:#ffd452; --good:#6fd26a; --bad:#ff5a4a;
    --hp:#ff4d5e; --atk:#ffb13b; --arm:#5fb4ff; --spd:#c7f25b;
    --common:#a9b8c6; --rare:#4aa3ff; --heroic:#c47bff;
    --golden:#ffd452; --diamond:#7cf3ff; --cauldron:#ff9a3c;
    --pix:"VT323",ui-monospace,monospace;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --top:44px; --side:176px; --slot:46px;
    --safeL:env(safe-area-inset-left,0px); --safeR:env(safe-area-inset-right,0px);
    --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
    --ease-out:cubic-bezier(.2,.9,.25,1); --ease-back:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05080c;overflow:hidden;color:var(--ink);
    font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:none;
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  canvas{image-rendering:pixelated}
  .num{font-family:var(--pix);font-variant-numeric:tabular-nums;letter-spacing:.02em}

  /* ============================================================ khung */
  #hic-stage{position:fixed;inset:0;background:var(--bg);overflow:hidden;display:grid;
    padding:var(--safeT) var(--safeR) var(--safeB) var(--safeL)}
  #hic-stage.land{grid-template-columns:var(--side) 1fr;grid-template-rows:var(--top) 1fr}
  #hic-stage.port{grid-template-columns:1fr;grid-template-rows:var(--top) 1fr auto}
  .hic-top{grid-column:1/-1;grid-row:1}
  .land .hic-side{grid-column:1;grid-row:2}
  .land .hic-maparea{grid-column:2;grid-row:2}
  .port .hic-maparea{grid-column:1;grid-row:2}
  .port .hic-side{grid-column:1;grid-row:3}
  .hic-maparea{position:relative;overflow:hidden;min-height:0;min-width:0}
  canvas#hic-view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ============================================================ thanh trên */
  .hic-top{display:flex;align-items:center;gap:8px;padding:0 8px;z-index:3;
    background:linear-gradient(180deg,#1b2633,#121a23);border-bottom:2px solid #070b10;
    box-shadow:0 2px 0 #243344 inset}
  .hic-week{font-family:var(--pix);font-size:22px;line-height:1;color:var(--gold);
    text-shadow:0 2px 0 #5a4300;white-space:nowrap}
  .hic-clock{flex:1;min-width:90px;position:relative;height:22px}
  .hic-clockbar{position:absolute;inset:4px 22px 4px 0;display:flex;gap:2px;border-radius:4px;overflow:hidden;
    background:#06090d;box-shadow:0 0 0 2px #06090d}
  .hic-seg{position:relative;height:100%;overflow:hidden}
  .hic-seg.day{flex:50;background:#3a4a32}
  .hic-seg.night{flex:30;background:#232447}
  .hic-seg i{position:absolute;inset:0;right:auto;width:0}
  .hic-seg.day i{background:linear-gradient(180deg,#ffe27a,#f2a93b)}
  .hic-seg.night i{background:linear-gradient(180deg,#8f8cff,#4b43c9)}
  .hic-seg.past i{width:100%!important;opacity:.35}
  .hic-clockskull{position:absolute;right:0;top:0;width:22px;height:22px;display:grid;place-items:center;
    font-size:15px;filter:drop-shadow(0 0 4px #ff3b3b)}
  .hic-clockskull.due{animation:beat .6s infinite}
  .hic-phase{font-family:var(--pix);font-size:20px;line-height:1;white-space:nowrap;min-width:52px}
  .hic-steps{font-family:var(--pix);font-size:20px;line-height:1;color:var(--dim);white-space:nowrap}
  .hic-steps b{color:var(--ink);font-weight:400}
  .hic-goldchip{display:flex;align-items:center;gap:4px;font-family:var(--pix);font-size:22px;color:var(--gold);
    background:#06090d;border-radius:8px;padding:1px 8px 1px 4px;box-shadow:0 0 0 2px #2b2410 inset}
  .hic-goldchip canvas{width:18px;height:18px}
  .hic-goldchip.bump{animation:bump .35s var(--ease-back)}
  .hic-iconbtn{width:34px;height:34px;border-radius:9px;border:none;background:#243140;
    box-shadow:0 -3px 0 #121a23 inset,0 0 0 2px #0a0f14;font-size:17px;display:grid;place-items:center;padding:0}
  .hic-iconbtn:active{transform:translateY(2px);box-shadow:0 -1px 0 #121a23 inset,0 0 0 2px #0a0f14}

  /* ============================================================ cột trái / thanh dưới */
  .hic-side{z-index:3;background:linear-gradient(90deg,#141c26,#101720);border-right:2px solid #070b10;
    display:flex;flex-direction:column;gap:7px;padding:7px;overflow:hidden;min-height:0}
  .port .hic-side{border-right:none;border-top:2px solid #070b10;padding:6px 8px calc(6px + var(--safeB))}
  .hic-me{display:flex;gap:7px;align-items:center}
  .hic-portrait{width:44px;height:44px;flex:0 0 44px;border-radius:10px;background:radial-gradient(#2e4a3a,#15231c);
    box-shadow:0 0 0 2px #070b10,0 0 0 3px #2f4152 inset;display:grid;place-items:center;overflow:hidden}
  .hic-portrait canvas{width:40px;height:40px}
  .hic-mebody{flex:1;min-width:0}
  .hic-hpbar{position:relative;height:16px;border-radius:5px;background:#06090d;box-shadow:0 0 0 2px #06090d;overflow:hidden}
  .hic-hpbar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#ff7a86,#e0283d);
    transition:width .35s var(--ease-out)}
  .hic-hpbar em{position:absolute;left:0;top:0;bottom:0;width:100%;background:#fff3;transition:width .8s .25s ease}
  .hic-hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pix);font-size:17px;
    line-height:1;text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000}
  .hic-hpbar.hurt{animation:shakeX .3s}
  .hic-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}
  .hic-stat{display:flex;align-items:center;justify-content:center;gap:2px;background:#06090d;border-radius:6px;height:22px;
    font-family:var(--pix);font-size:19px;line-height:1}
  .hic-stat canvas,.hic-stat .ico{width:16px;height:16px;flex:0 0 16px;font-size:12px;display:grid;place-items:center}
  .hic-stat.atk{color:var(--atk)} .hic-stat.arm{color:var(--arm)} .hic-stat.spd{color:var(--spd)}
  .hic-stat.pop{animation:bump .4s var(--ease-back)}
  .hic-slothead{display:flex;align-items:baseline;justify-content:space-between;font-size:11px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.08em}
  .hic-slothead b{font-family:var(--pix);font-size:17px;color:var(--ink);font-weight:400;letter-spacing:0}
  .hic-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--slot),1fr));gap:5px;align-content:start;
    overflow-y:auto;min-height:0;flex:1;padding:2px}
  .port .hic-sidebody{display:flex;gap:8px;align-items:stretch}
  .port .hic-me{flex:0 0 44%}
  .port .hic-slotwrap{flex:1;min-width:0;display:flex;flex-direction:column}
  .port .hic-slots{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:var(--slot);overflow-x:auto;overflow-y:hidden}
  .land .hic-sidebody{display:flex;flex-direction:column;gap:7px;min-height:0;flex:1}
  .land .hic-slotwrap{display:flex;flex-direction:column;gap:4px;min-height:0;flex:1}
  .hic-slot{position:relative;aspect-ratio:1;width:100%;border:none;border-radius:9px;padding:0;background:#0a1016;
    box-shadow:0 0 0 2px #06090d,inset 0 0 0 2px var(--rc,#2a3846),inset 0 -8px 12px rgba(0,0,0,.35);
    display:grid;place-items:center;transition:transform .15s var(--ease-out)}
  .hic-slot canvas{width:78%;height:78%}
  .hic-slot.weapon{--rc:#806a2a;background:radial-gradient(#2a2412,#0d0f10)}
  .hic-slot.weapon::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:2px;background:var(--gold)}
  .hic-slot.empty{box-shadow:0 0 0 2px #06090d,inset 0 0 0 2px #1d2833;background:repeating-linear-gradient(45deg,#0a1016 0 5px,#0c131a 5px 10px)}
  .hic-slot.locked{opacity:.35}
  .hic-slot:active{transform:scale(.92)}
  .hic-slot.flashin{animation:slotIn .6s var(--ease-back)}
  .hic-slot.trig{animation:trig .45s ease-out}
  .hic-slot .gem{position:absolute;left:3px;bottom:3px;font-size:9px;font-family:var(--pix)}
  .hic-bagbadge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--good);
    color:#062;font-size:11px;font-weight:800;display:none;place-items:center;padding:0 4px}
  .has .hic-bagbadge{display:grid;animation:beat 1s infinite}

  /* ============================================================ điều khiển trên bản đồ */
  .hic-ctrls{position:absolute;left:0;right:0;bottom:0;pointer-events:none;display:flex;justify-content:space-between;
    align-items:flex-end;padding:10px 12px 12px;z-index:4}
  .hic-ctrls>*{pointer-events:auto}
  .hic-dpad{position:relative;width:132px;height:132px;opacity:.9}
  .hic-dpad button{position:absolute;width:46px;height:46px;border:none;border-radius:12px;
    background:rgba(16,24,32,.72);box-shadow:0 0 0 2px rgba(0,0,0,.5),inset 0 -3px 0 rgba(0,0,0,.4);
    font-size:16px;color:#dfe9f2;backdrop-filter:blur(2px)}
  .hic-dpad button:active,.hic-dpad button.on{background:rgba(255,212,82,.55);color:#241a00;transform:scale(.94)}
  #hic-up{left:43px;top:0}#hic-down{left:43px;top:86px}#hic-left{left:0;top:43px}#hic-right{left:86px;top:43px}
  #hic-wait{left:43px;top:43px;font-size:11px;border-radius:50%;opacity:.8}
  .hic-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .hic-bigbtn{position:relative;min-width:64px;height:52px;border:none;border-radius:14px;padding:0 12px;
    background:linear-gradient(180deg,#2e3e50,#1f2a36);box-shadow:0 0 0 2px #06090d,inset 0 -4px 0 #111820,inset 0 2px 0 #3d5166;
    font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
  .hic-bigbtn canvas{width:30px;height:30px}
  .hic-bigbtn:active{transform:translateY(2px);box-shadow:0 0 0 2px #06090d,inset 0 -2px 0 #111820}
  #hic-bossbtn{background:linear-gradient(180deg,#5a2330,#361620);box-shadow:0 0 0 2px #06090d,inset 0 -4px 0 #210c12,inset 0 2px 0 #7a3444;color:#ffd6d6}
  #hic-bossbtn.due{background:linear-gradient(180deg,#ff4b4b,#b61f2d);color:#fff;animation:beat .8s infinite}
  .hic-hide-dpad .hic-dpad{display:none}

  /* ============================================================ toast + băng rôn */
  .hic-toasts{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;gap:4px;z-index:6;pointer-events:none;width:92%}
  .hic-toast{background:rgba(8,12,17,.9);border-radius:10px;padding:5px 12px;font-size:13px;max-width:100%;text-align:center;
    box-shadow:0 0 0 2px #000,inset 0 0 0 1px #2e3d4d;animation:toastIn .28s var(--ease-back)}
  .hic-toast.good{color:#c9ffc2;box-shadow:0 0 0 2px #000,inset 0 0 0 1px #3f8a3a}
  .hic-toast.bad{color:#ffd0c8;box-shadow:0 0 0 2px #000,inset 0 0 0 1px #9a3a30}
  .hic-toast.out{animation:toastOut .25s forwards}
  .hic-banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:7;display:none}
  .hic-banner.on{display:block;animation:banner 2.2s var(--ease-out) forwards}
  .hic-banner b{display:inline-block;font-family:var(--pix);font-size:clamp(44px,9vmin,84px);line-height:1;font-weight:400;
    color:#fff;text-shadow:0 4px 0 #000,0 0 24px var(--bc,#ffcf5a);padding:6px 40px;
    background:linear-gradient(90deg,transparent,rgba(0,0,0,.65) 20%,rgba(0,0,0,.65) 80%,transparent)}
  .hic-banner small{display:block;font-size:14px;color:#dfe6ee;margin-top:6px;text-shadow:0 2px 0 #000}

  /* ============================================================ tooltip vật phẩm */
  .hic-tip{position:absolute;z-index:8;width:min(270px,80vw);display:none;pointer-events:auto;
    animation:popIn .18s var(--ease-back)}
  .hic-tip.on{display:block}

  /* ============================================================ bảng */
  .hic-dim{position:absolute;inset:0;background:rgba(3,6,10,.62);z-index:9;display:none;backdrop-filter:blur(1.5px)}
  .hic-dim.on{display:block;animation:fadeIn .2s}
  .hic-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;display:none;flex-direction:column;
    width:min(760px,calc(100% - 20px));max-height:calc(100% - 16px);
    background:linear-gradient(180deg,#1c2733,#131b24);border-radius:16px;overflow:hidden;
    box-shadow:0 0 0 3px #06090d,inset 0 0 0 2px #33475b,0 20px 60px rgba(0,0,0,.7)}
  .hic-panel.show{animation:panelIn .26s var(--ease-back)}
  .hic-panel.narrow{width:min(420px,calc(100% - 20px))}
  .hic-phead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:linear-gradient(180deg,#2a394a,#1d2936);
    box-shadow:inset 0 -2px 0 #0b1016}
  .hic-phead canvas{width:30px;height:30px;flex:0 0 30px}
  .hic-phead h3{margin:0;font-family:var(--pix);font-weight:400;font-size:26px;line-height:1;flex:1;letter-spacing:.02em;
    text-shadow:0 2px 0 #000}
  .hic-x{border:none;background:#0f161e;width:34px;height:34px;border-radius:9px;font-size:15px;box-shadow:inset 0 -3px 0 #070b10}
  .hic-hint{padding:8px 14px 0;font-size:13px;color:var(--dim);white-space:pre-line}
  .hic-pbody{flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
  .hic-panel.over .hic-phead{background:linear-gradient(180deg,#7a2530,#4a1520)}
  .hic-panel.win .hic-phead{background:linear-gradient(180deg,#2f7a3a,#1d4a24)}
  .hic-offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}

  .hic-card{position:relative;border-radius:12px;padding:10px 11px;background:linear-gradient(180deg,#1a2430,#121922);
    box-shadow:0 0 0 2px #06090d,inset 0 0 0 2px var(--rc,#2e3d4d),inset 0 3px 0 rgba(255,255,255,.04);
    animation:cardIn .35s var(--ease-back) both}
  .hic-offers .hic-card:nth-child(2){animation-delay:.05s}.hic-offers .hic-card:nth-child(3){animation-delay:.1s}
  .hic-offers .hic-card:nth-child(4){animation-delay:.15s}
  .hic-card.pickable{cursor:pointer;transition:transform .12s var(--ease-out)}
  .hic-card.pickable:hover{transform:translateY(-2px)}
  .hic-card.pickable:active{transform:scale(.97);background:linear-gradient(180deg,#26313d,#18212b)}
  .hic-card.dim{opacity:.45;filter:saturate(.5)}
  .hic-card.weapon{--rc:#806a2a}
  .hic-card.r-common{--rc:#4a5a69} .hic-card.r-rare{--rc:#2f6fb8} .hic-card.r-heroic{--rc:#8a4bc4}
  .hic-card.r-golden{--rc:#c79a1f} .hic-card.r-diamond{--rc:#3cb6c4} .hic-card.r-cauldron{--rc:#c0662a}
  .hic-card.r-heroic,.hic-card.r-golden,.hic-card.r-diamond{background:linear-gradient(180deg,#1f2333,#121922)}
  .hic-cardrow{display:flex;gap:10px;align-items:flex-start}
  .hic-cardicon{flex:0 0 auto;border-radius:10px;background:radial-gradient(#223040,#0b1117);box-shadow:inset 0 0 0 2px var(--rc,#2e3d4d)}
  .hic-cardbody{flex:1;min-width:0}
  .hic-cardtop{display:flex;align-items:baseline;gap:8px}
  .hic-cardtop b{font-size:14px;flex:1;line-height:1.2}
  .hic-rar{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--rc2,#9fb0bf);font-weight:700}
  .r-rare .hic-rar{color:var(--rare)} .r-heroic .hic-rar{color:var(--heroic)} .r-golden .hic-rar{color:var(--golden)}
  .r-diamond .hic-rar{color:var(--diamond)} .r-cauldron .hic-rar{color:var(--cauldron)}
  .hic-statline{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .hic-pill{display:inline-flex;align-items:center;gap:3px;background:#06090d;border-radius:6px;padding:1px 6px 1px 3px;
    font-family:var(--pix);font-size:18px;line-height:1.05}
  .hic-pill canvas,.hic-pill .ico{width:14px;height:14px;font-size:10px;display:grid;place-items:center}
  .hic-pill.hp{color:var(--hp)} .hic-pill.atk{color:var(--atk)} .hic-pill.arm{color:var(--arm)} .hic-pill.spd{color:var(--spd)}
  .hic-fx{font-size:12.5px;margin-top:5px;color:#d6e0e8;line-height:1.38}
  .hic-tags{font-size:10px;margin-top:5px;color:#7d8e9e;text-transform:uppercase;letter-spacing:.06em}
  .hic-price{position:absolute;right:10px;bottom:9px;display:flex;align-items:center;gap:3px;font-family:var(--pix);
    font-size:22px;color:var(--gold)}
  .hic-price canvas{width:16px;height:16px}
  .hic-card.dim .hic-price{color:var(--bad)}
  .hic-note{font-size:13px;line-height:1.5;color:#cfd9e2;margin:2px 0 4px}
  .hic-stats2{font-size:12px;color:var(--dim)}

  .hic-btn{border:none;border-radius:11px;padding:11px 14px;font-size:14px;font-weight:700;
    background:linear-gradient(180deg,#2e3e50,#223040);box-shadow:0 0 0 2px #06090d,inset 0 -4px 0 #151e28,inset 0 2px 0 #3e5267}
  .hic-btn.wide{width:100%}
  .hic-btn.ghost{background:#141c25;box-shadow:0 0 0 2px #06090d,inset 0 -3px 0 #0b1016;color:#b8c6d3}
  .hic-btn.primary{background:linear-gradient(180deg,#ffe07a,#f0b53a);color:#2a1a00;
    box-shadow:0 0 0 2px #06090d,inset 0 -4px 0 #b57c12,inset 0 2px 0 #fff2b8}
  .hic-btn.danger{background:linear-gradient(180deg,#ff6b5e,#c9303a);color:#fff;box-shadow:0 0 0 2px #06090d,inset 0 -4px 0 #7d1822}
  .hic-btn:active{transform:translateY(2px)}
  .hic-btn:disabled{opacity:.4}
  .hic-btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .hic-btnrow .hic-btn{flex:1;min-width:130px}

  .hic-mergeline{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .hic-mergeicon{border-radius:8px;background:#0b1117}
  .hic-mergeop{opacity:.6;font-size:16px}
  .hic-mergename{font-size:14px;font-weight:700}
  .hic-where{font-size:11px;color:#8595a4;margin-top:4px}
  .hic-card.incoming{--rc:var(--gold);background:linear-gradient(180deg,#2a2614,#151712)}
  .hic-delta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-family:var(--pix);font-size:18px}
  .hic-delta .up{color:var(--good)} .hic-delta .down{color:var(--bad)} .hic-delta .flat{color:#8fa3b5}
  .hic-sechead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7f91a2;margin:6px 0 -2px;font-weight:700}

  .hic-guide{display:flex;gap:10px;align-items:flex-start;border-radius:11px;padding:8px 10px;background:#101820;
    box-shadow:inset 0 0 0 2px #1f2b37}
  .hic-guideicon{flex:0 0 auto;border-radius:9px;background:#0a1016}
  .hic-guidebody{flex:1;min-width:0}
  .hic-guidebody b{font-size:13px}
  .hic-guides{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:7px}
  .hic-terrain{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:7px}
  .hic-tcell{border-radius:10px;padding:7px 4px;text-align:center;background:#101820;box-shadow:inset 0 0 0 2px #1f2b37}
  .hic-tcell canvas{border-radius:7px}
  .hic-tcell b{display:block;font-size:11px;margin-top:4px}
  .hic-tcell span{display:block;font-size:10px;opacity:.6}

  .hic-statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .hic-statbox{background:#0a1016;border-radius:10px;padding:6px 4px;text-align:center;box-shadow:inset 0 0 0 2px #1f2b37}
  .hic-statbox b{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--pix);font-weight:400;font-size:26px;line-height:1}
  .hic-statbox b canvas,.hic-statbox b .ico{width:18px;height:18px;font-size:13px}
  .hic-statbox span{font-size:10px;color:#7f91a2;text-transform:uppercase;letter-spacing:.06em}
  .hic-statbox.hp b{color:var(--hp)} .hic-statbox.atk b{color:var(--atk)} .hic-statbox.arm b{color:var(--arm)} .hic-statbox.spd b{color:var(--spd)}
  .hic-gearwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .hic-gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px}
  .hic-gear .hic-slot.sel{box-shadow:0 0 0 2px #06090d,inset 0 0 0 3px var(--gold)}
  .hic-detail{min-height:76px}
  .hic-setrow{border-radius:11px;padding:8px 11px;background:#101820;box-shadow:inset 0 0 0 2px #1f2b37,inset 4px 0 0 #3a4a5c}
  .hic-setrow.done{box-shadow:inset 0 0 0 2px #2d5a2f,inset 4px 0 0 var(--good);background:#10201a}
  .hic-setname{display:flex;align-items:baseline;gap:8px;font-size:13px}
  .hic-setname b{flex:1}
  .hic-setname span{font-family:var(--pix);font-size:18px;opacity:.8}
  .hic-setparts{display:flex;gap:5px;margin:6px 0 2px}
  .hic-setpiece{border-radius:7px;background:#0a1016}
  .hic-setpiece.miss{opacity:.34;filter:grayscale(1)}
  .hic-bosscard{display:flex;gap:14px;align-items:center}
  .hic-bossart{flex:0 0 auto;width:120px;height:120px;border-radius:14px;background:radial-gradient(#4a1a24,#12080c);
    box-shadow:inset 0 0 0 2px #7a2a38;display:grid;place-items:center}
  .hic-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#101820;border-radius:11px;
    padding:10px 12px;box-shadow:inset 0 0 0 2px #1f2b37;font-size:14px;border:none;width:100%;text-align:left}
  .hic-toggle i{font-style:normal;font-family:var(--pix);font-size:20px;padding:0 10px;border-radius:7px;background:#06090d;color:#7f91a2}
  .hic-toggle.on i{color:#062;background:var(--good)}

  /* ============================================================ trận đánh */
  .hic-battle{position:absolute;inset:0;display:none;z-index:12;background:#05080c}
  .hic-battle.show{animation:battleIn .35s var(--ease-out)}
  .hic-scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hic-bhud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:10px;
    padding:calc(8px + var(--safeT)) calc(10px + var(--safeR)) 0 calc(10px + var(--safeL));pointer-events:none}
  .hic-bside{flex:1;max-width:46%}
  .hic-bside.foe{text-align:right}
  .hic-bname{font-family:var(--pix);font-size:24px;line-height:1;text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hic-bside.foe .hic-bname{color:#ffc2c2}
  .hic-bbar{position:relative;height:20px;margin-top:4px;border-radius:6px;background:#06090d;box-shadow:0 0 0 2px #000;overflow:hidden}
  .hic-bbar .lag{position:absolute;left:0;top:0;bottom:0;background:#fff;opacity:.55;transition:width .6s .2s ease}
  .hic-bbar .hp{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#7dff8a,#2fae3e);transition:width .18s ease-out}
  .hic-bside.foe .hic-bbar .hp{background:linear-gradient(180deg,#ff7a7a,#c62a2a)}
  .hic-bside.foe .hic-bbar .hp,.hic-bside.foe .hic-bbar .lag,.hic-bside.foe .hic-bbar .ar{left:auto;right:0}
  .hic-bbar .ar{position:absolute;left:0;top:0;height:7px;background:linear-gradient(180deg,#b8e0ff,#4aa3ff);transition:width .18s ease-out}
  .hic-bbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pix);font-size:19px;line-height:1;
    text-shadow:0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000}
  .hic-bchips{display:flex;gap:4px;margin-top:5px}
  .hic-bside.foe .hic-bchips{justify-content:flex-end}
  .hic-bchips .hic-pill{font-size:19px}
  .hic-bchips .hic-pill.pop{animation:bump .35s var(--ease-back)}
  .hic-bitems{position:absolute;left:calc(10px + var(--safeL));bottom:calc(58px + var(--safeB));display:flex;gap:5px;flex-wrap:wrap;
    max-width:48%;pointer-events:none}
  .hic-bitems .hic-slot{width:40px;height:40px}
  .hic-bfeed{position:absolute;right:calc(10px + var(--safeR));top:calc(72px + var(--safeT));width:min(300px,44%);opacity:.85;
    display:flex;flex-direction:column;gap:2px;align-items:flex-end;pointer-events:none}
  .hic-tline{font-size:11.5px;line-height:1.3;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:6px;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:feedIn .2s ease-out}
  .hic-bfoot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:flex-end;
    padding:0 calc(10px + var(--safeR)) calc(10px + var(--safeB)) calc(10px + var(--safeL))}
  .hic-bfoot .hic-btn{min-width:74px}
  .hic-bfoot .hic-btn.primary{min-width:140px}
  .hic-result{font-weight:800}
  .hic-bresult{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;display:none}
  .hic-bresult.on{display:block;animation:banner2 .6s var(--ease-back) forwards}
  .hic-bresult b{font-family:var(--pix);font-weight:400;font-size:clamp(52px,11vmin,96px);line-height:1;letter-spacing:.04em;
    text-shadow:0 5px 0 #000,0 0 30px currentColor}
  .hic-bresult.win b{color:#ffe27a} .hic-bresult.lose b{color:#ff6a5a}
  .hic-bresult small{display:block;font-family:var(--pix);font-size:26px;color:var(--gold);text-shadow:0 2px 0 #000;margin-top:4px}

  #hic-boot{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;
    background:#05080c;color:#8fa3b5;font-size:14px;text-align:center;padding:24px;z-index:50}
  #hic-boot b{font-family:var(--pix);font-weight:400;font-size:48px;color:var(--gold);text-shadow:0 3px 0 #5a4300}
  #hic-boot i{display:block;width:180px;height:8px;border-radius:4px;background:#111a22;overflow:hidden}
  #hic-boot i u{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}

  /* ============================================================ màn nhỏ */
  @media (max-height:430px){
    :root{--top:38px;--side:158px;--slot:40px}
    .hic-week{font-size:19px} .hic-phase,.hic-steps{font-size:18px}
    .hic-iconbtn{width:30px;height:30px}
    .hic-dpad{transform:scale(.86);transform-origin:left bottom}
    .hic-bigbtn{height:46px;min-width:56px;font-size:12px}
    .hic-phead h3{font-size:22px} .hic-pbody{padding:8px 10px 10px}
    .hic-bname{font-size:20px} .hic-bitems .hic-slot{width:34px;height:34px}
  }
  @media (min-width:1100px) and (min-height:640px){
    :root{--top:52px;--side:220px;--slot:56px}
    .hic-week{font-size:26px} .hic-phase,.hic-steps{font-size:23px}
  }
  .port .hic-steps{display:none}
  .port .hic-dpad{transform:scale(.9);transform-origin:left bottom}

  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes panelIn{from{opacity:0;transform:translate(-50%,-46%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes slotIn{0%{transform:scale(.4);filter:brightness(3)}60%{transform:scale(1.15)}100%{transform:scale(1);filter:none}}
  @keyframes trig{0%{transform:scale(1);filter:brightness(1)}30%{transform:scale(1.25) translateY(-4px);filter:brightness(2.2)}100%{transform:scale(1);filter:none}}
  @keyframes banner{0%{opacity:0;transform:scaleY(.2)}12%{opacity:1;transform:scaleY(1.1)}20%{transform:scaleY(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
  @keyframes banner2{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
  @keyframes battleIn{from{opacity:0;filter:brightness(4)}to{opacity:1;filter:none}}
  @keyframes feedIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="hic-stage" class="land">
  <div class="hic-top">
    <span class="hic-week" id="hic-week">Tuần 1</span>
    <span class="hic-phase" id="hic-phase">Ngày 1</span>
    <div class="hic-clock" id="hic-clock">
      <div class="hic-clockbar" id="hic-clockbar"></div>
      <div class="hic-clockskull" id="hic-skull">💀</div>
    </div>
    <span class="hic-steps"><b id="hic-steps">50</b> bước</span>
    <span class="hic-goldchip" id="hic-goldchip"><span class="ico" id="hic-goldico">🪙</span><span id="hic-gold">0</span></span>
    <button class="hic-iconbtn" id="hic-settings" title="Cài đặt">⚙</button>
    <button class="hic-iconbtn" id="hic-help" title="Cẩm nang">?</button>
  </div>

  <div class="hic-side" id="hic-side">
    <div class="hic-sidebody">
      <div class="hic-me">
        <div class="hic-portrait" id="hic-portrait"></div>
        <div class="hic-mebody">
          <div class="hic-hpbar" id="hic-hpwrap"><em id="hic-hplag"></em><i id="hic-hpbar"></i><span id="hic-hp">10/10</span></div>
          <div class="hic-stats">
            <div class="hic-stat atk" id="hic-st-atk"><span class="ico">⚔</span><span id="hic-attack">1</span></div>
            <div class="hic-stat arm" id="hic-st-arm"><span class="ico">🛡</span><span id="hic-armor">0</span></div>
            <div class="hic-stat spd" id="hic-st-spd"><span class="ico">👢</span><span id="hic-speed">0</span></div>
          </div>
        </div>
      </div>
      <div class="hic-slotwrap">
        <div class="hic-slothead"><span>Trang bị <b id="hic-slots">1/5</b></span><b id="hic-setcount"></b></div>
        <div class="hic-slots" id="hic-slotgrid"></div>
      </div>
    </div>
  </div>

  <div class="hic-maparea" id="hic-maparea">
    <canvas id="hic-view"></canvas>
    <div class="hic-toasts" id="hic-toasts"></div>
    <div class="hic-banner" id="hic-banner"><b></b><small></small></div>
    <div class="hic-ctrls">
      <div class="hic-dpad">
        <button id="hic-up">▲</button>
        <button id="hic-left">◀</button>
        <button id="hic-wait">chờ</button>
        <button id="hic-right">▶</button>
        <button id="hic-down">▼</button>
      </div>
      <div class="hic-actions">
        <button class="hic-bigbtn" id="hic-bossbtn"><span id="hic-bossico">💀</span><span id="hic-bosslabel">Trùm</span></button>
        <button class="hic-bigbtn" id="hic-bag"><span id="hic-bagico">🎒</span>Túi đồ<span class="hic-bagbadge" id="hic-bagbadge">!</span></button>
      </div>
    </div>
  </div>

  <div class="hic-tip" id="hic-tip"></div>
  <div class="hic-dim" id="hic-dim"></div>
  <div class="hic-panel" id="hic-panel"></div>
  <div class="hic-battle" id="hic-battle"></div>
  <div id="hic-boot"><b>Hắn Đang Tới</b><i><u id="hic-bootbar"></u></i><span id="hic-bootmsg">Đang tải…</span></div>
</div>

<script>
/* Mỗi script được xin kèm một dấu build (?v=...), để trình duyệt không bao giờ
   ghép một trang mới với một script cũ trong cache — đó đúng là kiểu lỗi mà
   người chơi báo "vẫn y như cũ" trong khi bản vá đã lên rồi. */
(function () {
  var STAMP = '20260915c';
  var FILES = [
    ['data/gamedata.js', 'HIC_DATA'],
    ['js/names.js', 'HIC_vnName'],
    ['js/battle.js', 'HIC_Battle'],
    ['js/effects.js', 'HIC_EFFECTS'],
    ['js/world.js', 'HIC_World'],
    ['js/game.js', 'HIC_Run'],
    ['js/art.js', 'HIC_ART'],
    // Atlas có thể thiếu (bị gỡ vì giấy phép) — khi đó sprites.js tự lùi về hình vector.
    ['art/sk/atlas.js', null, true],
    ['js/sprites.js', 'HIC_SPR'],
    ['js/sfx.js', 'HIC_SFX'],
    ['js/fx.js', 'HIC_FX'],
    ['js/fight.js', 'HIC_Fight'],
    ['js/ui.js', 'HIC_boot'],
    ['js/bot.js', 'HIC_BOT']
  ];
  var boot = document.getElementById('hic-boot');
  var bar = document.getElementById('hic-bootbar');
  var msg = document.getElementById('hic-bootmsg');
  var i = 0;

  function fail(m) {
    msg.style.color = '#e8735a';
    msg.textContent = m;
    console.error('[hic] ' + m);
  }

  function next() {
    bar.style.width = Math.round(100 * i / (FILES.length + 1)) + '%';
    if (i >= FILES.length) { loadAtlas(); return; }
    var f = FILES[i++];
    var s = document.createElement('script');
    s.src = f[0] + '?v=' + STAMP;
    s.onload = function () {
      if (f[1] && !window[f[1]]) { fail('Nạp được ' + f[0] + ' nhưng thiếu ' + f[1]); return; }
      next();
    };
    s.onerror = function () {
      if (f[2]) { next(); return; }
      fail('Không tải được ' + f[0]);
    };
    document.head.appendChild(s);
  }

  /* Chờ tấm atlas (tối đa 6 giây) rồi mới dựng game, để khung hình đầu tiên đã
     là sprite chứ không nháy hình vector rồi mới đổi. */
  function loadAtlas() {
    var started = false;
    function go() { if (started) return; started = true; start(); }
    if (!window.HIC_SK) { go(); return; }
    msg.textContent = 'Đang tải hình…';
    window.HIC_SPR.onReady(go);
    window.HIC_SPR.load('art/sk/atlas.png?v=' + STAMP);
    setTimeout(go, 6000);
    var poll = setInterval(function () { if (window.HIC_SPR.failed) { clearInterval(poll); go(); } }, 100);
  }

  function start() {
    bar.style.width = '100%';
    try {
      window.HIC_boot();
      boot.style.transition = 'opacity .35s';
      boot.style.opacity = '0';
      setTimeout(function () { boot.style.display = 'none'; }, 360);
    } catch (e) {
      fail('Lỗi khi khởi động: ' + e.message);
      throw e;
    }
  }

  next();
})();
</script>
<!-- Cầu nối tài khoản của hub. Nếu trang được mở lẻ (không qua hub) thì các
     tệp này không tồn tại và game vẫn chạy bình thường bằng bộ nhớ máy. -->
<script src="../../js/supabase-config.js" onerror="void 0"></script>
<script src="../../js/session.js" onerror="void 0"></script>
<script src="../../js/save-sync.js" onerror="void 0"></script>
</body>
</html>
