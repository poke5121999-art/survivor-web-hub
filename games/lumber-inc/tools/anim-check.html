<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Lumber Inc anim check</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script></head>
<body><canvas id="c"></canvas>
<script type="module">
// anim-check.html?show=Pre_Role001:run,Pre_Timber001:chopWood&t=0.25&cam=cx,cy,cz,dist,elev,azim
// show = prefab:role-action (idle|walk|run|chopWood...) pairs, placed 1.5 m apart along x; t = seconds to advance.
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/GLTFLoader.js';
import MeshoptDecoder from '../vendor/meshopt_decoder.js';
import { buildWorld } from '../js/view/world.js';
import { AnimLibrary, attachRigs } from '../js/view/anim.js';
const q = new URLSearchParams(location.search);
const J = u => fetch(u).then(r => r.json());
const [scene, clips, roles, rolesOf] = await Promise.all([J('../art/chars/scene.json'), J('../art/anim/clips.json'), J('../art/anim/roles.json'), J('../art/chars/roles-of.json')]);
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('../art/chars/geo.glb');
const w = buildWorld(scene, gltf, { texBase: '../art/tex' });
const lib = new AnimLibrary(clips, roles, rolesOf);
const rigs = attachRigs(lib, w);
const show = (q.get('show') || 'Pre_Role001:run,Pre_Timber001:chopWood').split(',').map(s => s.split(':'));
const roots = w.objects.filter((o, i) => scene.nodes[i].p < 0);
roots.forEach(o => { o.visible = false; });
const info = [];
show.forEach(([name, act], k) => {
  const root = roots.find(o => o.name === name);
  root.visible = true;
  root.position.x = (k - (show.length - 1) / 2) * 1.5;
  const rig = rigs.find(r => r.prefab === name);
  const ok = act.startsWith('chop') ? rig.playChop(act, { fade: 0 }) : rig.playRole(act, { fade: 0 });
  info.push({ name, act, so: rolesOf[name], clip: rig.current, ok: !!ok, missing: [...rig.missing] });
  rig.update(+(q.get('t') || 0.25));
});
window.__info = info; console.log(JSON.stringify(info));
const s3 = new THREE.Scene(); s3.background = new THREE.Color(0x7fbf4a); s3.add(w.root);
const c = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas: c, antialias: true }); r.outputColorSpace = THREE.SRGBColorSpace;
const W = c.clientWidth, H = c.clientHeight; r.setSize(W, H, false);
const [cx, cy, cz, d, el, az] = (q.get('cam') || '0,0.9,0,5,10,25').split(',').map(Number);
const cam = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
const e = THREE.MathUtils.degToRad(el), a = THREE.MathUtils.degToRad(az);
cam.position.set(cx + d * Math.cos(e) * Math.sin(a), cy + d * Math.sin(e), cz + d * Math.cos(e) * Math.cos(a));
cam.lookAt(cx, cy, cz);
setTimeout(() => { r.render(s3, cam); window.__done = true; }, 1500);
r.render(s3, cam);
</script></body></html>
