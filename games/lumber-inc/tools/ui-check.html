<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Lumber Inc ui-check</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:LumberUI;src:url(../art/ui/font.ttf)}
html,body{margin:0;background:#7ab530;height:100%;overflow:hidden}
#frame{position:relative;width:750px;height:1334px;transform-origin:0 0;background:#7ab530 linear-gradient(#8fd24a,#6fa82a)}
#frame div,#frame span{box-sizing:border-box}
.n{position:absolute;pointer-events:none}
.n.t{font-family:LumberUI,sans-serif;white-space:pre-wrap;line-height:1.1;display:flex;overflow:visible}
</style></head><body>
<div id="frame"></div>
<script>
// Lays out art/ui/panels/<panel>.json in a 750x1334 portrait frame: RectTransform anchors resolved against the
// CanvasScaler reference, HorizontalLayoutGroup / VerticalLayoutGroup applied by hand, real sprites (9-sliced via
// border-image), legacy Text with Poppins-Bold and the English string behind Qarth.AutoTranslation.
const Q = new URLSearchParams(location.search);
const PANEL = Q.get('panel') || 'gamingpanel';
const REF = [750, 1334];
// runtime state the prefab does not carry (the game code switches these on/off and fills the numbers)
const HIDE = new Set((Q.get('hide') || 'playerLv,residentCoin,tickets,PackData,txtMax,SpecialOrderRoot,BtnEaster,BtnCoin,BtnPhone,MainTaskRoot,BtnBuildTips,buffRoot,guideTips').split(','));
const SHOW = new Set((Q.get('show') || '').split(','));
const TEXT = {txtCoins: '12', coin: null};
const frame = document.getElementById('frame');
let SPR = {}, LANG = {};
const col = c => `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${c[3]})`;
const num = (n) => n;

function box(n, p) {
  // -> {x,y,w,h} top-left origin inside parent box p
  const r = n.rect, amin = r.anchorMin, amax = r.anchorMax, ap = r.anchoredPosition, sd = r.sizeDelta, pv = r.pivot;
  const w = (amax[0] - amin[0]) * p.w + sd[0], h = (amax[1] - amin[1]) * p.h + sd[1];
  const px = p.w * (amin[0] + (amax[0] - amin[0]) * pv[0]) + ap[0];
  const py = p.h * (amin[1] + (amax[1] - amin[1]) * pv[1]) + ap[1];   // from bottom
  return {x: px - pv[0] * w, y: p.h - (py - pv[1] * h) - h, w, h};
}
function layoutBoxes(par, kids, pb) {
  const L = par.layout, pad = L.padding, [cw, ch] = L.controlChildSize, [fw, fh] = L.forceExpand;
  const horiz = L.type === 'horizontal';
  const innerW = pb.w - pad[0] - pad[2], innerH = pb.h - pad[1] - pad[3];
  const sizes = kids.map(k => {
    const sd = k.rect.sizeDelta, le = k.layoutElement || {};
    let w = sd[0], h = sd[1];
    if (cw) w = le.m_PreferredWidth || le.m_MinWidth || w;
    if (ch) h = le.m_PreferredHeight || le.m_MinHeight || h;
    return [w, h];
  });
  const sp = L.spacing;
  const total = sizes.reduce((a, s) => a + s[horiz ? 0 : 1], 0) + sp * Math.max(0, kids.length - 1);
  if (horiz && fh && ch) sizes.forEach(s => s[1] = innerH);
  if (!horiz && fw && cw) sizes.forEach(s => s[0] = innerW);
  const al = L.childAlignment;
  const ax = al.includes('Left') ? 0 : al.includes('Right') ? 1 : 0.5, ay = al.startsWith('Upper') ? 0 : al.startsWith('Lower') ? 1 : 0.5;
  const out = [];
  let cur = horiz ? pad[0] + (innerW - total) * ax : pad[3] + (innerH - total) * ay;
  kids.forEach((k, i) => {
    const [w, h] = sizes[i];
    if (horiz) { out.push({x: cur, y: pad[3] + (innerH - h) * ay, w, h}); cur += w + sp; }
    else { out.push({x: pad[0] + (innerW - w) * ax, y: cur, w, h}); cur += h + sp; }
  });
  return out;
}
function spriteStyle(el, im, b) {
  const s = SPR[im.sprite];
  if (!s) return;
  const url = `../art/ui/sprites/${encodeURIComponent(im.sprite)}.webp`;
  const tint = im.color;
  const white = tint[0] === 1 && tint[1] === 1 && tint[2] === 1;
  el.style.opacity = tint[3];
  if (!white) { // tint a texture: mask the sprite and fill with the colour, multiply semantics approximated
    el.style.backgroundColor = col([tint[0], tint[1], tint[2], 1]);
    el.style.backgroundBlendMode = 'multiply';
  }
  const bl = s.border;
  if (im.type === 'sliced' && (bl[0] || bl[1] || bl[2] || bl[3])) {
    const [l, bo, r, t] = bl;
    el.style.border = `0 solid transparent`;
    el.style.borderImage = `url(${url}) ${t} ${r} ${bo} ${l} fill / ${t}px ${r}px ${bo}px ${l}px stretch`;
    el.style.borderWidth = `${t}px ${r}px ${bo}px ${l}px`;
    el.style.backgroundImage = 'none';
    el.style.backgroundColor = 'transparent';
  } else {
    el.style.backgroundImage = `url(${url})`;
    el.style.backgroundSize = '100% 100%';
    if (!white) el.style.backgroundImage = `url(${url})`;
  }
}
function fitText(el, n) {
  const t = n.text;
  if (!t.bestFit) return;
  let fs = t.autoMax;
  el.style.fontSize = fs + 'px';
  while (fs > t.autoMin && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1)) {
    fs--; el.style.fontSize = fs + 'px';
  }
}
const toFit = [];
function build(nodes, i, parentEl, pb, bx) {
  const n = nodes[i];
  const kids = nodes.map((k, j) => [k, j]).filter(([k]) => k.parent === i);
  const el = document.createElement('div');
  el.className = 'n';
  el.dataset.name = n.name;
  const b = bx || (n.rect ? box(n, pb) : {x: 0, y: 0, w: pb.w, h: pb.h});
  Object.assign(el.style, {left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px'});
  const pv = n.rect ? n.rect.pivot : [.5, .5];
  el.style.transformOrigin = `${pv[0] * 100}% ${(1 - pv[1]) * 100}%`;
  const sc = n.rect ? n.rect.scale : [1, 1, 1];
  const rot = n.rect ? n.rect.rotZ : 0;
  if (sc[0] !== 1 || sc[1] !== 1 || rot) el.style.transform = `rotate(${-rot}deg) scale(${sc[0]},${sc[1]})`;
  if (n.canvasGroup) el.style.opacity = n.canvasGroup.alpha;
  const im = n.image;
  if (im && im.sprite && im.enabled !== false) {
    if (n.button && !(im.color[0] !== 1 || im.color[1] !== 1 || im.color[2] !== 1)) { /* normal tint is white-ish */ }
    spriteStyle(el, im, b);
    if (im.type === 'filled' && im.fillMethod === 'horizontal') el.style.clipPath = `inset(0 ${(1 - im.fillAmount) * 100}% 0 0)`;
  } else if (im && !im.sprite && im.color[3] > 0 && im.enabled !== false && !im.rawTexture) {
    el.style.backgroundColor = col(im.color);
  }
  const t = n.text;
  if (t) {
    el.classList.add('t');
    let s = n.loc && LANG[n.loc] != null ? LANG[n.loc] : t.text;
    if (TEXT[n.name] != null) s = TEXT[n.name];
    el.textContent = s;
    Object.assign(el.style, {
      fontSize: t.fontSize + 'px', color: col(t.color), fontWeight: t.fontStyle & 1 ? 'bold' : 'normal',
      justifyContent: {left: 'flex-start', center: 'center', right: 'flex-end'}[t.alignment[0]],
      alignItems: {top: 'flex-start', middle: 'center', bottom: 'flex-end'}[t.alignment[1]],
      textAlign: t.alignment[0], lineHeight: t.lineSpacing * 1.2
    });
    if (t.wrap === 'overflow') el.style.whiteSpace = 'pre';
    const ef = (n.effects || []).find(e => e.type === 'outline');
    if (ef) {
      const d = Math.max(1, Math.abs(ef.distance[0])), c = col(ef.effectColor || ef.color);
      el.style.textShadow = [[d,0],[-d,0],[0,d],[0,-d],[d,d],[-d,-d],[d,-d],[-d,d]].map(([x, y]) => `${x}px ${y}px 0 ${c}`).join(',');
    }
    const sh = (n.effects || []).find(e => e.type === 'shadow');
    if (sh && !ef) el.style.textShadow = `${sh.distance[0]}px ${-sh.distance[1]}px 0 ${col(sh.color)}`;
    toFit.push([el, n]);
  }
  parentEl.appendChild(el);
  // children
  const live = kids.filter(([k]) => {
    if (Q.get('all') !== '1' && (HIDE.has(k.name) || k.name.startsWith('Pre_UIRedpoint'))) return false;
    return k.active || SHOW.has(k.name);
  });
  const own = {x: 0, y: 0, w: b.w, h: b.h};
  const sizeOfSlider = n.slider;
  if (n.layout && n.layout.type !== 'grid') {
    const boxes = layoutBoxes(n, live.map(([k]) => k), own);
    live.forEach(([k, j], q) => build(nodes, j, el, own, boxes[q]));
  } else {
    live.forEach(([k, j]) => {
      let bb = null;
      // Slider: the fill rect follows the value (RectTransform anchorMax.x = value)
      if (sizeOfSlider && sizeOfSlider.fill && sizeOfSlider.fillId === k.id) {
        const kk = JSON.parse(JSON.stringify(k));
        kk.rect.anchorMin[0] = 0; kk.rect.anchorMax[0] = Math.max(0.02, sizeOfSlider.value);
        build(nodes.map(x => x === k ? kk : x), j, el, own, null);
      } else build(nodes, j, el, own, bb);
    });
  }
  return el;
}
(async () => {
  const [spr, lang, pj] = await Promise.all(['sprites.json', 'lang-en.json', 'panels/' + PANEL + '.json'].map(f => fetch('../art/ui/' + f).then(r => r.json())));
  SPR = spr; LANG = lang;
  await document.fonts.load('20px LumberUI');
  const nodes = pj.prefabs[pj.main];
  const sc = pj.scaler || {};
  const ref = sc.referenceResolution || REF;
  document.title = `ui-check ${PANEL} (scaler ${JSON.stringify(sc.referenceResolution)} match ${sc.match})`;
  // ScaleWithScreenSize, match 0 = width: canvas is ref.x wide, height follows the 750x1334 frame
  const k = (sc.match == null ? 0 : sc.match);
  const scale = Math.pow(750 / ref[0], 1 - k) * Math.pow(1334 / ref[1], k);
  const cw = 750 / scale, chh = 1334 / scale;
  const root = document.createElement('div');
  root.style.cssText = `position:absolute;left:0;top:0;width:${cw}px;height:${chh}px;transform:scale(${scale});transform-origin:0 0`;
  frame.appendChild(root);
  build(nodes, 0, root, {x: 0, y: 0, w: cw, h: chh});
  const fit = () => toFit.forEach(([el, n]) => fitText(el, n));
  fit();
  frame.dataset.canvas = `${cw}x${chh} scale ${scale}`;
  const fs = Math.min(innerWidth / 750, innerHeight / 1334);
  frame.style.transform = `scale(${fs})`;
  // wait for every sprite image
  const urls = [...frame.querySelectorAll('.n')].map(e => (e.style.backgroundImage + e.style.borderImage).match(/url\("?([^")]+)"?\)/)).filter(Boolean).map(m => m[1]);
  await Promise.all([...new Set(urls)].map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = new URL(u, location.href); })));
  window.__done = true;
})();
</script></body></html>
