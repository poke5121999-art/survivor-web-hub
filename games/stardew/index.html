<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Quần Đảo Sao Rơi</title>
<!-- WHY a data-URI favicon: without one the browser requests /favicon.ico on
     every load and logs a 404, which buries real errors in the console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E%F0%9F%8F%9D%3C/text%3E%3C/svg%3E">
<!-- Collect every uncaught error from the very first script onward. A game
     that draws to a canvas swallows its own failures silently - the screen
     just stops updating - so having the list somewhere readable is the
     difference between "it froze" and a stack trace. Read window.__errs. -->
<script>
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push((e.message || 'error') + ' @ ' +
    (e.filename || '?').split('/').pop() + ':' + (e.lineno || 0));
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('unhandled promise: ' + (e.reason && e.reason.message || e.reason));
});
</script>
<style>
  :root{
    --ink:#1b2027; --paper:#f4ecd8; --line:#c9924a;
    --accent:#e8a13c; --good:#5fa855; --bad:#c0453b; --warn:#e8c33c;
    --panel:#2c2218; --panel2:#3b2d20;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b1016;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f4ecd8;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;background:#0b1016;overflow:hidden;
    box-shadow:0 0 0 2px #2a323d,0 18px 60px rgba(0,0,0,.6)}
  /* The art is pixel art and it is drawn at whole-pixel scale; smoothing it is
     exactly what makes pixel art look cheap. A very light grade sits the
     sprite sheets in the same air as the code-drawn overlays without arguing
     with colours an artist already chose. */
  canvas#view{display:block;width:100%;height:100%;
    filter:saturate(1.02) contrast(1.03);
    image-rendering:pixelated}
  #layer{position:absolute;inset:0;pointer-events:none}
  #layer button,#layer input,#layer canvas,.isl-panel,.isl-stick,.isl-mini,
  .isl-quick,.isl-slot,.isl-chip{pointer-events:auto}

  /* ------------------------------------------------------------------ HUD */
  .isl-hud{position:absolute;top:0;left:0;right:0;padding:8px 10px 0;
    background:linear-gradient(180deg,rgba(10,14,20,.8),rgba(10,14,20,0))}
  .isl-topline{display:flex;align-items:center;gap:8px;font-size:13px}
  .isl-date{display:flex;flex-direction:column;line-height:1.15}
  .isl-date b{font-size:13px}
  .isl-date span{font-size:11px;opacity:.82}
  .isl-wx{font-size:19px;margin-left:auto}
  .isl-gold{background:rgba(0,0,0,.5);border:1px solid #6b5a3c;border-radius:9px;
    padding:3px 8px;font-weight:700;color:#ffd870;font-size:12px}
  .isl-rankwrap{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10px}
  .isl-rankwrap b{color:#ffd870;font-size:11px;white-space:nowrap}
  .isl-rankbar{flex:1;height:5px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;
    border:1px solid #4a3a2a}
  .isl-rankbar i{display:block;height:100%;background:linear-gradient(90deg,#e8a13c,#ffd870)}
  .isl-islandname{font-size:10px;opacity:.7;margin-top:3px;letter-spacing:.04em}

  .isl-bars{position:absolute;top:76px;right:10px;display:flex;gap:6px}
  .isl-bar{position:relative;width:20px;height:104px;background:rgba(0,0,0,.55);
    border:2px solid #6b5a3c;border-radius:10px;overflow:hidden}
  .isl-bar i{position:absolute;left:0;bottom:0;width:100%;display:block}
  .isl-energy i{background:linear-gradient(180deg,#8fd44a,#4e9c2e)}
  .isl-health i{background:linear-gradient(180deg,#e8635b,#a8302a)}
  .isl-bar span{position:absolute;bottom:-1px;left:0;right:0;text-align:center;
    font-size:9px;text-shadow:0 1px 2px #000}
  .isl-mini{position:absolute;top:76px;left:10px;border-radius:8px;
    border:2px solid #6b5a3c;background:#0a0e14;width:104px;height:84px;
    image-rendering:pixelated}

  .isl-toasts{position:absolute;left:0;right:0;bottom:154px;display:flex;
    flex-direction:column;align-items:center;gap:4px;pointer-events:none}
  .isl-toast{background:rgba(15,20,28,.9);border:1px solid #6b5a3c;
    border-radius:14px;padding:5px 12px;font-size:12px;max-width:88%;
    text-align:center;line-height:1.35}

  /* -------------------------------------------------------------- controls
     The stick owns the bottom band alone. The hand button sits 150px up on
     the right, which on a 430x860 screen is well inside the arc a right thumb
     sweeps without the hand moving. Putting it IN the band was tried first and
     the two fought for the same pixels. */
  .isl-stick{position:absolute;left:50%;transform:translateX(-50%);
    bottom:22px;width:118px;height:118px;
    border-radius:50%;background:rgba(20,26,34,.45);border:2px solid rgba(255,255,255,.16)}
  .isl-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:rgba(244,236,216,.55);border:2px solid rgba(255,255,255,.5)}
  .isl-hand{position:absolute;right:18px;bottom:150px;width:84px;height:84px;
    border:none;border-radius:50%;display:none;align-items:center;justify-content:center;
    flex-direction:column;line-height:1;gap:2px;font-size:32px;cursor:pointer;
    background:rgba(244,236,216,.95);color:#241a10;box-shadow:0 5px 0 #8a7c5e}
  .isl-hand small{font-size:10px;font-weight:700;opacity:.78;letter-spacing:.2px}
  .isl-hand.isl-on{display:flex}
  .isl-hand:active{transform:translateY(3px);box-shadow:0 2px 0 #8a7c5e}
  .isl-quick{position:absolute;left:12px;bottom:150px;display:flex;flex-direction:column;gap:8px}
  .isl-qbtn{width:48px;height:48px;border-radius:12px;border:2px solid #6b5a3c;
    background:rgba(20,26,34,.82);color:#f4ecd8;font-size:20px;cursor:pointer;padding:0}
  .isl-qbtn:active{transform:translateY(2px)}

  /* ---------------------------------------------------------------- panels */
  .isl-panel{position:absolute;left:8px;right:8px;top:8px;bottom:8px;z-index:100;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:3px solid #6b5a3c;border-radius:16px;display:flex;flex-direction:column;
    box-shadow:0 12px 40px rgba(0,0,0,.65);overflow:hidden}
  .isl-phead{display:flex;align-items:center;gap:8px;padding:10px 12px;
    border-bottom:2px solid #6b5a3c;background:rgba(0,0,0,.25)}
  .isl-phead h3{margin:0;font-size:15px;flex:1;color:#ffd870}
  .isl-psub{font-size:11px;opacity:.75}
  .isl-x{border:none;background:rgba(255,255,255,.12);color:#f4ecd8;
    width:32px;height:32px;border-radius:9px;font-size:15px;cursor:pointer}
  .isl-pbody{padding:10px 12px 18px;overflow-y:auto;flex:1;
    -webkit-overflow-scrolling:touch}

  .isl-sub{font-size:11px;opacity:.72;margin:11px 0 5px;letter-spacing:.05em}
  .isl-hint{font-size:11px;opacity:.62;margin-top:10px;line-height:1.55;white-space:pre-line}
  .isl-big{font-size:30px;font-weight:800;color:#ffd870;text-align:center;margin:8px 0}
  .isl-big2{font-size:16px;font-weight:700}
  .isl-cost{font-size:10.5px;opacity:.74;line-height:1.45}
  .isl-good{font-size:11px;color:#8fd44a;font-weight:700}
  .isl-say{background:rgba(0,0,0,.24);border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0;padding:9px 11px;font-size:13px;line-height:1.55;
    white-space:pre-line;margin:6px 0}
  .isl-tip{margin-top:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;
    background:rgba(232,161,60,.14);border-left:3px solid #e8a13c;border-radius:0 8px 8px 0}

  .isl-menu{display:flex;flex-direction:column;gap:6px}
  .isl-mbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;
    background:rgba(255,255,255,.07);border:2px solid #6b5a3c;border-radius:11px;
    color:#f4ecd8;padding:9px 12px;font-size:13px;text-align:left;cursor:pointer;width:100%}
  .isl-mbtn:active{background:rgba(255,255,255,.15)}
  .isl-inline{flex-direction:row;align-items:center;gap:9px}
  .isl-inline canvas{image-rendering:pixelated;flex:0 0 auto}
  .isl-grow{flex:1;min-width:0}
  .isl-off{opacity:.42}
  .isl-bad{border-color:#7a3a34;color:#ffb3ab}
  .isl-primary{background:var(--accent);color:#241a10;font-weight:700;
    align-items:center;box-shadow:0 3px 0 #8a5c1e}
  .isl-mrow{display:flex;align-items:baseline;gap:8px;width:100%}
  .isl-mrow b{flex:1;min-width:0}

  .isl-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .isl-slot{position:relative;aspect-ratio:1;background:rgba(0,0,0,.32);
    border:2px solid #5a4a34;border-radius:8px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;padding:0}
  .isl-slot canvas{width:80%;height:80%;image-rendering:pixelated}
  .isl-empty{opacity:.35}
  .isl-qty{position:absolute;right:2px;bottom:1px;font-size:10px;font-weight:700;
    text-shadow:0 1px 2px #000;color:#fff}
  .isl-q1,.isl-q2,.isl-q3{position:absolute;left:2px;top:2px;width:7px;height:7px;border-radius:50%}
  .isl-q1{background:#c9d4dd}.isl-q2{background:#ffd257}.isl-q3{background:#a56cff}

  .isl-inforow{display:flex;gap:11px;align-items:flex-start;margin:4px 0 8px}
  .isl-inforow canvas{image-rendering:pixelated;flex:0 0 auto;
    background:rgba(0,0,0,.22);border-radius:9px}
  .isl-chips{display:flex;flex-wrap:wrap;gap:5px}
  .isl-chip{display:inline-block;background:rgba(255,255,255,.09);
    border:1px solid #6b5a3c;border-radius:8px;padding:4px 9px;font-size:11px;
    color:#f4ecd8;cursor:pointer}
  .isl-tabs{display:flex;gap:6px;margin-bottom:8px}
  .isl-tab{flex:1;border:2px solid #6b5a3c;background:rgba(255,255,255,.06);
    color:#f4ecd8;border-radius:10px;padding:8px;font-size:12px;font-weight:700;cursor:pointer}
  .isl-tab.isl-on{background:var(--accent);color:#241a10;border-color:var(--accent)}

  .isl-hearts{font-size:14px;color:#ff8fb0;letter-spacing:1px}
  .isl-t-love{color:#ff9ec4}.isl-t-like{color:#a8d97a}
  .isl-t-hate{color:#e08a7a}.isl-t-dislike{color:#c9b48c}

  .isl-skillrow{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}
  .isl-skillrow b{flex:0 0 92px}
  .isl-skillrow span{flex:0 0 52px;font-size:11px;opacity:.8}
  .isl-bar2{flex:1;height:6px;background:rgba(0,0,0,.45);border-radius:4px;
    overflow:hidden;border:1px solid #4a3a2a;min-width:40px}
  .isl-bar2 i{display:block;height:100%;background:linear-gradient(90deg,#e8a13c,#ffd870)}

  .isl-mapwrap{display:flex;justify-content:center;margin-bottom:10px}
  .isl-mapcanvas{border:2px solid #6b5a3c;border-radius:10px;background:#0d2b40;
    image-rendering:pixelated;width:100%;max-width:280px;height:auto}

  .isl-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .isl-calday{aspect-ratio:1;background:rgba(0,0,0,.28);border:1px solid #4a3a2a;
    border-radius:7px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;font-size:10px;gap:1px}
  .isl-calday canvas{image-rendering:pixelated}
  .isl-today{border-color:var(--accent);background:rgba(232,161,60,.2)}

  .isl-fishtrack{position:relative;height:26px;background:rgba(0,0,0,.4);
    border:2px solid #6b5a3c;border-radius:13px;margin:12px 0;overflow:hidden}
  .isl-fishzone{position:absolute;top:0;bottom:0;background:rgba(232,161,60,.55)}
  .isl-fishmark{position:absolute;top:0;bottom:0;width:4px;background:#fff;border-radius:2px}

  .isl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
  .isl-stat{background:rgba(0,0,0,.28);border:1px solid #4a3a2a;border-radius:9px;
    padding:8px 6px;text-align:center}
  .isl-stat b{display:block;font-size:19px;color:#ffd870}
  .isl-stat span{font-size:9.5px;opacity:.75;line-height:1.25;display:block}
  .isl-stat.isl-good b{color:#8fd44a}
  .isl-stat.isl-warn b{color:#e8c33c}
  .isl-stat.isl-bad b{color:#e08a7a}

  /* ------------------------------------------------------------- pokemon */
  .isl-hpbar{height:6px;background:rgba(0,0,0,.45);border-radius:4px;overflow:hidden;
    border:1px solid #4a3a2a;margin:3px 0}
  .isl-hpbar i{display:block;height:100%}
  .isl-types{display:flex;gap:4px;margin-top:3px}
  .isl-type{font-size:9px;font-weight:700;color:#1b2027;border-radius:5px;
    padding:1px 6px;letter-spacing:.02em}
  .isl-pokebig{display:block;margin:0 auto;image-rendering:pixelated;
    background:rgba(0,0,0,.2);border-radius:12px}
  .isl-stattbl{display:flex;flex-direction:column;gap:3px;margin:4px 0}
  .isl-statrow{display:flex;align-items:center;gap:8px;font-size:11.5px}
  .isl-statrow>span,.isl-statrow>b{flex:0 0 46px;text-align:right}
  .isl-statname{flex:0 0 40px!important;text-align:left!important;opacity:.8}
  .isl-stathead{font-size:9.5px;opacity:.6}
  .isl-up{color:#8fd44a}.isl-down{color:#e08a7a}
  .isl-perfect{color:#ffd870;font-weight:700}

  .isl-battle{padding-top:6px}
  .isl-scene{display:block;width:100%;height:auto;border:2px solid #6b5a3c;
    border-radius:11px;image-rendering:pixelated;background:#8fd0e8}
  .isl-log{height:64px;overflow-y:auto;margin:8px 0;padding:6px 9px;font-size:12px;
    line-height:1.5;background:rgba(0,0,0,.3);border:1px solid #4a3a2a;border-radius:9px}
  .isl-logline{opacity:.9}
  .isl-actions2{display:flex;flex-direction:column;gap:6px}
  .isl-arow{display:flex;gap:5px}
  .isl-abtn{flex:1;border:2px solid #6b5a3c;background:rgba(255,255,255,.08);
    color:#f4ecd8;border-radius:10px;padding:11px 2px;font-size:11.5px;
    font-weight:700;cursor:pointer}
  .isl-abtn:active{background:rgba(255,255,255,.18)}

  .isl-boxgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .isl-boxcell{background:rgba(0,0,0,.3);border:2px solid #5a4a34;border-radius:10px;
    padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;
    color:#f4ecd8;cursor:pointer}
  .isl-boxcell canvas{image-rendering:pixelated}
  .isl-boxcell span{font-size:9.5px;text-align:center;line-height:1.15}
  .isl-boxcell i{font-size:9px;opacity:.7;font-style:normal}
  .isl-dexgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .isl-dexcell{background:rgba(0,0,0,.3);border:1px solid #4a3a2a;border-radius:8px;
    padding:4px 2px;display:flex;flex-direction:column;align-items:center;
    color:#f4ecd8;cursor:pointer}
  .isl-dexcell canvas{image-rendering:pixelated}
  .isl-dexcell i{font-size:8.5px;opacity:.6;font-style:normal}
  .isl-dexq{font-size:20px;opacity:.3;height:36px;line-height:36px}

  /* the link back to the hub, matching the chrome of the other games there */
  /* Bottom-left, not top-left: the top-left corner is the date and the season,
     which is the one piece of HUD a farming game needs readable at a glance,
     and a fixed link was sitting straight on top of it. */
  /* z-index 30 puts it UNDER every panel and tutorial card and over nothing
     but the world. At 130 it floated above the panel layer as a ~62x22 hit
     area in the bottom-left corner of every open shop and bag - and it leaves
     the game, so one mis-tap on the last row of a scrolled list threw away
     everything since the last sleep. */
  .isl-back{position:fixed;left:10px;bottom:8px;z-index:30;
    font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.08em;color:#c9b48c;text-decoration:none;
    border:1px solid #4a3a2a;border-radius:3px;padding:5px 9px;
    background:rgba(18,13,9,.72);white-space:nowrap}
  .isl-back:hover{color:#f0e3c2;border-color:#6b5a3c}

  .isl-boot{position:absolute;inset:0;z-index:200;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:14px;padding:22px;
    background:linear-gradient(180deg,#0f1a24,#132230 60%,#0f1a24);text-align:center}
  .isl-boot h1{margin:0;font-size:23px;color:#ffd870;letter-spacing:.02em}
  .isl-boot p{margin:0;font-size:12.5px;opacity:.78;line-height:1.6;max-width:300px}
  .isl-boot button{border:none;border-radius:12px;background:var(--accent);
    color:#241a10;font-weight:700;font-size:14px;padding:12px 26px;cursor:pointer;
    box-shadow:0 4px 0 #8a5c1e}
  .isl-boot button:active{transform:translateY(3px);box-shadow:none}
  .isl-bootsmall{border:2px solid #6b5a3c!important;background:rgba(255,255,255,.08)!important;
    color:#f4ecd8!important;box-shadow:none!important;font-size:12px!important;
    padding:9px 18px!important}
</style>
</head>
<body>
<a class="isl-back" href="../../index.html">&larr; HUB</a>
<div id="frame"><div id="stage">
  <canvas id="view"></canvas>
  <div id="layer">
    <div class="isl-hud">
      <div class="isl-topline">
        <div class="isl-date">
          <b id="hud-date">Xuân 1 · Năm 1</b>
          <span id="hud-day">T2  6:00 AM</span>
        </div>
        <div class="isl-wx" id="hud-wx">☀</div>
        <div class="isl-gold" id="hud-gold">500v</div>
      </div>
      <div class="isl-rankwrap">
        <b id="hud-rank">Cấp 1</b>
        <div class="isl-rankbar"><i id="hud-rankbar" style="width:0%"></i></div>
      </div>
      <div class="isl-islandname" id="hud-island">Đảo Nhà</div>
    </div>

    <!-- width/height are the BACKING STORE and must be set here: a canvas with
         only CSS size defaults to 300x150 and draws at the wrong scale. -->
    <canvas class="isl-mini" id="hud-mini" width="104" height="84"></canvas>

    <div class="isl-bars">
      <div class="isl-bar isl-energy"><i id="hud-energy" style="height:100%"></i><span id="hud-energyn">270</span></div>
      <div class="isl-bar isl-health"><i id="hud-health" style="height:100%"></i><span id="hud-healthn">100</span></div>
    </div>

    <div class="isl-toasts" id="hud-toasts"></div>

    <div class="isl-quick">
      <button class="isl-qbtn" id="btn-bag" title="Túi đồ">🎒</button>
      <button class="isl-qbtn" id="btn-poke" title="Pokémon">🔴</button>
      <button class="isl-qbtn" id="btn-map" title="Bản đồ">🗺</button>
      <button class="isl-qbtn" id="btn-menu" title="Menu">☰</button>
    </div>

    <button class="isl-hand" id="hud-hand">
      <span id="hud-handicon">✋</span>
      <small id="hud-handtext">Làm</small>
    </button>

    <div class="isl-stick" id="stick"><div class="isl-knob" id="knob"></div></div>
  </div>

  <div class="isl-boot" id="boot">
    <h1>Quần Đảo Sao Rơi</h1>
    <p id="boot-text">Đang tải…</p>
    <div id="boot-actions"></div>
  </div>
</div></div>

<script>
/* Boot.
 *
 * Order matters and is not obvious, so it is spelled out:
 *   1. size the stage to the device before anything measures it
 *   2. load the island atlas - nothing can draw until it is up
 *   3. build the game, then RESTORE, then start
 *
 * Restoring before start() is what lets `start(fresh)` know whether to hand
 * out the seed packet and fire the opening tutorial. Doing it the other way
 * round gave a returning player fifteen parsnip seeds every single load. */
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var view = document.getElementById('view');
  var boot = document.getElementById('boot');
  var bootText = document.getElementById('boot-text');
  var bootActions = document.getElementById('boot-actions');

  function fit() {
    /* A phone-shaped viewport on a desktop, so the layout that was designed
     * for a thumb is the layout being tested. 9:19.5 is a modern handset. */
    var W = window.innerWidth, H = window.innerHeight;
    var w = W, h = H;
    if (W / H > 9 / 19.5) { h = H; w = Math.round(h * 9 / 19.5); }
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    view.width = Math.round(w * dpr);
    view.height = Math.round(h * dpr);
    view.style.width = w + 'px';
    view.style.height = h + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 120); });

  window.ISL_ATLAS.load('art/pki/', function (err) {
    if (err) {
      bootText.textContent = 'Không tải được bộ ảnh (art/pki/). ' +
        'Trang này phải chạy qua http, không mở trực tiếp bằng file://.';
      return;
    }
    var game = new window.SDV_GAME.Game(view);
    /* farmqol reaches back for the game when it rolls the daily orders inside
     * sim.endDay, which only has the sim. One back-reference beats threading
     * the game through the whole day-end path. */
    game.sim._game = game;
    window.GAME = game;
    window.ISL_UI.build(game);

    /* `?new=1` boots straight into a fresh save with no title screen. It is
     * there for screenshots and for automated checks, which otherwise cannot
     * get past a button that has to be tapped - and it is harmless in play,
     * because reaching it requires typing it. */
    if (/[?&]new=1/.test(location.search)) { begin(true); return; }

    var had = window.SDV_SIM.Sim.hasSave();
    if (had) {
      bootText.textContent = 'Có bản lưu. Chơi tiếp hay bắt đầu lại?';
      bootActions.innerHTML = '';
      var go = document.createElement('button');
      go.textContent = 'Chơi tiếp';
      go.onclick = function () { begin(false); };
      var again = document.createElement('button');
      again.textContent = 'Chơi lại từ đầu';
      again.className = 'isl-bootsmall';
      again.style.marginLeft = '8px';
      again.onclick = function () {
        if (confirm('Xoá bản lưu và bắt đầu lại?')) {
          window.SDV_SIM.Sim.clearSave();
          begin(true);
        }
      };
      bootActions.appendChild(go);
      bootActions.appendChild(again);
    } else {
      bootText.textContent =
        'Ông ngoại để lại cho bạn một hòn đảo. Biển quanh đây còn hai mươi bốn hòn nữa.';
      bootActions.innerHTML = '';
      var start = document.createElement('button');
      start.textContent = 'Bắt đầu';
      start.onclick = function () { begin(true); };
      bootActions.appendChild(start);
    }

    function begin(fresh) {
      boot.style.display = 'none';
      if (!fresh) game.sim.load(game.world);
      game.start(fresh);
      /* Re-apply after the load: ownership decides collision and bridges, and
       * a restored `owned` map has to be pushed into the world before the
       * player is placed or they can end up standing on locked land. */
      window.SDV_WORLD.applyOwnership(game.area(), game.sim.owned);
      if (window.ISL_NPC) window.ISL_NPC.build(game);
      if (!fresh && game.sim.playerX != null) {
        var spot = game.area().nearestFree(Math.floor(game.sim.playerX),
                                           Math.floor(game.sim.playerY), 30);
        game.player.x = spot.x + 0.5;
        game.player.y = spot.y + 0.5;
        game.recenter(true);
      }
      /* Save on the way out. A phone backgrounding the tab is the most common
       * way a session ends, and `visibilitychange` is the only event that
       * reliably fires for it - `beforeunload` does not on iOS. */
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') game.sim.save(game.world);
      });
      window.addEventListener('pagehide', function () { game.sim.save(game.world); });
    }
  });
})();
</script>
</body>
</html>
