<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!--
  XUÔI DÒNG — lái chiếc nhà thuyền đỏ xuôi từ khe núi ra biển, ngày nối đêm.
  Game nằm ngang. Màn dọc vẫn chơi được: cảnh thu vào một dải giữa màn hình, kéo ngón
  tay ở bất cứ đâu để lái, và có một dòng nhắc xoay máy để nhìn xa hơn.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1a26">
<title>Xuôi Dòng</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='14' width='26' height='9' rx='3' fill='%23e0572a'/><rect x='14' y='6' width='11' height='9' fill='%238a5a33'/><rect x='0' y='24' width='32' height='5' fill='%232aa3a8'/></svg>">
<style>
html, body { touch-action: none; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
/* Chữ nhìn (tên game) dùng họ chân có phủ đủ tiếng Việt ở ĐẦU chuỗi — xem luật chọn font
   trong games/chuyen-tau/index.html: Rockwell/Georgia thiếu Ồ Ố Ừ nên dấu bị ghép rời. */
:root {
  --disp: Cambria, "Palatino Linotype", "Noto Serif", "Times New Roman", serif;
  --ink: #fff6e6; --dim: #c9d6dc; --panel: rgba(9, 22, 34, 0.78); --edge: rgba(255, 214, 150, 0.22);
  --boat: #e8622d; --gold: #ffd36a;
}
body {
  margin: 0; background: #07121c; color: var(--ink); overflow: hidden; height: 100dvh;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  user-select: none; -webkit-user-select: none;
}
#scene { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; }
button { font: inherit; color: inherit; cursor: pointer; }

.panel {
  background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); backdrop-filter: blur(3px);
}

/* ---------- màn đầu ---------- */
#title {
  position: fixed; right: max(20px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
  width: min(360px, calc(100vw - 40px)); padding: 18px 20px 14px;
  transition: opacity .5s, transform .5s;
}
body:not([data-mode="title"]) #title { opacity: 0; pointer-events: none; transform: translate(20px, -50%); }
h1 {
  font: 700 44px/1 var(--disp); margin: 0 0 4px; color: var(--gold); letter-spacing: .5px;
  text-shadow: 0 2px 0 #7a2c10, 0 4px 14px rgba(0, 0, 0, .5);
}
.sub { margin: 0 0 12px; color: var(--dim); font-size: 13px; }
#boats { display: flex; gap: 6px; margin-bottom: 12px; }
.boat {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px;
  background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .1); border-radius: 10px;
  transition: background .2s, border-color .2s, transform .15s;
}
.boat canvas { image-rendering: pixelated; }
.boat span { font-size: 12px; font-weight: 600; line-height: 1.2; text-align: center; }
.boat small { font-size: 10.5px; color: var(--dim); text-align: center; line-height: 1.2; }
.boat.on { background: rgba(232, 98, 45, .22); border-color: var(--boat); }
.boat:active { transform: scale(.97); }
#start {
  width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--boat); color: #fff;
  font-weight: 700; font-size: 16px; box-shadow: 0 3px 0 #8f3212; animation: pulse 2.4s ease-in-out infinite;
}
#start:active { transform: translateY(2px); box-shadow: 0 1px 0 #8f3212; }
@keyframes pulse { 50% { filter: brightness(1.12); } }
.row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.ghost { padding: 7px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .05); }
#hint { font-size: 11.5px; color: var(--dim); margin: 10px 0 0; }
.credit { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 10.5px; color: #93a6b0; }
#logo { image-rendering: pixelated; flex: none; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; transition: opacity .4s; }
body[data-mode="title"] #hud { opacity: 0; }
.pill {
  position: absolute; top: max(10px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px;
  padding: 5px 12px 5px 8px; border-radius: 999px; background: rgba(9, 22, 34, .62); border: 1px solid var(--edge);
}
#p-time { left: max(10px, env(safe-area-inset-left)); }
#p-score { right: max(10px, env(safe-area-inset-right)); gap: 12px; padding-left: 12px; }
#phase-icon { width: 22px; height: 22px; image-rendering: pixelated; }
#clock { font-weight: 700; font-variant-numeric: tabular-nums; }
#phase { color: var(--dim); font-size: 12.5px; }
#fish, #points, #dist { font-variant-numeric: tabular-nums; font-weight: 700; }
#fish::before { content: ""; display: inline-block; width: 16px; height: 10px; margin-right: 5px; vertical-align: -1px;
  background: var(--gold); clip-path: polygon(0 50%, 25% 0, 70% 0, 85% 30%, 100% 0, 100% 100%, 85% 70%, 70% 100%, 25% 100%); }
#points { color: var(--gold); }
#dist { color: var(--dim); font-weight: 500; }
.hud-btns {
  position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
  display: flex; gap: 8px; transition: opacity .4s;
}
body[data-mode="title"] .hud-btns { opacity: 0; pointer-events: none; }
.hud-btns button {
  width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--edge); background: rgba(9, 22, 34, .66);
  display: grid; place-items: center; padding: 0;
}
.hud-btns button:active { transform: scale(.94); }
#btn-horn { width: 64px; background: rgba(232, 98, 45, .82); border-color: #ffb08a; font-weight: 700; font-size: 13px; }
body:not(.touch) #btn-horn { width: auto; padding: 0 12px; }
#btn-mute.off .on-i, #btn-mute:not(.off) .off-i { display: none; }
#toast {
  position: fixed; left: 50%; top: calc(var(--band, 100vh) * 0.2); transform: translateX(-50%); pointer-events: none; opacity: 0;
  font: 700 26px/1 var(--disp); color: var(--ink); text-shadow: 0 2px 10px rgba(0, 0, 0, .6); white-space: nowrap;
}
#toast.show { animation: toast 3s ease-out forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 8px); } 15%, 70% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* ---------- tạm dừng & sổ cá ---------- */
#pause { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 18px 22px; text-align: center; display: none; }
body[data-mode="pause"] #pause { display: block; }
#pause h2, #journal h2 { font: 700 26px/1.1 var(--disp); margin: 0 0 12px; color: var(--gold); }
#pause .col { display: flex; flex-direction: column; gap: 8px; min-width: 200px; }
#p-resume { background: var(--boat); border-color: #ffb08a; font-weight: 700; }
#journal {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
  width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: auto; padding: 16px 18px;
}
#journal[hidden] { display: none; }
body:has(#journal:not([hidden])) #pause { display: none; }
.j-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
#j-count { color: var(--dim); }
#j-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 10px 0 12px; }
.fish { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 6px; border-radius: 10px; background: rgba(255, 255, 255, .05); }
.fish canvas { image-rendering: pixelated; width: 74px; height: 80px; }
.fish b { font-size: 13px; }
.fish i { font-size: 11px; color: var(--dim); font-style: normal; }
.fish small { font-size: 11px; color: #9fb2bb; line-height: 1.3; }
.fish.rare { box-shadow: inset 0 0 0 1px rgba(255, 211, 106, .5); }
.fish.unknown b { color: #7d8f99; }

/* ---------- màn dọc ---------- */
#rotate { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: none;
  padding: 7px 14px; font-size: 12.5px; color: var(--dim); white-space: nowrap; }
body.portrait:not([data-mode="title"]) #rotate { display: block; }
#drag { position: fixed; left: 0; right: 0; top: calc(var(--band) + 24%); text-align: center; color: #5d7482; font-size: 13px; display: none; pointer-events: none; }
body.portrait.touch[data-mode="play"] #drag { display: block; }
body.shot #title, body.shot #hud, body.shot .hud-btns, body.shot #toast, body.shot #rotate { display: none !important; }
body.portrait #title { left: 50%; right: auto; top: calc(var(--band) + 10px); transform: translateX(-50%); padding: 12px 14px; }
body.portrait:not([data-mode="title"]) #title { transform: translate(-50%, 20px); }
body.portrait h1 { font-size: 34px; }
body.portrait .hud-btns { bottom: 60px; }
@media (max-height: 460px) and (orientation: landscape) {
  #title { padding: 10px 12px 8px; width: 320px; }
  h1 { font-size: 30px; margin-bottom: 6px; }
  .sub, #hint { display: none; }
  #boats { margin-bottom: 8px; }
  .boat small { display: none; }
  #start { padding: 9px; font-size: 15px; }
  .row { margin-top: 6px; }
  .credit { margin-top: 6px; }
  #logo { width: 60px !important; height: auto !important; }
}
</style>
</head>
<body data-mode="title">
<canvas id="scene"></canvas>

<section id="title" class="panel">
  <h1>Xuôi Dòng</h1>
  <p class="sub">Lái chiếc nhà thuyền xuôi từ khe núi ra tới biển. Vớt cá, ngắm trời chuyển từ sáng sang đêm. Không có thua.</p>
  <div id="boats" aria-label="Ai đi cùng thuyền"></div>
  <button id="start">Chạm để bắt đầu</button>
  <div class="row"><button class="ghost" id="btn-journal">Sổ cá</button></div>
  <p id="hint"></p>
  <div class="credit"><canvas id="logo"></canvas><span>Hình và tiếng: Farming Camp Demo (Innerfire Studios / SOEDESCO)</span></div>
</section>

<div id="hud">
  <div class="pill" id="p-time"><canvas id="phase-icon"></canvas><span id="clock">06:00</span><span id="phase"></span></div>
  <div class="pill" id="p-score"><span id="fish">0</span><span id="points">0 điểm</span><span id="dist">0.00 km</span></div>
</div>
<div id="toast"></div>
<div class="hud-btns">
  <button id="btn-horn" aria-label="Hú còi">Còi</button>
  <button id="btn-pause" aria-label="Tạm dừng"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" rx="1" fill="#fff6e6"/><rect x="11" y="2" width="4" height="14" rx="1" fill="#fff6e6"/></svg></button>
  <button id="btn-mute" aria-label="Tắt tiếng"><svg width="20" height="18" viewBox="0 0 20 18"><path d="M2 6h4l5-4v14l-5-4H2z" fill="#fff6e6"/><path class="on-i" d="M14 5c2 2 2 6 0 8M16.5 3c3.2 3 3.2 9 0 12" stroke="#fff6e6" stroke-width="1.6" fill="none" stroke-linecap="round"/><path class="off-i" d="M14 6l5 6M19 6l-5 6" stroke="#ff9d80" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>

<section id="pause" class="panel">
  <h2>Tạm dừng</h2>
  <div class="col">
    <button class="ghost" id="p-resume">Đi tiếp</button>
    <button class="ghost" id="p-journal">Sổ cá</button>
    <button class="ghost" id="p-title">Về màn đầu</button>
  </div>
</section>

<section id="journal" class="panel" hidden>
  <div class="j-head"><h2>Sổ cá</h2><span id="j-count"></span></div>
  <div id="j-grid"></div>
  <button class="ghost" id="j-close">Đóng</button>
</section>

<div id="drag">Kéo lên xuống ở đâu cũng được để lái</div>
<div id="rotate" class="panel">Xoay ngang máy để nhìn xa hơn</div>

</body>
