<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../js/game-gate.js?v=20261103"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lửa Trại</title>
<style>
  :root { --bg: #0c0d14; --ink: #e8e6ef; --dim: #9a98a8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #cv { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; left: 12px; bottom: 10px; right: 12px; color: var(--dim); pointer-events: none; }
  #hud a { color: var(--dim); pointer-events: auto; }
</style>
<script type="importmap">
{ "imports": {
  "./ext/stylized-props/vendor/three.module.min.js": "./vendor/three.module.min.js",
  "./ext/stylized-weapons/vendor/three.module.min.js": "./vendor/three.module.min.js"
} }
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">Lửa trại: 4 nhân vật chibi (kéo để xoay). Đồ vật: kit stylized-props, súng: kit stylized-weapons. Kit nhân vật port từ <a href="https://github.com/loktar00/lanternfall">Lanternfall by loktar00</a>. <span id="miss"></span></div>
<script type="module">
import { runScene } from './lib/chibi/scene-page.js';
import { CAMPFIRE } from './lib/roster/scenes.js';
const S = Object.fromEntries(CAMPFIRE.map((s) => [s.id, s]));
runScene({
  light: 'campfire', exposure: 1.05,
  cam: { pos: [-0.3, 4.2, 7.9], target: [0.3, 0.6, -0.55] }, fov: 27,
  cast: [
    { scale: 1.22, spec: S['cf-rifleman'], at: [-2.45, 0, -1.55], yaw: 0.55, weapon: { id: 'ak-taped', pole: [0.6, -1, -0.3] } },
    { scale: 1.22, spec: S['cf-cook'], at: [-1.05, 0.07, -0.3], yaw: 1.0, t0: 4 },
    { scale: 1.22, spec: S['cf-goggles'], at: [1.05, 0, -1.25], yaw: -0.35, t0: 6 },
    { scale: 1.22, spec: S['cf-camo'], at: [2.35, 0.17, 0.05], yaw: -1.25, t0: 8 },
  ],
  props: [
    { id: 'burn_barrel', at: [0.1, 0, 0.25], seed: 1, opts: { wear: 0.9 }, noShadow: true },
    { id: 'chair_plastic', at: [-1.12, 0, -0.32], yaw: 1.0, seed: 1 },
    { id: 'chair_plastic', at: [-3.1, 0, 0.35], yaw: 0.5, seed: 2, opts: { tipped: true, wear: 0.9 } },
    { id: 'mattress', at: [2.35, 0, 0.3], yaw: -0.25, seed: 2, opts: { wear: 0.8 } },
    { id: 'concrete_block_tarp', at: [-2.5, 0, -2.6], yaw: 0.1, seed: 1 },
    { id: 'jersey_plain', at: [-3.6, 0, -2.0], yaw: 0.6, seed: 1 },
    { id: 'cinder_block', at: [-1.6, 0.0, -2.6], yaw: 0.2, seed: 1 },
    { id: 'drum_blue', at: [0.35, 0, -2.4], seed: 1 },
    { id: 'drum_rusty', at: [0.9, 0, -2.2], seed: 2 },
    { id: 'scrap_cart', at: [2.3, 0, -2.2], yaw: -0.35, seed: 1, size: [2.2, 1.3, 1.4] },
    { id: 'fence_broken', at: [3.9, 0, -1.1], yaw: -0.9, seed: 1 },
    { id: 'backpack_red', at: [-3.4, 0, 0.9], yaw: 0.4, seed: 1 },
    { id: 'firewood_pile', at: [-1.75, 0, 1.15], yaw: 0.3, seed: 1, scale: 0.7 },
    { id: 'firewood_split', at: [-0.75, 0, 1.3], yaw: -0.4, seed: 2, scale: 0.75 },
    { id: 'hatchet', at: [0.55, 0, 1.3], yaw: -0.5, seed: 1 },
    { id: 'backpack_yellow', at: [3.4, 0.15, 0.75], yaw: -0.6, seed: 1 },
    { id: 'sleep_roll_orange', at: [3.9, 0.12, 0.55], yaw: 0.3, seed: 1 },
  ],
  looseWeapons: [{ id: 'shotgun-pump-tape', at: [1.9, 0.2, 0.95], rx: -Math.PI / 2, rz: 0.4 }],
  fires: [{ at: [0.1, 1.45, 0.25], col: 0xff8a2a, intensity: 12, dist: 8 }],
  onInfo: (i) => { document.getElementById('miss').textContent = i.missing.length ? 'Thay tạm bằng khối: ' + i.missing.join(', ') : ''; },
});
</script>
</body>
</html>
