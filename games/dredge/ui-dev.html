<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DREDGE UI dev</title>
<link rel="stylesheet" href="css/ui.css">
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 40%, #2a4a52, #0c1618 70%); overflow: hidden; }
  #dev { position: fixed; left: 50%; top: 4px; transform: translateX(-50%); z-index: 15; max-width: 62vw; font: 12px/1.3 "Signika", sans-serif; color: #efe3c8; }
  #dev summary { cursor: pointer; text-align: center; opacity: .7; }
  #dev .box { background: rgba(8, 14, 14, .9); padding: 6px 8px; border: 1px solid #5a4a30; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #dev button { font: inherit; min-height: 26px; padding: 2px 8px; }
  #dev .row { display: flex; gap: 3px; flex-wrap: wrap; width: 100%; align-items: center; }
  #log { position: fixed; left: 6px; bottom: 6px; z-index: 10; font: 11px monospace; color: #9fb; pointer-events: none; max-width: 40vw; }
</style>
</head>
<body class="dr-ui">
<details id="dev"><summary>DEV</summary><div class="box" id="devbox"></div></details>
<pre id="log"></pre>

<script src="data/config.js"></script>
<script src="data/items.js"></script>
<script src="data/grids.js"></script>
<script src="data/ui.js"></script>
<script src="data/strings.js"></script>
<script src="data/strings-dialogue.js"></script>
<script src="data/world_data.js"></script>
<script src="data/audio.js"></script>
<script src="data/misc.js"></script>
<script src="js/grid.js"></script>
<script src="js/rules.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/hud.js"></script>
<script src="js/minigame.js"></script>
<script src="js/cargo.js"></script>
<script src="js/dock.js"></script>
<script>
  'use strict';
  DR.newGame();
  DR.view = { depthM: 18, zone: 'The Marrows', heading: 0.6, speed: 0, isDay: true,
    nearSpot: { id: 'spot1', name: 'Disturbed Water', status: 'ok', stock: 4, maxStock: 5 }, nearDock: null };
  DR.setMode('sail');
  DR.s.time = 1.5;           // ngày 2, 12:00
  DR.s.funds = 120;

  const DEST = [
    { id: 'fishmonger', cls: 'MarketDestination', titleKey: 'destination.gm-fishmonger' },
    { id: 'shipwright', cls: 'ShipyardDestination', titleKey: 'destination.gm-shipwright' },
    { id: 'storage', cls: 'StorageDestination', titleKey: 'destination.storage' },
    { id: 'rest', cls: 'RestDestination', titleKey: 'destination.rest' },
    { id: 'mayor', cls: 'CharacterDestination', speaker: 'Mayor' }
  ];
  const cod = () => ({ id: 'cod', size: 0.6, fresh: DR_CONFIG.maxFreshness });
  window.DEV = {
    result: null,
    mg(type, diff, opts) {
      opts = opts || {};
      const tbl = type === 'DREDGE_RADIAL' ? DR_CONFIG.DredgingDifficultyConfigs : DR_CONFIG.FishingDifficultyConfigs;
      DRMinigame.open({
        type, cfg: tbl[diff], speed: opts.speed || 1, trophy: !!opts.trophy, itemId: opts.itemId || (type === 'DREDGE_RADIAL' ? 'flag-1' : 'cod'),
        onDone: r => { DEV.result = r; log('onDone ' + type + ' ' + diff + ' ' + JSON.stringify(r)); }
      });
    },
    cargo(withFish) { DRCargo.open({ keys: ['INVENTORY'], title: 'Khoang thuyền', holding: withFish ? cod() : null, onClose: r => log('cargo closed ' + JSON.stringify(r)) }); },
    cod,
    dock() { if (DR.mode !== 'sail') DR.setMode('sail'); DR.setMode('dock', { dockId: 'dock.greater-marrow', destinations: DEST }); },
    setView(v) { Object.assign(DR.view, v); }
  };
  function log(t) { const l = document.getElementById('log'); l.textContent = (t + '\n' + l.textContent).slice(0, 600); }

  const box = document.getElementById('devbox');
  const add = (label, fn, parent) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; (parent || box).appendChild(b); return b; };
  const trophy = Object.assign(document.createElement('input'), { type: 'checkbox', id: 'trophy' });
  const lab = document.createElement('label'); lab.append(trophy, ' trophy'); box.appendChild(lab);
  const TYPES = ['FISHING_RADIAL', 'FISHING_PENDULUM', 'FISHING_BALL_CATCHER', 'FISHING_DIAMOND', 'FISHING_SPIRAL', 'DREDGE_RADIAL'];
  const DIFFS = ['VERY_EASY', 'EASY', 'MEDIUM', 'HARD', 'VERY_HARD'];
  for (const t of TYPES) {
    const row = document.createElement('div'); row.className = 'row'; box.appendChild(row);
    const s = document.createElement('span'); s.textContent = t.replace('FISHING_', '').replace('_RADIAL', '').slice(0, 9); s.style.width = '64px'; row.appendChild(s);
    for (const d of DIFFS) add(d.replace('VERY_', 'V').slice(0, 4), () => DEV.mg(t, d, { trophy: trophy.checked }), row).dataset.mg = t + ':' + d;
  }
  add('Cargo', () => DEV.cargo(false)).dataset.dev = 'cargo';
  add('Cargo + cá cod', () => DEV.cargo(true)).dataset.dev = 'cargo-cod';
  add('Bến Greater Marrow', () => DEV.dock()).dataset.dev = 'dock';
  add('Toast', () => DRHud.toast('Thử thông báo: đã cất cá vào khoang'));
  add('Hoảng loạn +', () => { DR.s.sanity = Math.max(0, DR.s.sanity - 0.2); });
  add('Hỏng 1 ô', () => { DRGrid.addDamage(DR.grid('INVENTORY'), DR_ITEMS, true); });
</script>
</body>
</html>
