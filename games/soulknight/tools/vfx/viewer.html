<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hiệu ứng SK 8.6</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#14161c;--pane:#1d2029;--line:#2e3340;--ink:#e6e9ef;--dim:#8d94a3;--acc:#ffcc4d;--cell:#0e1016}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 ui-monospace,Consolas,monospace}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--pane);border-bottom:1px solid var(--line)}
  header h1{margin:0 8px 0 0;font-size:15px;color:var(--acc)}
  input,select,button{font:inherit;color:var(--ink);background:#111319;border:1px solid var(--line);padding:4px 6px}
  button{cursor:pointer}
  label{display:flex;gap:4px;align-items:center;color:var(--dim)}
  #q{width:220px}
  #count{color:var(--dim)}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,200px),1fr));gap:6px;padding:10px 12px}
  .cell{background:var(--cell);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;min-width:0}
  .cell:hover{border-color:#556}
  .cell canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated}
  .cell .nm{padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .tg{padding:0 5px 4px;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .tg b{font-weight:400;color:#ff8a6a}
  nav{display:flex;gap:6px;align-items:center;padding:0 12px 16px}
  #detail{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center}
  #detail[hidden]{display:none}
  .dl{width:min(1100px,96vw);max-height:94vh;overflow:auto;background:var(--pane);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px}
  .dl canvas{image-rendering:pixelated;background:var(--cell);border:1px solid var(--line)}
  .dl h2{margin:0 0 6px;font-size:15px;color:var(--acc);word-break:break-all}
  .dl pre{margin:0;max-height:52vh;overflow:auto;font-size:11px;color:#cfd5e0;white-space:pre-wrap;word-break:break-all}
  .dl .ctl{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  #strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;grid-column:1/-1}
  #strip figure{margin:0;background:var(--cell);border:1px solid var(--line);padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px}
  #strip canvas{image-rendering:pixelated;border:0}
  #strip figcaption{font-size:10px;color:var(--dim);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:640px){.dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Hiệu ứng Soul Knight 8.6</h1>
  <input id="q" placeholder="lọc tên (regex)… vd hit_|explode">
  <select id="cat"><option value="">mọi loại</option></select>
  <select id="src"><option value="">mọi bundle</option></select>
  <label><input type="checkbox" id="slow"> chậm ×0.25</label>
  <label>phóng <select id="zoom"><option>1</option><option selected>2</option><option>3</option></select></label>
  <label>nền <select id="bg"><option value="#0e1016">tối</option><option value="#3b5a3a">cỏ</option><option value="#6b6b6b">xám</option></select></label>
  <span id="count"></span>
</header>
<main id="grid"></main>
<nav><button id="prev">‹ trang trước</button><span id="pg"></span><button id="next">trang sau ›</button></nav>
<div id="detail" hidden>
  <div class="dl">
    <div>
      <canvas id="big" width="192" height="192" style="width:576px;height:576px"></canvas>
      <div class="ctl">
        <button id="dPlay">tạm dừng</button><button id="dStep">bước 1/60 s</button><button id="dRe">phát lại</button>
        <label><input type="checkbox" id="dSlow"> chậm ×0.25</label>
        <label>trạng thái <select id="dState"></select></label>
        <label>góc <input id="dAng" type="range" min="-180" max="180" value="0"></label>
        <span id="dT"></span>
      </div>
    </div>
    <div><h2 id="dName"></h2><button id="dClose">đóng ✕</button><pre id="dInfo"></pre></div>
    <div id="strip"></div>
  </div>
</div>
<script src="../../data/sk-vfx.js"></script>
<script src="../../js/vfx.js"></script>
<script>
(function () {
  'use strict';
  const V = window.SK_VFX, X = SK.vfx;
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search);
  const names = Object.keys(V.effects).sort();
  const PER = +P.get('per') || 120, CELL = 96;
  const cats = [...new Set(names.map(n => V.effects[n].cat))].sort();
  const srcs = [...new Set(names.map(n => V.effects[n].src))].sort();
  cats.forEach(c => $('cat').add(new Option(c + ' (' + names.filter(n => V.effects[n].cat === c).length + ')', c)));
  srcs.forEach(c => $('src').add(new Option(c, c)));
  $('q').value = P.get('q') || ''; $('cat').value = P.get('cat') || ''; $('src').value = P.get('src') || '';
  $('slow').checked = P.get('slow') === '1'; $('zoom').value = P.get('zoom') || '2';
  let page = +P.get('page') || 0, list = [], cells = [];

  function filtered() {
    let re = null;
    try { re = $('q').value ? new RegExp($('q').value, 'i') : null; } catch (_) { re = null; }
    const c = $('cat').value, s = $('src').value;
    return names.filter(n => (!re || re.test(n)) && (!c || V.effects[n].cat === c) && (!s || V.effects[n].src === s));
  }
  function tags(d) {
    const ps = d.nodes.filter(n => n.ps).length, sp = d.nodes.filter(n => n.sr || n.sa).length;
    const u = (d.u || []).filter(x => /^ps:|^sr:|^comp:(Sprite|Mesh)|^clip:type212|DOTween|RandomSprite|SpriteFlip|MaterialOffset|TextureOffset/.test(x));
    return d.cat + ' · ' + d.src.replace('.ab', '') + ' · ' + (d.loop ? 'lặp' : d.dur + 's') + (ps ? ' · ' + ps + 'ps' : '') + (sp ? ' · ' + sp + 'spr' : '') +
      (u.length ? ' · <b title="' + u.join(', ') + '">⚠' + u.length + '</b>' : '');
  }
  const io = new IntersectionObserver(es => es.forEach(e => { e.target._c.vis = e.isIntersecting; }));
  function build() {
    list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / PER));
    page = Math.min(page, pages - 1);
    $('count').textContent = list.length + ' / ' + names.length + ' hiệu ứng';
    $('pg').textContent = 'trang ' + (page + 1) + ' / ' + pages;
    const g = $('grid'); g.innerHTML = ''; cells.forEach(c => io.unobserve(c.el)); cells = [];
    g.style.setProperty('--cw', (CELL * +$('zoom').value + 2) + 'px');
    for (const n of list.slice(page * PER, page * PER + PER)) {
      const d = V.effects[n];
      const el = document.createElement('div'); el.className = 'cell'; el.title = n;
      const cv = document.createElement('canvas'); cv.width = CELL; cv.height = CELL;
      el.appendChild(cv);
      el.insertAdjacentHTML('beforeend', '<div class="nm"></div><div class="tg">' + tags(d) + '</div>');
      el.querySelector('.nm').textContent = n;
      const c = { name: n, el, cv, ctx: cv.getContext('2d'), G: {}, wait: (cells.length * 0.137) % 0.7, vis: true, h: null };
      el._c = c; io.observe(el);
      el.onclick = () => openDetail(n);
      g.appendChild(el); cells.push(c);
    }
  }
  // vệt đạn (TrailRenderer, rateOverDistance) chỉ hiện khi gốc di chuyển: cho chạy vòng tròn
  // hạt mô phỏng local đi theo gốc nên chạy vòng không lộ thêm gì (vd Fire2_*: vùng lửa) -> đứng yên
  const moves = d => d.nodes.some(n => n.tr || (n.ps && (n.ps.rateDist != null || (n.ps.world && d.cat === 'trail'))));
  function respawn(c, ang) {
    X.clear(c.G);
    const d = V.effects[c.name];
    const cx = c.cv.width / 2, cy = c.cv.height / 2 + 8;
    c.mover = moves(d) ? { x: cx, y: cy, ang: 0, t: 0, cx, cy, r: c.cv.width * 0.28 } : null;
    c.h = X.spawn(c.G, c.name, cx, cy, { ang: ang || 0, dur: d.loop ? Math.max(2, d.dur) : undefined, seed: 7, follow: c.mover });
    c.wait = 0.35;
  }
  function moveCell(c, dt) {
    const m = c.mover; if (!m) return;
    m.t += dt * 5; // ~140 px/s: cỡ tốc độ đạn thật để vệt theo quãng đường đủ dày
    m.x = m.cx + Math.cos(m.t) * m.r; m.y = m.cy + Math.sin(m.t) * m.r * 0.6;
    m.ang = Math.atan2(Math.cos(m.t) * m.r * 0.6, -Math.sin(m.t) * m.r);
  }
  // lặp: sinh lại khi hiệu ứng tắt hẳn hoặc đã không vẽ gì 0.3 s (RGAutoDestory thường dài hơn phần nhìn thấy)
  function stepCell(c, dt) {
    moveCell(c, dt);
    if (c.h && c.h.t > 0.1 && c.h.drawn === 0) c.blank = (c.blank || 0) + dt; else c.blank = 0;
    if (!c.h || c.blank > 0.3 || (!c.G.vfx.length && (c.wait -= dt) <= 0)) { if ((c.wait -= dt) <= 0 || c.blank > 0.3) { respawn(c); c.blank = 0; } }
    X.update(c.G, dt);
  }
  function drawCell(c, big) {
    const ctx = c.ctx, cv = c.cv;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = $('bg').value; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.fillRect(0, cv.height / 2 + (big ? 0 : 8), cv.width, 1); ctx.fillRect(cv.width / 2, 0, 1, cv.height);
    X.draw(ctx, c.G);
  }
  // chi tiết
  const D = { c: null, play: true };
  function openDetail(n, state) {
    const cv = $('big');
    D.c = { name: n, cv, ctx: cv.getContext('2d'), G: {}, wait: 0, vis: true, h: null };
    D.play = true; $('dPlay').textContent = 'tạm dừng';
    D.c.h = null;
    $('dName').textContent = n;
    const d = V.effects[n];
    const sts = [...new Set((d.anims || []).flatMap(a => Object.keys(a.st || {})))];
    $('dState').innerHTML = '<option value="">mặc định</option>' + sts.map(x => '<option>' + x + '</option>').join('');
    $('dState').value = state && sts.includes(state) ? state : '';
    const refBy = Object.keys(V.refs).filter(k => Object.values(V.refs[k]).some(v => v === n || (Array.isArray(v) && v.includes(n)))).slice(0, 30);
    const info = JSON.parse(JSON.stringify(d));
    $('dInfo').textContent = 'được tham chiếu bởi: ' + (refBy.join(', ') || '—') + '\n\n' + JSON.stringify(info).replace(/,"(n|nodes|anims|ps|sr|sa|tr|ln|seq|curves)":/g, ',\n"$1":').slice(0, 20000);
    // mọi khung atlas hiệu ứng dùng
    const fr = new Set();
    (function walk(x) { if (typeof x === 'string') { if (V.atlas.f[x]) fr.add(x); } else if (x && typeof x === 'object') for (const k in x) walk(x[k]); })(d);
    const st = $('strip'); st.innerHTML = '';
    // phim: hiệu ứng ở các mốc 1/30 s (so với khung sprite gốc bên dưới)
    const film = document.createElement('div'); film.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;width:100%';
    const FG = {}, n30 = Math.min(30, Math.ceil(Math.min(d.dur || 1, 3) * 30) + 1);
    X.spawn(FG, n, 48, 56, { seed: 7, dur: d.loop ? Math.max(2, d.dur) : undefined, state: $('dState').value || null });
    for (let i = 0; i < n30; i++) {
      const c = document.createElement('canvas'); c.width = 96; c.height = 96; c.style.cssText = 'width:96px;height:96px';
      const x = c.getContext('2d'); x.fillStyle = $('bg').value; x.fillRect(0, 0, 96, 96);
      X.draw(x, FG);
      const fg = document.createElement('figure'); fg.appendChild(c);
      const cap = document.createElement('figcaption'); cap.textContent = 't=' + (i / 30).toFixed(3); fg.appendChild(cap);
      film.appendChild(fg);
      for (let k = 0; k < 2; k++) X.update(FG, 1 / 60);
    }
    X.clear(FG);
    st.appendChild(film);
    for (const f of fr) {
      const a = V.atlas.f[f], img = X.pages[a[0]]; if (!img) continue;
      const k = Math.max(1, Math.min(4, Math.floor(96 / Math.max(a[3], a[4]))));
      const c = document.createElement('canvas'); c.width = a[3]; c.height = a[4]; c.style.width = a[3] * k + 'px'; c.style.height = a[4] * k + 'px';
      c.getContext('2d').drawImage(img, a[1], a[2], a[3], a[4], 0, 0, a[3], a[4]);
      const fg = document.createElement('figure'); fg.appendChild(c);
      const cap = document.createElement('figcaption'); cap.textContent = f + ' ' + a[3] + '×' + a[4]; fg.appendChild(cap);
      st.appendChild(fg);
    }
    $('detail').hidden = false;
    history.replaceState(null, '', setParam('sel', n));
  }
  function detailSpawn() {
    const c = D.c; X.clear(c.G);
    const d = V.effects[c.name];
    c.mover = moves(d) ? { x: 96, y: 104, ang: 0, t: 0, cx: 96, cy: 104, r: 50 } : null;
    c.h = X.spawn(c.G, c.name, 96, 104, { ang: +$('dAng').value * Math.PI / 180, dur: d.loop ? Math.max(2, d.dur) : undefined, seed: 7, follow: c.mover, state: $('dState').value || null });
    c.wait = 0.5;
  }
  $('dClose').onclick = () => { $('detail').hidden = true; D.c = null; history.replaceState(null, '', setParam('sel', '')); };
  $('dPlay').onclick = () => { D.play = !D.play; $('dPlay').textContent = D.play ? 'tạm dừng' : 'chạy'; };
  $('dStep').onclick = () => { D.play = false; $('dPlay').textContent = 'chạy'; if (D.c) { if (!D.c.h) detailSpawn(); moveCell(D.c, 1 / 60); X.update(D.c.G, 1 / 60); } };
  $('dRe').onclick = () => D.c && detailSpawn();
  $('dAng').oninput = () => D.c && detailSpawn();
  $('dState').oninput = () => D.c && openDetail(D.c.name, $('dState').value);
  function setParam(k, v) { const u = new URL(location.href); if (v) u.searchParams.set(k, v); else u.searchParams.delete(k); return u; }

  ['q', 'cat', 'src', 'zoom'].forEach(id => $(id).addEventListener('input', () => { page = 0; build(); }));
  $('prev').onclick = () => { page = Math.max(0, page - 1); build(); scrollTo(0, 0); };
  $('next').onclick = () => { page++; build(); scrollTo(0, 0); };

  let last = performance.now();
  window.VFX_VIEWER = { cells: () => cells, X, fps: 0, frames: 0 };
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    window.VFX_VIEWER.fps = 0.9 * window.VFX_VIEWER.fps + 0.1 * (1 / Math.max(1e-3, (now - (frame.p || now - 16)) / 1000)); frame.p = now;
    window.VFX_VIEWER.frames++;
    const k = $('slow').checked ? 0.25 : 1;
    for (const c of cells) if (c.vis) { stepCell(c, dt * k); drawCell(c); }
    if (D.c) {
      const kd = $('dSlow').checked ? 0.25 : 1;
      if (D.play) { if (!D.c.h || (!D.c.G.vfx.length && (D.c.wait -= dt * kd) <= 0)) detailSpawn(); moveCell(D.c, dt * kd); X.update(D.c.G, dt * kd); }
      drawCell(D.c, true);
      $('dT').textContent = D.c.h ? 't=' + D.c.h.t.toFixed(3) + 's · hạt ' + D.c.h.sys.reduce((s, x) => s + x.parts.length, 0) : '';
    }
    requestAnimationFrame(frame);
  }
  X.load('../../').then(() => {
    build();
    if (P.get('sel') && V.effects[P.get('sel')]) openDetail(P.get('sel'), P.get('st'));
    document.body.dataset.ready = '1';
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
