<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chuyến Buôn Xác Sống</title>
    <style>
      /*
       * Khung tràn cả cửa sổ, dọc hay ngang đều được: giao diện dựng bằng uGUI lúc chạy tự xếp
       * một cột giữa màn hình, nên không cần khoá xoay như repo2d-unity.
       */
      html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        background: #161310; overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #unity-canvas {
        position: fixed; inset: 0; display: block;
        width: 100vw; height: 100vh; background: #161310; outline: none; touch-action: none;
      }
      @supports (height: 100dvh) {
        #unity-canvas { width: 100dvw; height: 100dvh; }
      }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; color: #d9cbb0; pointer-events: none;
      }
      #loading.done { display: none; }
      #loading-title { font-size: 15px; letter-spacing: .12em; color: #a08f73; }
      #loading-pct { font-size: 13px; font-variant-numeric: tabular-nums; }
      #bar { width: min(62vw, 280px); height: 6px; border-radius: 3px; background: #2a241d; }
      #bar-full { width: 0%; height: 100%; border-radius: 3px; background: #e8b04a; transition: width .2s; }
      #warning {
        position: fixed; left: 50%; top: 16px; transform: translateX(-50%); display: none;
        color: #eee; background: rgba(20,18,15,.94); padding: 10px 14px; border-radius: 8px;
        font-size: 13px; max-width: 86vw;
      }
      #warning button {
        margin-left: 8px; padding: 6px 14px; font-size: 14px; border-radius: 6px;
        border: 0; background: #e8b04a; color: #161310; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="loading-title">ĐANG TẢI</div>
      <div id="bar"><div id="bar-full"></div></div>
      <div id="loading-pct">0%</div>
    </div>
    <div id="warning"></div>
    <script>
      // import-build.js viết lại dòng này mỗi lần chép bản build mới: tên tệp mang hash nội dung.
      var BUILD = "twt-50e689f1fd";
      var canvas = document.querySelector("#unity-canvas");
      var warning = document.querySelector("#warning");
      var t0 = Date.now();

      function fail(msg) {
        if (window.__twtFailed) return;
        window.__twtFailed = true;
        console.error("[load] " + msg);
        document.querySelector("#loading").classList.add("done");
        warning.style.display = "block";
        warning.textContent = "Tải game không thành công. ";
        var b = document.createElement("button");
        b.textContent = "Tải lại";
        b.onclick = function () { location.reload(); };
        warning.appendChild(b);
      }

      var config = {
        dataUrl: "Build/" + BUILD + ".data.unityweb",
        frameworkUrl: "Build/" + BUILD + ".framework.js.unityweb",
        codeUrl: "Build/" + BUILD + ".wasm.unityweb",
        companyName: "HLO",
        productName: "The Walking Trade Slice",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === "error") fail(msg); },
      };

      var script = document.createElement("script");
      script.src = "Build/" + BUILD + ".loader.js";
      script.onerror = function () { fail("không tải được " + script.src); };
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#bar-full").style.width = (100 * p) + "%";
          document.querySelector("#loading-title").textContent = p < 0.9 ? "ĐANG TẢI" : "ĐANG KHỞI ĐỘNG";
          document.querySelector("#loading-pct").textContent =
            Math.floor(100 * p) + "% · " + Math.round((Date.now() - t0) / 1000) + " s";
        }).then(function (inst) {
          window.unityInstance = inst;
          console.log("[load] xong sau " + ((Date.now() - t0) / 1000).toFixed(1) + " s");
          document.querySelector("#loading").classList.add("done");
        }).catch(fail);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
