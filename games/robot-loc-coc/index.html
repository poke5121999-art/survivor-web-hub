<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../js/game-gate.js?v=20261103"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Xưởng Robot Lóc Cóc</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
  :root { --bg: #12151c; --panel: rgba(20, 23, 31, .86); --line: rgba(255,255,255,.09); --ink: #e9e4d8; --dim: #9aa1ad; --acc: #ffc83d; --red: #ff5a4a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center; padding: 10px 16px; flex-wrap: wrap; pointer-events: none; }
  header > * { pointer-events: auto; }
  h1 { font-size: 17px; margin: 0 6px 0 0; letter-spacing: .3px; text-shadow: 0 2px 6px #000; }
  h1 small { color: var(--acc); font-weight: 600; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .seg button { background: none; border: 0; color: var(--dim); padding: 7px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: #2b3040; color: var(--ink); }
  .seg button:hover { color: #fff; }
  #stats { position: fixed; top: 54px; left: 16px; color: var(--dim); font-size: 12px; text-shadow: 0 1px 3px #000; pointer-events: none; font-variant-numeric: tabular-nums; line-height: 1.5; }
  #stats b { color: var(--ink); font-weight: 600; }
  #dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(10,12,16,.85) 30%); }
  .row { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 3px 0; scrollbar-width: none; }
  .row::-webkit-scrollbar, .seg::-webkit-scrollbar { display: none; }
  .row > label { color: var(--dim); font-size: 12px; min-width: 72px; flex: none; }
  .chip { flex: none; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; transition: background .15s, transform .1s; }
  .chip:active { transform: scale(.96); }
  .chip.on { background: var(--acc); color: #1c1a14; border-color: transparent; font-weight: 600; }
  .chip.z.on { background: var(--red); color: #1a0f0e; }
  #tag { position: fixed; right: 16px; top: 60px; max-width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 13px; font-size: 13px; display: none; }
  #tag.show { display: block; }
  #tag h2 { margin: 0 0 4px; font-size: 15px; }
  #tag p { margin: 0; color: var(--dim); }
  .labels { position: fixed; inset: 0; pointer-events: none; }
  .lb { position: absolute; transform: translate(-50%, 0); font-size: 11px; color: var(--ink); background: rgba(15,17,23,.72); padding: 2px 7px; border-radius: 8px; white-space: nowrap; border: 1px solid var(--line); }
  .lb.z { color: #ffb4a8; }
  body.noui header, body.noui #stats, body.noui #dock, body.noui #tag, body.noui .vig, body.noui .labels { display: none; }
  @media (max-width: 640px) { h1 { font-size: 15px; width: 100%; } #stats { top: 92px; } #tag { left: 16px; right: 16px; top: auto; bottom: 120px; max-width: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<div class="labels" id="labels"></div>
<header>
  <h1>Xưởng Robot Lóc Cóc <small>robot, zombie và võ đài</small></h1>
  <div class="seg" id="modes"></div>
</header>
<div id="stats"></div>
<div id="tag"><h2 id="tagH"></h2><p id="tagP"></p></div>
<div id="dock">
  <div class="row"><label>Hoạt cảnh</label><div class="row" id="anims"></div></div>
  <div class="row"><label id="emoLabel">Biểu cảm</label><div class="row" id="emotes"></div></div>
</div>
<script type="module" src="./twt/cast-app.js"></script>
</body>
</html>
