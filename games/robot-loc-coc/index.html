<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../js/game-gate.js?v=20261103"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Xưởng Robot Lóc Cóc</title>
<style>
  :root { --bg: #12151c; --panel: rgba(20, 23, 31, .86); --line: rgba(255,255,255,.09); --ink: #e9e4d8; --dim: #9aa1ad; --acc: #ffc83d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center; padding: 10px 16px; flex-wrap: wrap; pointer-events: none; }
  header > * { pointer-events: auto; }
  h1 { font-size: 17px; margin: 0 6px 0 0; letter-spacing: .3px; text-shadow: 0 2px 6px #000; }
  h1 small { color: var(--acc); font-weight: 600; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button, .btn { background: none; border: 0; color: var(--dim); padding: 7px 12px; font: inherit; cursor: pointer; }
  .seg button.on { background: #2b3040; color: var(--ink); }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); }
  .btn:hover, .seg button:hover { color: #fff; }
  #stats { position: fixed; top: 52px; left: 16px; color: var(--dim); font-size: 12px; text-shadow: 0 1px 3px #000; pointer-events: none; font-variant-numeric: tabular-nums; }
  #dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(10,12,16,.85) 30%); }
  .row { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 3px 0; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .row > label { color: var(--dim); font-size: 12px; min-width: 72px; flex: none; }
  .chip { flex: none; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; transition: background .15s, transform .1s; }
  .chip:active { transform: scale(.96); }
  .chip.on { background: var(--acc); color: #1c1a14; border-color: transparent; font-weight: 600; }
  #info { position: fixed; right: 16px; top: 60px; width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; transform: translateX(120%); transition: transform .25s ease, visibility .25s; visibility: hidden; backdrop-filter: blur(6px); }
  #info.show { transform: none; visibility: visible; }
  #info h2 { margin: 0 0 8px; font-size: 15px; padding-right: 26px; }
  #info #ibody div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-top: 1px solid var(--line); font-size: 13px; }
  #info span { color: var(--dim); } #info b { font-weight: 600; text-align: right; }
  #close { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 8px; border: 0; background: #2b3040; color: var(--ink); cursor: pointer; font-size: 16px; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  body.noui header, body.noui #stats, body.noui #dock, body.noui #info, body.noui .vig { display: none; }
  @media (max-width: 640px) {
    h1 { font-size: 15px; width: 100%; }
    #stats { top: 86px; }
    #info { left: 16px; right: 16px; width: auto; top: auto; bottom: 120px; transform: translateY(160%); }
    #info.show { transform: none; }
    #info #ibody { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<header>
  <h1>Xưởng Robot Lóc Cóc <small>thử phong cách</small></h1>
  <div class="seg"><button id="modeL" class="on">Hàng ngũ</button><button id="modeP">Sân chơi</button></div>
  <button class="btn" id="rand">Ngẫu nhiên</button>
</header>
<div id="stats"><div id="counts"></div><div id="fps">…</div></div>
<div id="info"><button id="close" aria-label="Đóng">×</button><h2 id="iname"></h2><div id="ibody"></div><div class="hint">Hoạt cảnh và biểu cảm bên dưới chỉ áp cho robot này. Bấm chỗ trống để xem cả đội.</div></div>
<div id="dock">
  <div class="row"><label>Hoạt cảnh</label><div class="row" id="anims"></div></div>
  <div class="row"><label>Biểu cảm</label><div class="row" id="emotes"></div></div>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
