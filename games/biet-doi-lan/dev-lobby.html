<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Biệt Đội Lặn: sảnh (bản dev)</title>
<!-- Chạy riêng sảnh để thử: content + meta + ui + lobby.css, không có phần lặn.
     RA KHƠI chỉ bật một toast và đếm vào window.__sailed. -->
<link rel="stylesheet" href="css/lobby.css">
<style>
  html,body{height:100%;margin:0;background:#07080a;overflow:hidden}
  .screen{position:relative;width:100%;height:100%}
</style>
</head>
<body>
<div class="screen">
  <div class="menu" id="menu"></div>
  <div class="modal" id="modal"></div>
  <div class="toast" id="lobby-toast"></div>
</div>

<script src="data/content.js"></script>
<script src="js/meta.js"></script>
<script src="js/ui.js"></script>
<script>
  window.BDL.onSail = function () {
    window.__sailed = (window.__sailed || 0) + 1;
    BDL.ui.toast('RA KHƠI (bản dev, chưa có phần lặn).', true);
  };
  BDL.meta.load();
  BDL.ui.render();
  document.addEventListener('visibilitychange', function () { if (document.hidden) BDL.meta.save(true); });
</script>
</body>
</html>
